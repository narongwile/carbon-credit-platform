# ── API Key Secret (seeded into EMQX on first boot, role=admin) ──
---
apiVersion: v1
kind: Secret
metadata:
  name: emqx-api-key
  namespace: iiot-uat
  labels:
    app.kubernetes.io/part-of: carbon-credit-platform
type: Opaque
stringData:
  apikey_bootstrap.txt: |
    platform-admin:iothub.2026.apikey.secret:administrator
  key: platform-admin
  secret: iothub.2026.apikey.secret

# ── MQTT users Secret (consumed by seeder Job) ───────────────────
---
apiVersion: v1
kind: Secret
metadata:
  name: emqx-mqtt-users
  namespace: iiot-uat
  labels:
    app.kubernetes.io/part-of: carbon-credit-platform
type: Opaque
stringData:
  users.json: |
    [
      {"user_id":"admin",   "password":"iothub.2026", "is_superuser":true},
      {"user_id":"backend", "password":"iothub.2026", "is_superuser":false},
      {"user_id":"nodered", "password":"iothub.2026", "is_superuser":false},
      {"user_id":"device",  "password":"iothub.2026", "is_superuser":false},
      {"user_id":"ingest",  "password":"iothub.2026", "is_superuser":true}
    ]

# ── Seeder Job: POSTs users to EMQX REST API after pod is ready ──
---
apiVersion: batch/v1
kind: Job
metadata:
  name: emqx-seed-mqtt-users-v2
  namespace: iiot-uat
  labels:
    app.kubernetes.io/part-of: carbon-credit-platform
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/component: mqtt-user-seeder
    spec:
      restartPolicy: OnFailure
      containers:
        - name: seeder
          image: curlimages/curl:8.11.0
          env:
            - name: APIKEY_ID
              valueFrom:
                secretKeyRef: { name: emqx-api-key, key: key }
            - name: APIKEY_SECRET
              valueFrom:
                secretKeyRef: { name: emqx-api-key, key: secret }
          volumeMounts:
            - name: users
              mountPath: /work
              readOnly: true
          command: [sh, -ec]
          args:
            - |
              set -eu
              EMQX="http://emqx.iiot-uat.svc.cluster.local:18083"
              echo "Waiting for EMQX API ready..."
              for i in $(seq 1 60); do
                code=$(curl -s -o /dev/null -w '%{http_code}' \
                  -u "$APIKEY_ID:$APIKEY_SECRET" \
                  "$EMQX/api/v5/status" || true)
                [ "$code" = "200" ] && break
                sleep 5
              done
              echo "EMQX ready (HTTP $code). Seeding users..."

              AUTH_PATH="/api/v5/authentication/password_based%3Abuilt_in_database/users"

              cat /work/users.json | sed -e 's/^[ \t]*\[//' -e 's/\][ \t]*$//' \
                | tr '\n' ' ' | sed 's/},/}\n/g' | while read -r body; do
                [ -z "$body" ] && continue
                body=$(echo "$body" | sed 's/,$//')
                echo "→ POST $body"
                http=$(curl -s -o /tmp/r -w '%{http_code}' \
                  -u "$APIKEY_ID:$APIKEY_SECRET" \
                  -H 'Content-Type: application/json' \
                  -X POST "$EMQX$AUTH_PATH" -d "$body")
                if [ "$http" = "201" ] || [ "$http" = "200" ]; then
                  echo "  ✓ created"
                elif [ "$http" = "409" ]; then
                  echo "  • already exists — ok"
                else
                  echo "  ✗ HTTP $http: $(cat /tmp/r)"
                  exit 1
                fi
              done
              echo "Done."
      volumes:
        - name: users
          secret:
            secretName: emqx-mqtt-users
            items: [{ key: users.json, path: users.json }]

# ── External-facing Service: binds 1883/8883 on the node IP ──────
---
apiVersion: v1
kind: Service
metadata:
  name: emqx-external
  namespace: iiot-uat
  labels:
    app.kubernetes.io/part-of: carbon-credit-platform
    app.kubernetes.io/component: external-listener
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: emqx
    app.kubernetes.io/instance: emqx
  ports:
    - name: mqtt
      port: 1883
      targetPort: 1883
      nodePort: 30883
      protocol: TCP
    - name: mqttssl
      port: 8883
      targetPort: 8883
      nodePort: 30884
      protocol: TCP
    - name: dashboard
      port: 18083
      targetPort: 18083
      protocol: TCP
    - name: ws
      port: 8083
      targetPort: 8083
      protocol: TCP
    - name: wss
      port: 8084
      targetPort: 8084
      protocol: TCP

# ── ACL ConfigMap (mounted above into /opt/emqx/mount/acl/) ──────
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: emqx-acl
  namespace: iiot-uat
  labels:
    app.kubernetes.io/part-of: carbon-credit-platform
data:
  acl.conf: |
    %% ─────────────────────────────────────────────────────────
    %% EMQX ACL — file-based, evaluated top-to-bottom
    %% ─────────────────────────────────────────────────────────
    {allow, {user, "admin"}, all, ["#"]}.
    {allow, {user, "ingest"}, all, ["#"]}.
    {allow, {user, "backend"}, all, ["app/#", "$SYS/#"]}.
    {allow, {user, "nodered"}, all, ["app/#", "iot/#"]}.
    {allow, {user, "device"}, publish, [
        "devices/${clientid}/#",
        "sensors/${clientid}/#",
        "telemetry/${clientid}/#"
    ]}.
    {allow, {user, "device"}, subscribe, [
        "cmd/${clientid}/#",
        "config/${clientid}/#",
        "broadcast/#"
    ]}.
    {deny, all}.

# ── Dashboard Ingress (HTTPS via Traefik + cert-manager) ─────────
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: emqx-dashboard
  namespace: iiot-uat
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: emqx-uat.27.254.143.144.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: emqx
                port:
                  number: 18083
  tls:
    - hosts: [emqx-uat.27.254.143.144.nip.io]
      secretName: emqx-dashboard-uat-tls
