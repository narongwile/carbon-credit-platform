apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: 83.0.0 # Latest stable version
    chart: kube-prometheus-stack
    helm:
      values: |
        grafana:
          enabled: true
          service:
            type: NodePort
            nodePort: 32000
          grafana.ini:
            server:
              domain: 27.254.143.144
              root_url: http://27.254.143.144/grafana/
              serve_from_sub_path: true
        prometheus:
          prometheusSpec:
            podMonitorSelectorNilUsesHelmValues: false
            serviceMonitorSelectorNilUsesHelmValues: false
            retention: 2d
            storageSpec:
              volumeClaimTemplate:
                spec:
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 2Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true  # Fix for "annotations too long" error with large CRDs
      - Replace=true          # Help with resource recreation conflicts

