apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: 83.0.0
    chart: kube-prometheus-stack
    helm:
      values: |
        grafana:
          enabled: true
          adminUser: admin
          service:
            type: NodePort
            nodePort: 32000
          grafana.ini:
            server:
              domain: 27.254.143.144
              root_url: http://27.254.143.144/grafana/
              serve_from_sub_path: true
          sidecar:
            dashboards:
              enabled: true
              label: grafana_dashboard
              labelValue: "1"
              searchNamespace: ALL
          # Automatically provision dashboards
          dashboardProviders:
            dashboardproviders.yaml:
              apiVersion: 1
              providers:
                - name: 'default'
                  orgId: 1
                  folder: ''
                  type: 'file'
                  disableDeletion: false
                  editable: true
                  options:
                    path: /var/lib/grafana/dashboards/default
          dashboards:
            default:
              mysql-overview:
                gnetId: 7362
                revision: 5
                datasource: Prometheus
              mongodb-overview:
                gnetId: 16450
                revision: 1
                datasource: Prometheus
              mosquitto-overview:
                gnetId: 11542
                revision: 1
                datasource: Prometheus
              node-exporter-full:
                gnetId: 1860
                revision: 37
                datasource: Prometheus
        prometheus:
          prometheusSpec:
            retention: 30d
            podMonitorSelectorNilUsesHelmValues: false
            serviceMonitorSelectorNilUsesHelmValues: false
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: local-path
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 10Gi
            additionalScrapeConfigs:
              - job_name: mysql
                static_configs:
                  - targets: ["mysql.carbon-credit.svc.cluster.local:9104"]
              - job_name: mosquitto
                static_configs:
                  - targets: ["mosquitto.carbon-credit.svc.cluster.local:9234"]
        # K3s Specific Adjustments
        kubelet:
          enabled: true
          serviceMonitor:
            https: true
            insecureSkipVerify: true # Required for K3s certificate compatibility
        coreDns:
          enabled: true
          service:
            port: 9153
            targetPort: 9153
        # Disable K3s-incompatible monitors
        kubeEtcd:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeControllerManager:
          enabled: false
        kubeProxy:
          enabled: false
        # Disable Admission Webhooks for K3s stability
        prometheusOperator:
          admissionWebhooks:
            enabled: false
            patch:
              enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
