apiVersion: apps/v1
kind: Deployment
metadata:
  name: phpmyadmin
  namespace: carbon-credit
  labels:
    app: phpmyadmin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phpmyadmin
  template:
    metadata:
      labels:
        app: phpmyadmin
    spec:
      containers:
      - name: phpmyadmin
        image: phpmyadmin:latest
        ports:
        - containerPort: 80
          name: http
        env:
        - name: PMA_HOST
          value: "mysql"
        - name: PMA_PORT
          value: "3306"
        - name: PMA_ABSOLUTE_URI
          value: "https://27.254.143.144/pma/"
        - name: PMA_REVERSE_PROXY
          value: "true"
        - name: UPLOAD_LIMIT
          value: "64M"
---
apiVersion: v1
kind: Service
metadata:
  name: phpmyadmin
  namespace: carbon-credit
spec:
  type: NodePort
  ports:
  - name: http
    port: 80
    targetPort: 80
    nodePort: 32080
  selector:
    app: phpmyadmin
