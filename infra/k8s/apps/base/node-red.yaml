# ==========================================
# Node-RED: private admin service with persistence
# Public exposure should happen only through a secured Traefik route.
# ==========================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: node-red-data
  namespace: carbon-credit
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-red
  namespace: carbon-credit
  labels:
    app: node-red
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: node-red
  template:
    metadata:
      labels:
        app: node-red
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: fix-permissions
          image: busybox:latest
          command: ["sh", "-c", "chown -R 1000:1000 /data"]
          securityContext:
            runAsUser: 0 # ใช้ root เพื่อปลดล็อกสิทธิ์
          volumeMounts:
            - name: node-red-data
              mountPath: /data
      containers:
        - name: node-red
          image: nodered/node-red:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 1880
              name: http
          env:
            - name: TZ
              value: Asia/Bangkok
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - name: node-red-data
              mountPath: /data
      volumes:
        - name: node-red-data
          persistentVolumeClaim:
            claimName: node-red-data
---
apiVersion: v1
kind: Service
metadata:
  name: node-red
  namespace: carbon-credit
spec:
  type: NodePort
  ports:
    - name: http
      port: 1880
      targetPort: http
      nodePort: 30081
  selector:
    app: node-red
