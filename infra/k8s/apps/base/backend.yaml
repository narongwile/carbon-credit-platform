apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api
  namespace: app
  labels:
    app: backend-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-api
  template:
    metadata:
      labels:
        app: backend-api
    spec:
      containers:
      - name: backend
        image: registry.ci.svc.cluster.local/carbon-credit/backend:latest
        ports:
        - containerPort: 3000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: database-url
        - name: KEYCLOAK_URL
          value: "http://keycloak.auth.svc.cluster.local:8080"
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-api
  namespace: app
spec:
  selector:
    app: backend-api
  ports:
  - protocol: TCP
    port: 3000
    targetPort: 3000
