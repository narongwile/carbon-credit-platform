apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api
  namespace: app
  labels:
    app: backend-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-api
  template:
    metadata:
      labels:
        app: backend-api
    spec:
      # Init: wait for MySQL, then run idempotent migrations before the app starts.
      # With the ArgoCD PreSync Job (migrate-job.yaml) these have usually already
      # been applied, so db-migrate is a fast no-op; it also covers non-ArgoCD
      # (plain `kubectl apply`) deploys. The runner is idempotent (schema_migrations
      # table + duplicate-column/key tolerance), so concurrent replica starts are safe.
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z "$DB_HOST" "$DB_PORT"; do echo "waiting for $DB_HOST:$DB_PORT"; sleep 2; done; echo db-up']
          envFrom:
            - secretRef: { name: oneops-backend-secrets }
        - name: db-migrate
          image: registry.local/oneops-backend:latest
          command: ['node', 'dist/migrate.js']
          env:
            - { name: AUTO_SEED, value: "0" }   # never seed demo data in prod
          envFrom:
            - secretRef: { name: oneops-backend-secrets }
      containers:
      - name: backend
        image: registry.ci.svc.cluster.local/carbon-credit/backend:latest
        ports:
        - containerPort: 3000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: database-url
        - name: KEYCLOAK_URL
          value: "http://keycloak.auth.svc.cluster.local:8080"
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-api
  namespace: app
spec:
  selector:
    app: backend-api
  ports:
  - protocol: TCP
    port: 3000
    targetPort: 3000
