apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-exporter-config
  namespace: carbon-credit
data:
  .my.cnf: |
    [client]
    user=root
    password=secure-root-password
    host=127.0.0.1
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: carbon-credit
  labels:
    app: mysql
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: "secure-root-password"
        - name: MYSQL_DATABASE
          value: "carbon_credit"
        ports:
        - containerPort: 3306
          name: mysql
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
      - name: mysqld-exporter
        image: prom/mysqld-exporter:v0.16.0
        args:
        - "--config.my-cnf=/etc/mysql-exporter/.my.cnf"
        ports:
        - containerPort: 9104
          name: metrics
        volumeMounts:
        - name: exporter-config
          mountPath: /etc/mysql-exporter
      volumes:
      - name: exporter-config
        configMap:
          name: mysql-exporter-config
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: carbon-credit
spec:
  type: NodePort
  ports:
  - name: tcp
    port: 3306
    targetPort: 3306
    nodePort: 32306
  - name: metrics
    port: 9104
    targetPort: 9104
    nodePort: 32104
  selector:
    app: mysql
