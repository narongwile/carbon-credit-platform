apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: airflow
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://airflow.apache.org
    chart: airflow
    targetRevision: 1.11.0
    helm:
      valueFiles:
        - $values/frontend/infra/helm-values/airflow-values.yaml
  sources:
    - repoURL: https://airflow.apache.org
      chart: airflow
      targetRevision: 1.11.0
    - repoURL: https://gitlab.com/narongwile/carbon-credit-platform.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
