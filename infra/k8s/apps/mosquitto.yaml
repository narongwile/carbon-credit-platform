apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
  namespace: carbon-credit
  labels:
    app: mosquitto
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mosquitto
  template:
    metadata:
      labels:
        app: mosquitto
    spec:
      containers:
      - name: mosquitto
        image: eclipse-mosquitto:2.0
        ports:
        - containerPort: 1883
          name: mqtt
        - containerPort: 8883
          name: mqtts
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        # In a production environment, mount ConfigMap or Secrets here for auth
      - name: mosquitto-exporter
        image: sapcc/mosquitto-exporter:latest
        args:
        - --endpoint
        - tcp://127.0.0.1:1883
        ports:
        - containerPort: 9234
          name: metrics
---
apiVersion: v1
kind: Service
metadata:
  name: mosquitto
  namespace: carbon-credit
spec:
  type: NodePort
  ports:
  - name: mqtt
    port: 1883
    targetPort: 1883
    nodePort: 31883
  - name: mqtts
    port: 8883
    targetPort: 8883
    nodePort: 31884
  - name: metrics
    port: 9234
    targetPort: 9234
    nodePort: 32234
  selector:
    app: mosquitto
