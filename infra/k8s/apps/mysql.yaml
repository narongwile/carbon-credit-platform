apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: carbon-credit
  labels:
    app: mysql
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: "secure-root-password" # Replace in production!
        - name: MYSQL_DATABASE
          value: "carbon_credit"
        ports:
        - containerPort: 3306
          name: mysql
      - name: mysqld-exporter
        image: prom/mysqld-exporter:v1.6.0
        env:
        - name: DATA_SOURCE_NAME
          value: "root:secure-root-password@(localhost:3306)/"
        ports:
        - containerPort: 9104
          name: metrics
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: carbon-credit
spec:
  type: NodePort
  ports:
  - name: tcp
    port: 3306
    targetPort: 3306
    nodePort: 32306
  - name: metrics
    port: 9104
    targetPort: 9104
    nodePort: 32104
  selector:
    app: mysql
