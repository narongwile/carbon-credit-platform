apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: carbon-credit
  labels:
    app: mysql
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      initContainers:
      - name: init-exporter-config
        image: busybox
        command:
        - sh
        - -c
        - |
          printf "[client]\nuser=root\npassword=secure-root-password\nhost=127.0.0.1\n" > /etc/mysql-exporter/.my.cnf
        volumeMounts:
        - name: exporter-config
          mountPath: /etc/mysql-exporter
      containers:
      - name: mysql
        image: mysql:8.0
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: "secure-root-password" # Replace in production!
        - name: MYSQL_DATABASE
          value: "carbon_credit"
        ports:
        - containerPort: 3306
          name: mysql
      - name: mysqld-exporter
        image: prom/mysqld-exporter:v0.15.0
        args:
        - "--config.my-cnf=/etc/mysql-exporter/.my.cnf"
        ports:
        - containerPort: 9104
          name: metrics
        volumeMounts:
        - name: exporter-config
          mountPath: /etc/mysql-exporter
      volumes:
      - name: exporter-config
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: carbon-credit
spec:
  type: NodePort
  ports:
  - name: tcp
    port: 3306
    targetPort: 3306
    nodePort: 32306
  - name: metrics
    port: 9104
    targetPort: 9104
    nodePort: 32104
  selector:
    app: mysql
