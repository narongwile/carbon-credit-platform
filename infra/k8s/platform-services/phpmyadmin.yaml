# ============================================================
# phpMyAdmin — Official Image (replaces removed bitnami/phpmyadmin)
# Namespace: data    Connects to: mysql.data.svc.cluster.local:3306
# Public URL: https://pma.thermexpertise.com
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: phpmyadmin
  namespace: data
  labels:
    app: phpmyadmin
    app.kubernetes.io/name: phpmyadmin
    app.kubernetes.io/part-of: carbon-credit-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phpmyadmin
  template:
    metadata:
      labels:
        app: phpmyadmin
        app.kubernetes.io/name: phpmyadmin
    spec:
      containers:
        - name: phpmyadmin
          image: phpmyadmin/phpmyadmin:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          env:
            - name: PMA_HOST
              value: mysql.data.svc.cluster.local
            - name: PMA_PORT
              value: "3306"
            - name: UPLOAD_LIMIT
              value: 256M
            - name: PMA_ABSOLUTE_URI
              value: "./"
            - name: PMA_REVERSE_PROXY
              value: "true"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: phpmyadmin
  namespace: data
  labels:
    app: phpmyadmin
spec:
  type: NodePort
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30808
  selector:
    app: phpmyadmin
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: phpmyadmin
  namespace: data
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: pma.thermexpertise.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: phpmyadmin
                port:
                  number: 80
  tls:
    - hosts:
        - pma.thermexpertise.com
      secretName: phpmyadmin-tls
