# ============================================================
# Kustomize Overlay — UAT Environment
# Lower replicas, relaxed resource limits
# ============================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - mysql-migrate-job.yaml

commonAnnotations:
  environment: uat

patches:
  # ── Move Node-RED to iiot-uat namespace ──
  - target:
      labelSelector: "app=node-red"
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: iiot-uat
  - target:
      kind: Ingress
      name: node-red
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: iiot-uat
  # ── Move frontend-next to iiot-uat namespace ──
  - target:
      labelSelector: "app=frontend-next"
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: iiot-uat
  - target:
      kind: Ingress
      name: frontend-next
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: iiot-uat
  - target:
      kind: Service
      name: frontend-next
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: iiot-uat
  # ── Backend: 1 replica for UAT ──
  - target:
      kind: Deployment
      name: backend-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  # ── Frontend: 1 replica for UAT ──
  - target:
      kind: Deployment
      name: frontend-web
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  # ── AI Agents: 1 replica for UAT ──
  - target:
      kind: Deployment
      name: ai-agents
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  # ── MQTT Bridge: 1 replica for UAT ──
  - target:
      kind: Deployment
      name: mqtt-bridge
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  # ── Next.js platform UI ──
  - target:
      kind: Deployment
      name: frontend-next
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  # ── Node-RED External IP for UAT ──
  - target:
      kind: Service
      name: node-red-external
    patch: |-
      - op: replace
        path: /spec/externalIPs/0
        value: 27.254.143.144
  # ── Ingress Host Patches for UAT (nip.io) ──
  - target:
      kind: Ingress
      name: frontend-next
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: iiotplatform.27.254.143.144.nip.io
      - op: replace
        path: /spec/tls/0/hosts/0
        value: iiotplatform.27.254.143.144.nip.io
  - target:
      kind: Ingress
      name: node-red
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: nodered-uat.27.254.143.144.nip.io
      - op: replace
        path: /spec/tls/0/hosts/0
        value: nodered-uat.27.254.143.144.nip.io
  - target:
      kind: Deployment
      name: node-red
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/2/value
        value: "mqtt://emqx.iiot-uat.svc.cluster.local:1883"
      - op: replace
        path: /spec/template/spec/containers/0/env/3/value
        value: "emqx.iiot-uat.svc.cluster.local"
      - op: add
        path: /spec/template/spec/initContainers
        value:
          - name: sync-flows
            image: curlimages/curl:latest
            command:
              - "sh"
              - "-c"
              - "curl -sL https://raw.githubusercontent.com/narongwile/carbon-credit-platform/claude/unified-platform-ui-design-04HMA/backend/node-red/flows.nodered-backend.json | sed 's/mysql.data.svc.cluster.local/mysql.iiot-uat.svc.cluster.local/g' | sed 's/mqtt.data.svc.cluster.local/emqx.iiot-uat.svc.cluster.local/g' > /data/flows.json"
            volumeMounts:
              - name: node-red-data
                mountPath: /data
