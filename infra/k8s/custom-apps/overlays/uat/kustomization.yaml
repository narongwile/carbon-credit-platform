# ============================================================
# Kustomize Overlay — UAT Environment
# Lower replicas, relaxed resource limits
# ============================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  # The Job no longer mounts a ConfigMap of SQL: it runs the migrate-service
  # image, which carries backend/sql/ next to the runner that reads it. The
  # 65 KB mysql-migrations ConfigMap it used to mount is gone — with prune:true
  # ArgoCD removes it from the cluster on the next sync.
  - mysql-migrate-job.yaml
  # SMTP sink — UAT must never deliver mail to the real customer addresses it
  # shares with prod. Overlay-only on purpose: in prod this would swallow every
  # alarm. See mailpit.yaml.
  - mailpit.yaml
  # Strips any real relay out of platform_settings on every sync. Without this the
  # SMTP_* env below is inert, because mailConfig() lets the DB win. See the file
  # header for the Gmail incident that made this a hook rather than a one-off.
  - mail-sink-guard-job.yaml

commonAnnotations:
  environment: uat

patches:
  # ── Move Node-RED to iiot-uat namespace ──
  - target:
      labelSelector: "app=node-red"
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: iiot-uat
  - target:
      kind: Ingress
      name: node-red
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: iiot-uat
  # ── Move frontend-next to iiot-uat namespace ──
  - target:
      labelSelector: "app=frontend-next"
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: iiot-uat
  - target:
      kind: Ingress
      name: frontend-next
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: iiot-uat
  - target:
      kind: Service
      name: frontend-next
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: iiot-uat
  # ── Backend: 1 replica for UAT ──
  - target:
      kind: Deployment
      name: backend-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  # ── Frontend: 1 replica for UAT ──
  - target:
      kind: Deployment
      name: frontend-web
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  # ── AI Agents: 1 replica for UAT ──
  - target:
      kind: Deployment
      name: ai-agents
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  # ── MQTT Bridge: 1 replica for UAT ──
  - target:
      kind: Deployment
      name: mqtt-bridge
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  # ── Next.js platform UI ──
  - target:
      kind: Deployment
      name: frontend-next
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: add
        path: /spec/template/spec/containers/0/command
        value:
          - "sh"
          - "-c"
          # Second sed: strip Strict-Transport-Security. nginx.conf sends it
          # unconditionally with max-age=1y + includeSubDomains, which is correct
          # for prod (iiotplatform.thermexpertise.com on standard 80/443) and
          # actively breaks UAT, which is NodePort-only (30080 http / 30443
          # https, traefik-values.yaml — no service owns the real port 443).
          # A browser that ever loaded this UAT host over https:30443 caches the
          # header and, for the next YEAR, silently upgrades EVERY subsequent
          # request to that host — including a relative page load AND every
          # fetch() the app makes — to https://host/ with NO port, i.e. the real
          # port 443, which nothing answers on. The failure shows up as CORS
          # ("preflight doesn't pass access control check") and net::ERR_FAILED
          # because the browser cannot reach anything at that address, not
          # because Node-RED's CORS_ORIGIN is wrong. Already-poisoned browsers
          # need chrome://net-internals/#hsts → delete domain, since removing the
          # header here cannot retroactively clear a cache the browser already
          # holds.
          - "sed -i -e 's/carbon-credit.svc/iiot-uat.svc/g' -e '/Strict-Transport-Security/d' /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
  # ── Node-RED External IP for UAT ──
  - target:
      kind: Service
      name: node-red-external
    patch: |-
      - op: replace
        path: /spec/externalIPs/0
        value: 27.254.143.144
  # ── Ingress Host Patches for UAT (nip.io) ──
  - target:
      kind: Ingress
      name: frontend-next
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: iiotplatform.27.254.143.144.nip.io
      - op: replace
        path: /spec/tls/0/hosts/0
        value: iiotplatform.27.254.143.144.nip.io
  - target:
      kind: Ingress
      name: node-red
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: nodered-uat.27.254.143.144.nip.io
      - op: replace
        path: /spec/tls/0/hosts/0
        value: nodered-uat.27.254.143.144.nip.io
  - target:
      kind: Deployment
      name: node-red
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: node-red
      spec:
        template:
          spec:
            containers:
              - name: node-red
                env:
                  - name: MQTT_BROKER_URL
                    value: "mqtt://emqx.iiot-uat.svc.cluster.local:1883"
                  - name: MQTT_BROKER_HOST
                    value: "emqx.iiot-uat.svc.cluster.local"
                  - name: DB_HOST
                    value: "mysql.iiot-uat.svc.cluster.local"
                  # ── Mail: everything goes to the Mailpit sink, nothing leaves ──
                  # mailConfig() prefers platform_settings over every env var
                  # here (`m['smtp.host'] || env.get('SMTP_HOST')`), so these are
                  # INERT while the matching DB rows exist. mail-sink-guard-job
                  # strips them on every sync — that Job is what makes this block
                  # take effect, not a comment telling someone to run SQL.
                  - name: SMTP_HOST
                    value: "mailpit.iiot-uat.svc.cluster.local"
                  - name: SMTP_PORT
                    value: "1025"
                  # No SMTP_USER/SMTP_PASS: mailConfig() only attaches auth when
                  # a user is set, and Mailpit needs none.
                  - name: MAIL_FROM
                    value: "alerts@uat.thermexpertise.com"
                  # Password-reset links are built from this. Unset it falls back
                  # to http://localhost:3000, so every UAT reset mail shipped a
                  # dead link.
                  - name: FRONTEND_URL
                    value: "https://iiotplatform.27.254.143.144.nip.io:30443"
                  # "Open device" deep links in alarm cards. Inherited from base
                  # this is the PRODUCTION origin, so UAT alarm mail pointed
                  # engineers at the prod console for a device that only exists
                  # in UAT.
                  - name: APP_BASE_URL
                    value: "https://iiotplatform.27.254.143.144.nip.io:30443"
                  # ── Chat alarms: YOUR test channel, never a customer's ──
                  # notifyFunc uses an org's own notification_channels rows first
                  # and only falls back to these platform-wide credentials when it
                  # has none. mail-sink-guard-job disables the per-org rows — which
                  # are prod-derived and point at real customer channels — so every
                  # UAT alarm lands here instead, through the identical code path.
                  # optional: true so the pod still starts before you create the
                  # Secret; the channel is simply skipped while its token is empty.
                  - name: TELEGRAM_BOT_TOKEN
                    valueFrom:
                      secretKeyRef:
                        name: uat-notify
                        key: telegram-bot-token
                        optional: true
                  - name: TELEGRAM_CHAT_ID
                    valueFrom:
                      secretKeyRef:
                        name: uat-notify
                        key: telegram-chat-id
                        optional: true
                  - name: GOOGLE_CHAT_WEBHOOK
                    valueFrom:
                      secretKeyRef:
                        name: uat-notify
                        key: google-chat-webhook
                        optional: true
