# ============================================================
# Kustomize Overlay — UAT Environment
# Lower replicas, relaxed resource limits
# ============================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - mysql-migrate-job.yaml

commonAnnotations:
  environment: uat

patches:
  # ── Move Node-RED to iiot-uat namespace ──
  - target:
      labelSelector: "app=node-red"
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: iiot-uat
  - target:
      kind: Ingress
      name: node-red
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: iiot-uat
  # ── Move frontend-next to iiot-uat namespace ──
  - target:
      labelSelector: "app=frontend-next"
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: iiot-uat
  - target:
      kind: Ingress
      name: frontend-next
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: iiot-uat
  - target:
      kind: Service
      name: frontend-next
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: iiot-uat
  # ── Backend: 1 replica for UAT ──
  - target:
      kind: Deployment
      name: backend-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  # ── Frontend: 1 replica for UAT ──
  - target:
      kind: Deployment
      name: frontend-web
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  # ── AI Agents: 1 replica for UAT ──
  - target:
      kind: Deployment
      name: ai-agents
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  # ── MQTT Bridge: 1 replica for UAT ──
  - target:
      kind: Deployment
      name: mqtt-bridge
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  # ── Next.js platform UI ──
  - target:
      kind: Deployment
      name: frontend-next
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: add
        path: /spec/template/spec/containers/0/command
        value:
          - "sh"
          - "-c"
          - "sed -i 's/carbon-credit.svc/iiot-uat.svc/g' /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
  # ── Node-RED External IP for UAT ──
  - target:
      kind: Service
      name: node-red-external
    patch: |-
      - op: replace
        path: /spec/externalIPs/0
        value: 27.254.143.144
  # ── Ingress Host Patches for UAT (nip.io) ──
  - target:
      kind: Ingress
      name: frontend-next
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: iiotplatform.27.254.143.144.nip.io
      - op: replace
        path: /spec/tls/0/hosts/0
        value: iiotplatform.27.254.143.144.nip.io
  - target:
      kind: Ingress
      name: node-red
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: nodered-uat.27.254.143.144.nip.io
      - op: replace
        path: /spec/tls/0/hosts/0
        value: nodered-uat.27.254.143.144.nip.io
  - target:
      kind: Deployment
      name: node-red
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: node-red
      spec:
        template:
          spec:
            containers:
              - name: node-red
                env:
                  - name: MQTT_BROKER_URL
                    value: "mqtt://emqx.iiot-uat.svc.cluster.local:1883"
                  - name: MQTT_BROKER_HOST
                    value: "emqx.iiot-uat.svc.cluster.local"
                  - name: DB_HOST
                    value: "mysql.iiot-uat.svc.cluster.local"
