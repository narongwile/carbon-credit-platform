# ============================================================
# Kustomize Overlay — UAT Environment
# Lower replicas, relaxed resource limits
# ============================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

commonAnnotations:
  environment: uat

patches:
  # ── Backend: 1 replica for UAT ──
  - target:
      kind: Deployment
      name: backend-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  # ── Frontend: 1 replica for UAT ──
  - target:
      kind: Deployment
      name: frontend-web
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  # ── AI Agents: 1 replica for UAT ──
  - target:
      kind: Deployment
      name: ai-agents
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  # ── MQTT Bridge: 1 replica for UAT ──
  - target:
      kind: Deployment
      name: mqtt-bridge
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  # ── Next.js platform UI ──
  - target:
      kind: Deployment
      name: frontend-next
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  # ── Node-RED External IP for UAT ──
  - target:
      kind: Service
      name: node-red-external
    patch: |-
      - op: replace
        path: /spec/externalIPs/0
        value: 27.254.143.144
  # ── Ingress Host Patches for UAT (nip.io) ──
  - target:
      kind: Ingress
      name: frontend-next
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: iiotplatform.27.254.143.144.nip.io
      - op: replace
        path: /spec/tls/0/hosts/0
        value: iiotplatform.27.254.143.144.nip.io
  - target:
      kind: Ingress
      name: node-red
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: nodered-uat.27.254.143.144.nip.io
      - op: replace
        path: /spec/tls/0/hosts/0
        value: nodered-uat.27.254.143.144.nip.io
