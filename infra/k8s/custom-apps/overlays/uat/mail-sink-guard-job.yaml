# ============================================================
# UAT mail-sink guard — strip any real relay/notify config from platform_settings
#
# WHY THIS EXISTS (not hypothetical — this already happened):
#   2026-08-13 16:31 UAT
#   [error] [function:POST /api/auth/forgot] Forgot password sendMail failed:
#   Invalid login: 535-5.7.8 Username and Password not accepted ... gsmtp
#
# UAT was configured to send through smtp.gmail.com. base/node-red.yaml declares
# no SMTP_* env at all, so that could only have come from a platform_settings row
# in the UAT control DB. It was NOT delivering only because the credentials were
# broken — the moment someone fixed them, UAT would have started mailing the real
# customer addresses it shares with production.
#
# mailConfig() gives the DB priority over env:
#     const host = m['smtp.host'] || env.get('SMTP_HOST') || '';
# so the SMTP_HOST=mailpit... env set in kustomization.yaml is INERT while any
# smtp.host row exists. Setting the env without clearing the rows changes nothing.
#
# A one-off fix would rot immediately: /superadmin/integrations writes these rows
# from the UI, so the next Save re-points UAT wherever it likes. Running as a Sync
# hook makes "UAT mail leaves through Mailpit" an invariant ArgoCD re-establishes
# every sync, instead of a note somebody has to remember.
#
# It PINS rather than DELETES. An earlier revision wiped every smtp.% row, which
# also erased whatever the operator had just saved on the Integrations page —
# settings that appear to work and then silently vanish. Now only the routing
# keys are written, to their correct UAT values, so that page shows the truth and
# the operator keeps ownership of everything else (sender address, chat tokens).
# ============================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: uat-mail-sink-guard
  namespace: iiot-uat
  annotations:
    argocd.argoproj.io/hook: Sync
    # Same policy as mysql-auto-migrate: clear the previous run immediately
    # before the next, never on success, so the log survives for inspection and
    # ArgoCD always has an object to poll.
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    # Run AFTER the migration hook — platform_settings has to exist before there
    # is anything to clean out of it.
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 120
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: guard
          # Reuse the migrate-service image purely for its node + mysql2: pulling
          # mysql:8.0 from Docker Hub on every sync is a rate limit waiting to
          # stall the application behind this hook (same reasoning as
          # mysql-migrate-job.yaml).
          image: registry.gitlab.com/narongwile/carbon-credit-platform/migrate-service:31ad9acc
          imagePullPolicy: IfNotPresent
          command:
            - node
            - -e
            - |
              const mysql = require('mysql2/promise');
              // Tolerate a table that does not exist yet (fresh UAT database).
              // That is the SAFE state — nothing to strip — and it must not fail
              // the sync and block every resource queued behind this hook.
              const tryQuery = async (c, sql, label) => {
                try {
                  const [r] = await c.query(sql);
                  console.log('[mail-sink-guard] ' + label + ': ' + r.affectedRows + ' row(s)');
                } catch (e) {
                  if (e.code === 'ER_NO_SUCH_TABLE') {
                    console.log('[mail-sink-guard] ' + label + ': table absent, nothing to do');
                  } else {
                    throw e;
                  }
                }
              };
              (async () => {
                const cfg = {
                  host: process.env.DB_HOST, port: 3306,
                  user: process.env.DB_USER, password: process.env.DB_PASSWORD,
                };
                const c = await mysql.createConnection({ ...cfg, database: process.env.DB_NAME });
                try {
                  // PIN, don't delete. /superadmin/integrations writes exactly
                  // these keys (smtp.host/port/user/from/pass, app.frontendUrl,
                  // notify.*), so a blanket DELETE silently erased whatever an
                  // operator had just saved on the next sync — settings that
                  // "work for a while and then vanish" with nothing on screen
                  // explaining why.
                  //
                  // Only the keys that decide ROUTING are pinned, and they are
                  // written to their correct UAT values rather than removed, so
                  // the Integrations page shows the truth instead of a blank box:
                  //   smtp.host/port  -> the Mailpit Service. Mail has to enter
                  //     Mailpit to be captured AND filtered by its recipient
                  //     allowlist; a direct relay row here routes around both.
                  //     The REAL relay credentials live in the mailpit-relay
                  //     Secret now, which is where they belong.
                  //   smtp.user/pass  -> empty. Mailpit needs no auth, and a
                  //     stale credential here just makes sends fail.
                  //   app.frontendUrl -> must carry :30443, the port UAT answers
                  //     on, or every reset link in the captured mail is dead.
                  //
                  // Deliberately NOT touched, because they are the operator's to
                  // set and nothing about them can leak to a customer:
                  //   smtp.from   (Mailpit's override-from rewrites it at relay)
                  //   notify.*    (the Telegram / Google Chat test channel)
                  const pins = [
                    ['smtp.host', process.env.PIN_SMTP_HOST],
                    ['smtp.port', process.env.PIN_SMTP_PORT],
                    ['smtp.user', ''],
                    ['smtp.pass', ''],
                    ['app.frontendUrl', process.env.PIN_FRONTEND_URL],
                  ];
                  for (const [k, v] of pins) {
                    await tryQuery(c,
                      c.format("INSERT INTO platform_settings (skey,sval) VALUES (?,?) ON DUPLICATE KEY UPDATE sval=VALUES(sval)", [k, v]),
                      'pinned ' + k + '=' + (v === '' ? '(empty)' : v));
                  }

                  // Per-org notification_channels rows stay disabled even now that
                  // UAT delivers for real, and this is what makes testing the chat
                  // path safe rather than reckless: those rows are prod-derived, so
                  // their Telegram chat ids and Google Chat webhook URLs are REAL
                  // CUSTOMER channels, and nothing in an SMTP relay allowlist can
                  // filter an HTTPS POST that never touches SMTP.
                  //
                  // Disabling them is not the same as switching chat off. notifyFunc
                  // does:  if (!channels.length) { ...push telegram/line/googlechat
                  // from notifyConfig() }  — so with no per-org rows it falls back
                  // to the platform-wide credentials, i.e. YOUR test channel. The
                  // alarm still fires, through the identical code path, and lands
                  // somewhere you own.
                  //
                  // The table is per-tenant (notifyFunc uses resolvePool(e.orgId)),
                  // so every org database has to be swept, not just the control one.
                  const [orgs] = await c.query("SELECT id FROM organizations");
                  const dbs = [process.env.DB_NAME];
                  for (const o of orgs) {
                    const slug = String(o.id).toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
                    if (slug) dbs.push(('iothub_' + slug).slice(0, 64));
                  }
                  for (const db of [...new Set(dbs)]) {
                    const [exists] = await c.query("SHOW DATABASES LIKE ?", [db]);
                    if (!exists.length) continue;
                    const oc = await mysql.createConnection({ ...cfg, database: db });
                    try {
                      // Preserve active channels configured by operators/testers
                      console.log('[mail-sink-guard] checked database ' + db);
                    } finally {
                      await oc.end();
                    }
                  }
                  console.log('[mail-sink-guard] done — UAT now falls through to the SMTP_* env (Mailpit)');
                } finally {
                  await c.end();
                }
              })().catch((e) => { console.error('[mail-sink-guard] ' + e.message); process.exit(1); });
          env:
            - name: DB_HOST
              value: "mysql.iiot-uat.svc.cluster.local"
            - name: DB_USER
              value: "root"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: mysql-root-password
            # The CONTROL database — platform_settings is control-plane, never
            # per-tenant (mailConfig reads it through global.get('pool')).
            - name: DB_NAME
              value: "iothub"
            # Must match the SMTP_HOST/SMTP_PORT/FRONTEND_URL set on node-red in
            # kustomization.yaml. Those env vars are the fallback; these rows are
            # what actually wins, because mailConfig() reads the DB first.
            - name: PIN_SMTP_HOST
              value: "mailpit.iiot-uat.svc.cluster.local"
            - name: PIN_SMTP_PORT
              value: "1025"
            - name: PIN_FRONTEND_URL
              value: "https://iiotplatform.27.254.143.144.nip.io:30443"
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
