apiVersion: batch/v1
kind: Job
metadata:
  name: mysql-auto-migrate
  namespace: iiot-uat
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    spec:
      restartPolicy: Never
      initContainers:
        - name: fetch-sql
          image: alpine/git
          command:
            - sh
            - -c
            - |
              git clone --branch feature/deploy-ingest-worker --depth 1 https://gitlab.com/narongwile/carbon-credit-platform.git /workspace
          volumeMounts:
            - name: workspace
              mountPath: /workspace
      containers:
        - name: run-migrations
          image: mysql:8.0
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: mysql-root-password
          command:
            - sh
            - -c
            - |
              cd /workspace/backend/sql
              echo "Running install.sql..."
              mysql -h mysql.iiot-uat.svc.cluster.local -u root -p"$MYSQL_ROOT_PASSWORD" < install.sql
              # Discover migrations instead of listing them: the old hardcoded
              # "11 12 ... 18" silently skipped every new migrate-vN.sql, so a
              # schema change shipped in v19+ would never reach this database.
              # Start at 11 because install.sql already sources schema/bloodbox/v9/v10.
              # --force keeps going past "duplicate column" on a re-run, which is
              # what makes these files idempotent.
              echo "Running migrations (auto-discovered, v11+)..."
              for n in $(ls migrate-v*.sql 2>/dev/null | sed -E 's/migrate-v([0-9]+)\.sql/\1/' | sort -n); do
                [ "$n" -ge 11 ] || continue
                echo "Executing migrate-v${n}.sql..."
                mysql --force -h mysql.iiot-uat.svc.cluster.local -u root -p"$MYSQL_ROOT_PASSWORD" < "migrate-v${n}.sql"
              done
              echo "Migrations complete!"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
      volumes:
        - name: workspace
          emptyDir: {}
