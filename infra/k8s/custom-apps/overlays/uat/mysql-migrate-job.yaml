# ============================================================
# Deploy-time schema migration — the WHOLE schema, every database.
#
# This used to pipe backend/sql/*.sql into a mysql:8.0 client with --force. That
# had three problems, in descending order of how much they hurt:
#
#  1. It migrated the CONTROL database and nothing else. Every migration file
#     opens with `USE iothub`, so a deploy upgraded iothub and left every tenant
#     database (iothub_<org>, TENANT_DB_MODE=on) on whatever schema it had.
#     Those were brought forward only by a human remembering to
#     POST /migrate/all-orgs afterwards — and forgetting meant an org on its own
#     database running an older schema than the code deployed beside it, which
#     surfaces much later as a 503 from whichever feature needed the new table.
#
#  2. --force makes the exit code meaningless: mysql returns 0 even when every
#     statement failed. The canary assertions below the loop existed purely to
#     substitute for an exit code, and each new migration needed another one.
#
#  3. It re-ran all 31 files on EVERY sync. This is a Sync hook, so it runs on
#     every sync ArgoCD performs, including self-heal — and the whole sync waits
#     on it.
#
# It now runs the same migration runner the platform already trusts to provision
# a brand-new org (migrate-service, node dist/migrate.js). That runner keeps a
# schema_migrations table in EACH database, so an already-current database is a
# no-op costing a single SELECT rather than 31 re-executed files, and it throws
# on a real error instead of swallowing it. `--all` does the control database
# and then every tenant database, and exits non-zero if any of them is not
# current — so a green Job means the whole platform is on this schema, not
# merely that the runner finished.
#
# The SQL ships INSIDE the image (backend/Dockerfile: COPY sql ./sql) next to
# the dist/ that reads it, so schema and runner can never drift apart, and the
# mysql-migrations ConfigMap is gone — it was regenerated by hand on every
# schema change and had grown to 65 KB.
#
# The image is the CI-built, CI-pinned migrate-service tag from the GitLab
# registry, not mysql:8.0 from Docker Hub — an anonymous Docker Hub pull on
# every sync is a rate limit waiting to stall the whole application behind this
# hook.
# ============================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: mysql-auto-migrate
  namespace: iiot-uat
  annotations:
    argocd.argoproj.io/hook: Sync
    # Delete the PREVIOUS run just before creating the next one — never on
    # success. A finished Job left in place is how you read the migration log
    # afterwards, and it is what ArgoCD polls to see the hook completed.
    #
    # Do NOT add ttlSecondsAfterFinished here, and do not delete this Job by
    # hand while a sync is running: ArgoCD waits on the object it created, so a
    # Job that vanishes mid-sync leaves the sync stuck on
    # "waiting for completion of hook batch/Job/mysql-auto-migrate" forever.
    # Recovery is to terminate the sync operation, then sync again.
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  # Fail fast and visibly. With the defaults a broken migration retried 6 times
  # with backoff, and ArgoCD showed nothing but "waiting" for several minutes —
  # indistinguishable from a hang. The deadline is the backstop: a Sync hook that
  # never finishes stalls the WHOLE application, since no other resource applies
  # until it reports. 300s where the old mysql-client Job needed 600 — a no-op
  # run is now seconds, and the only slow case is a first-time tenant database.
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: run-migrations
          # Pinned by CI (deploy_images) to the same tag as the migrate-service
          # Deployment, so the Job and the provisioning service always run the
          # identical runner and the identical sql/.
          image: registry.gitlab.com/narongwile/carbon-credit-platform/migrate-service:36e335eb
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/migrate.js", "--all"]
          env:
            - name: DB_HOST
              value: "mysql.iiot-uat.svc.cluster.local"
            - name: DB_PORT
              value: "3306"
            - name: DB_USER
              value: "root"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: mysql-root-password
            # Must match Node-RED's setting, or this migrates a set of databases
            # the application does not read. When it is not "on", --all does the
            # control database only.
            - name: TENANT_DB_MODE
              value: "on"
            # Orgs that live in the control DB — the same three resolvePool()
            # hardcodes. Creating iothub_org_1 would be a database nothing reads.
            - name: CONTROL_ORG_IDS
              value: "org-1,org-2,org-3"
            # A customer org starts empty; demo rows belong only in the control
            # DB's own seed, which install-time already handled.
            - name: AUTO_SEED
              value: "0"
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "1", memory: "512Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
