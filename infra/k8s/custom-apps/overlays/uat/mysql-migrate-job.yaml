apiVersion: batch/v1
kind: Job
metadata:
  name: mysql-auto-migrate
  namespace: iiot-uat
  annotations:
    argocd.argoproj.io/hook: Sync
    # Delete the PREVIOUS run just before creating the next one — never on
    # success. A finished Job left in place is how you read the migration log
    # afterwards, and it is what ArgoCD polls to see the hook completed.
    #
    # Do NOT add ttlSecondsAfterFinished here, and do not delete this Job by
    # hand while a sync is running: ArgoCD waits on the object it created, so a
    # Job that vanishes mid-sync leaves the sync stuck on
    # "waiting for completion of hook batch/Job/mysql-auto-migrate" forever.
    # Recovery is to terminate the sync operation, then sync again.
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  # Fail fast and visibly. With the defaults a broken migration retried 6 times
  # with backoff, and ArgoCD showed nothing but "waiting" for several minutes —
  # indistinguishable from a hang. The deadline is the backstop: a Sync hook that
  # never finishes stalls the WHOLE application, since no other resource applies
  # until it reports.
  backoffLimit: 2
  activeDeadlineSeconds: 600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: run-migrations
          image: mysql:8.0
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: mysql-root-password
          command:
            - sh
            - -c
            - |
              # set -e or the job LIES. Without it a failed cd (or a missing
              # install.sql) fell through to the loop, matched nothing, printed
              # "Migrations complete!" and exited 0 — ArgoCD saw a green hook
              # while not one statement had run.
              set -e
              cd /sql
              echo "Running install.sql..."
              mysql -h mysql.iiot-uat.svc.cluster.local -u root -p"$MYSQL_ROOT_PASSWORD" < install.sql
              # Discover migrations instead of listing them: a hardcoded
              # "11 12 ... 18" silently skipped every new migrate-vN.sql, so a
              # schema change shipped in v19+ would never reach this database.
              # Start at 11 because install.sql already sources schema/bloodbox/v9/v10.
              # --force keeps going past "duplicate column" on a re-run, which is
              # what makes these files idempotent.
              echo "Running migrations (auto-discovered, v11+)..."
              found=0
              for n in $(ls migrate-v*.sql 2>/dev/null | sed -E 's/migrate-v([0-9]+)\.sql/\1/' | sort -n); do
                [ "$n" -ge 11 ] || continue
                found=$((found+1))
                echo "Executing migrate-v${n}.sql..."
                mysql --force -h mysql.iiot-uat.svc.cluster.local -u root -p"$MYSQL_ROOT_PASSWORD" < "migrate-v${n}.sql"
              done
              # Finding nothing means the mount is wrong, not that the schema is
              # up to date. Say so instead of reporting success.
              [ "$found" -gt 0 ] || { echo "FATAL: no migrate-v*.sql found in /sql"; exit 1; }
              echo "Migrations complete! ($found applied)"
          volumeMounts:
            - name: sql
              mountPath: /sql
              readOnly: true
      volumes:
        # The SQL ships WITH the manifests (mysql-migrations ConfigMap, generated
        # by infra/scripts/sync-sql-configmap.sh). The previous version cloned
        # this repo from gitlab.com in an initContainer, which put a public
        # internet round trip on the critical path of every sync: blocked egress,
        # a slow gitlab, or a moved branch left the clone hanging, the hook never
        # completed, and the entire application stopped syncing behind it.
        - name: sql
          configMap:
            name: mysql-migrations
