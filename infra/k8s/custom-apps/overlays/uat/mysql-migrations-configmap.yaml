# ============================================================
# SQL shipped to the mysql-auto-migrate Job.
# GENERATED by infra/scripts/sync-sql-configmap.sh — do not hand-edit.
# Regenerate after changing anything under backend/sql/.
#
# sync-wave -5 so this exists before the Sync-hook Job (wave 0) mounts it.
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-migrations
  namespace: iiot-uat
  labels:
    app: mysql-migrate
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
data:
  bloodbox.sql: |
    -- BloodBOX domain (ERD #4). Run after schema.sql.
    USE iothub;
    
    CREATE TABLE IF NOT EXISTS building_floors (
      id            VARCHAR(64) PRIMARY KEY,
      org_id        VARCHAR(64) NOT NULL,
      site_id       VARCHAR(64),
      building_code VARCHAR(20),
      floor_number  SMALLINT NOT NULL,
      name          VARCHAR(80),
      floorplan_url TEXT,
      width_m       DECIMAL(8,2),
      height_m      DECIMAL(8,2),
      UNIQUE KEY uq_floor (site_id, building_code, floor_number),
      INDEX (org_id)
    );
    
    CREATE TABLE IF NOT EXISTS blood_boxes (
      id          VARCHAR(64) PRIMARY KEY,
      org_id      VARCHAR(64) NOT NULL,
      site_id     VARCHAR(64),
      box_code    VARCHAR(40) UNIQUE,
      name        VARCHAR(80),
      set_low_c   DECIMAL(5,2),
      set_high_c  DECIMAL(5,2),
      capacity_units INT,
      floor_id    VARCHAR(64),
      pos_x_m     DECIMAL(8,2),
      pos_y_m     DECIMAL(8,2),
      status      ENUM('idle','in_transit','stored') DEFAULT 'idle',
      INDEX (org_id)
    );
    
    CREATE TABLE IF NOT EXISTS blood_box_locations (
      id          BIGINT AUTO_INCREMENT PRIMARY KEY,
      org_id      VARCHAR(64) NOT NULL,
      box_id      VARCHAR(64) NOT NULL,
      floor_id    VARCHAR(64),
      pos_x_m     DECIMAL(8,2),
      pos_y_m     DECIMAL(8,2),
      room_label  VARCHAR(80),
      moved_at    DATETIME(3) DEFAULT CURRENT_TIMESTAMP(3),
      moved_by    VARCHAR(120),
      is_current  TINYINT(1) DEFAULT 1,
      INDEX (box_id, is_current)
    );
    
    CREATE TABLE IF NOT EXISTS ble_beacons (
      id          VARCHAR(64) PRIMARY KEY,
      org_id      VARCHAR(64) NOT NULL,
      floor_id    VARCHAR(64) NOT NULL,
      uuid        CHAR(36) NOT NULL,
      major       SMALLINT,
      minor       SMALLINT,
      pos_x_m     DECIMAL(8,2),
      pos_y_m     DECIMAL(8,2),
      tx_power_dbm SMALLINT,
      battery_pct TINYINT,
      status      ENUM('active','inactive','low_battery') DEFAULT 'active',
      UNIQUE KEY uq_beacon (uuid, major, minor),
      INDEX (org_id), INDEX (floor_id)
    );
    
    CREATE TABLE IF NOT EXISTS blood_box_transits (
      id            VARCHAR(64) PRIMARY KEY,
      org_id        VARCHAR(64) NOT NULL,
      box_id        VARCHAR(64),
      box_code      VARCHAR(40),
      from_label    VARCHAR(120),
      to_label      VARCHAR(120),
      courier       VARCHAR(120),
      courier_phone VARCHAR(40),
      planned_eta_min INT,
      current_eta_min INT,
      departed_at   DATETIME(3),
      arrived_at    DATETIME(3),
      temp_min_c    DECIMAL(5,2),
      temp_max_c    DECIMAL(5,2),
      current_temp_c DECIMAL(5,2),
      status        ENUM('in_transit','arrived','delayed') DEFAULT 'in_transit',
      INDEX (org_id)
    );
    
    CREATE TABLE IF NOT EXISTS blood_box_journey_events (
      id          VARCHAR(64) PRIMARY KEY,
      transit_id  VARCHAR(64) NOT NULL,
      floor_id    VARCHAR(64),
      event_type  ENUM('gps_checkin','building_entered','security_pass','lift_entered','lift_exited','storage_arrived') NOT NULL,
      label       VARCHAR(160),
      `signal`      ENUM('GPS','BLE','BAROMETER','MANUAL') NOT NULL,
      lat         DECIMAL(10,7),
      lng         DECIMAL(10,7),
      pos_x_m     DECIMAL(8,2),
      pos_y_m     DECIMAL(8,2),
      temp_c      DECIMAL(5,2),
      battery_pct TINYINT,
      ts          DATETIME(3) DEFAULT CURRENT_TIMESTAMP(3),
      INDEX (transit_id)
    );
  install.sql: |
    -- ONEOPS — fresh-install migration (run order for an EMPTY database).
    -- Run from the sql/ directory:  cd backend/sql && mysql -h HOST -u admin -p < install.sql
    -- (SOURCE resolves paths from the client's working directory.)
    --
    -- schema.sql + bloodbox.sql cover the v2–v8 objects (already absorbed). The
    -- v9/v10 objects (readings.quality, device_presence.*, alarm_rules.debounce_json,
    -- ota_releases, ota_deployments, transport_events, edge_alarm_log,
    -- offline_sync_log, blood_box_transit_telemetry, …) are NOT in schema.sql, so a
    -- fresh install must also source migrate-v9 + migrate-v10 to be complete. These
    -- two run cleanly here because their objects don't yet exist in a fresh DB
    -- (CREATE TABLE IF NOT EXISTS + plain ADD COLUMN on absent columns).
    
    SOURCE schema.sql;        -- 1) core schema (creates db `iothub` + all core tables)
    SOURCE bloodbox.sql;      -- 2) BloodBOX domain tables
    SOURCE migrate-v9.sql;    -- 3) firmware reliability + OTA + offline buffer tables
    SOURCE migrate-v10.sql;   -- 4) firmware v2 telemetry: reading quality + presence health/pos
    SOURCE seed-nodes.sql;    -- 5) (optional) demo fleet: nodes + geo + mqtt_prefix
    SOURCE seed-tenancy.sql;  -- 6) (optional) demo orgs/users/entitlements/event-problems
    
    SELECT 'ONEOPS schema installed' AS status;
  migrate-v10.sql: |
    -- migrate-v10.sql — firmware v2.0 telemetry: reading quality + live health/position
    --
    -- Closes the gaps between what the ESP32 v2 firmware now emits and the schema.
    -- Plain ALTERs (portable MySQL/MariaDB); migrate.ts records each file once and
    -- tolerates duplicate-column / duplicate-key errors on re-run.
    --
    -- NOTE: adding the columns is only half the job — the Node-RED `normalize`/ingest
    -- flow (and the heartbeat handler) must be updated to WRITE these new columns,
    -- otherwise they stay at their defaults. See firmware/esp32 payloads.
    USE iothub;
    
    -- 1) Reading data quality (spec §16) — distinguish a real value from a dead
    --    sensor. Firmware sends quality = good | sim | error  (sim = demo fallback);
    --    'stale' is reserved for cloud-side aging. Without this a "0 C" reading and
    --    a broken probe are indistinguishable.
    ALTER TABLE readings        ADD COLUMN quality ENUM('good','sim','error','stale') NOT NULL DEFAULT 'good' AFTER value;
    ALTER TABLE readings_rollup ADD COLUMN bad_n   INT DEFAULT 0 AFTER n;   -- count of non-good samples in the bucket
    
    -- 2) Live device health + position carried by the heartbeat (presence dashboard).
    --    Heartbeat now sends: uptime, heap, time_src, transport, and for bloodbox
    --    transit (FSM state) + lat/lng (live GPS).
    ALTER TABLE device_presence ADD COLUMN uptime_s  INT           AFTER fw;
    ALTER TABLE device_presence ADD COLUMN heap      INT           AFTER uptime_s;
    ALTER TABLE device_presence ADD COLUMN time_src  VARCHAR(12)   AFTER heap;       -- ntp|lorawan|rtc|uptime
    ALTER TABLE device_presence ADD COLUMN transport VARCHAR(8)    AFTER time_src;   -- wifi|4g|lora|none
    ALTER TABLE device_presence ADD COLUMN transit   VARCHAR(16)   AFTER transport;  -- bloodbox: idle|in_transit|arrived|stored
    ALTER TABLE device_presence ADD COLUMN lat       DECIMAL(10,7) AFTER transit;    -- bloodbox live GPS
    ALTER TABLE device_presence ADD COLUMN lng       DECIMAL(10,7) AFTER lat;
    
    -- 3) Index diag-log codes for fast fault queries (HW_SD_FAIL, LINK_OFFLINE, …).
    --    diag/log payload already lands in device_logs.payload; pull the code out so
    --    it is queryable/indexable.
    ALTER TABLE device_logs ADD COLUMN code VARCHAR(40) AFTER level;
    ALTER TABLE device_logs ADD INDEX idx_logs_code (code, ts);
    
    -- 4) Transport enums accept both '4g' and 'lte' — firmware/UI may report either,
    --    so heartbeat/failover inserts never truncate.
    ALTER TABLE transport_events            MODIFY from_transport ENUM('wifi','4g','lte','lora','none') NOT NULL;
    ALTER TABLE transport_events            MODIFY to_transport   ENUM('wifi','4g','lte','lora','none') NOT NULL;
    ALTER TABLE blood_box_transit_telemetry MODIFY transport      ENUM('wifi','4g','lte','lora') DEFAULT 'wifi';
    
    -- 5) Mark whether an alarm row came from the firmware edge fast-path or the
    --    cloud engine, and add the transit_state to the high-freq transit telemetry.
    ALTER TABLE edge_alarm_log             ADD COLUMN source        ENUM('edge','cloud') NOT NULL DEFAULT 'edge' AFTER severity;
    ALTER TABLE blood_box_transit_telemetry ADD COLUMN transit_state VARCHAR(16) AFTER transport;  -- idle|in_transit|arrived|stored
  migrate-v11.sql: |
    -- migrate-v11.sql — forgot-password + employee directory + org geo fallback
    -- (for EXISTING databases; schema.sql already contains these for fresh installs).
    -- Plain ALTERs (portable MySQL 8.x); migrate.ts records each file once and
    -- tolerates duplicate-column errors, so this stays idempotent.
    USE iothub;
    
    -- 1) Password reset tokens (forgot-password flow). token holds a signed JWT, so
    --    it needs room beyond 128 chars → VARCHAR(255).
    CREATE TABLE IF NOT EXISTS password_resets (
      token      VARCHAR(255) PRIMARY KEY,
      user_id    VARCHAR(64) NOT NULL,
      expires_at DATETIME(3) NOT NULL,
      used       TINYINT(1) DEFAULT 0,
      created_at DATETIME(3) DEFAULT CURRENT_TIMESTAMP(3),
      INDEX (user_id)
    );
    -- Widen the token column if the table pre-existed with VARCHAR(128).
    ALTER TABLE password_resets MODIFY token VARCHAR(255);
    
    -- 2) Employee directory (CSV allowlist → auto-assign a matched registrant as
    --    a viewer on their org/department at signup time).
    CREATE TABLE IF NOT EXISTS org_directory (
      id            VARCHAR(64) PRIMARY KEY,
      org_id        VARCHAR(64) NOT NULL,
      name          VARCHAR(120),
      email         VARCHAR(160),
      phone         VARCHAR(40),
      department_id VARCHAR(64),
      created_at    DATETIME(3) DEFAULT CURRENT_TIMESTAMP(3),
      INDEX (org_id), INDEX (email), INDEX (phone), INDEX (name)
    );
    
    -- 3) Org factory geo fallback — ETERNITY transformer sensors have no GPS, so the
    --    admin pins the factory location once and all its nodes plot there.
    ALTER TABLE organizations ADD COLUMN lat DECIMAL(10,7);
    ALTER TABLE organizations ADD COLUMN lng DECIMAL(10,7);
  migrate-v12.sql: |
    -- migrate-v12.sql — zero-touch device onboarding (auto-register pending nodes)
    -- for EXISTING databases. schema.sql carries these for fresh installs; the ALTERs
    -- backfill an existing `nodes` table. migrate.ts tolerates duplicate-column errors.
    USE iothub;
    
    -- Onboarding lifecycle. Existing rows default to 'active' (already provisioned).
    -- A device that publishes telemetry with an unknown id is auto-created as
    -- 'pending' (org derived from its MQTT topic) and waits for admin approval.
    ALTER TABLE nodes ADD COLUMN status ENUM('pending','active','rejected') NOT NULL DEFAULT 'active';
    ALTER TABLE nodes ADD COLUMN first_seen DATETIME(3) DEFAULT CURRENT_TIMESTAMP(3);
    ALTER TABLE nodes ADD INDEX idx_nodes_status (status);
  migrate-v13.sql: |
    -- migrate-v13.sql — dedicated floor-plan image storage (for EXISTING databases).
    -- schema.sql carries this for fresh installs; migrate.ts records the file once.
    USE iothub;
    
    -- Floor-plan layout images: bytes (LONGBLOB) + a served path (image_url), keyed by
    -- org + floor. Previously the whole floorplan blob (incl. images) was crammed into
    -- user_prefs.prefs (TEXT, 64 KB) as an ephemeral blob: URL — which never persisted.
    CREATE TABLE IF NOT EXISTS floorplans (
      org_id       VARCHAR(64) NOT NULL,
      floor_id     VARCHAR(64) NOT NULL,
      image_url    VARCHAR(512),
      image_data   LONGBLOB,
      content_type VARCHAR(100),
      updated_at   DATETIME(3) DEFAULT CURRENT_TIMESTAMP(3) ON UPDATE CURRENT_TIMESTAMP(3),
      PRIMARY KEY (org_id, floor_id)
    );
  migrate-v14.sql: |
    -- migrate-v14.sql — zero-touch onboarding hardening (for EXISTING databases).
    -- schema.sql carries these for fresh installs; migrate.ts records the file once.
    -- The runner tolerates ER_DUP_FIELDNAME / ER_DUP_ENTRY so re-runs are safe.
    USE iothub;
    
    -- Store the latest telemetry sample for a device so the pending-approval screen
    -- can show an admin the actual readings before they approve the device.
    ALTER TABLE device_presence ADD COLUMN last_sample JSON;
    
    -- Claimable pool for devices whose MQTT topic org does not match a real org.
    -- The worker auto-registers such orphans here; only a superadmin sees and
    -- reassigns them. Suspended so it can never behave like a real tenant.
    INSERT IGNORE INTO organizations (id, name, status) VALUES ('__unassigned__', 'Unassigned / Pending Claim', 'suspended');
  migrate-v15.sql: |
    -- migrate-v15.sql — maintenance-report downloads + report delivery channels
    -- (for EXISTING databases). schema.sql carries these for fresh installs; the
    -- runner tolerates ER_DUP_FIELDNAME so re-runs are safe.
    USE iothub;
    
    -- Store a document's MIME type so downloads open correctly (PDF, image, …).
    ALTER TABLE documents ADD COLUMN content_type VARCHAR(100);
    
    -- Scheduled reports can deliver by email or Telegram; recipients holds the
    -- email(s) for email, or the Telegram chat id for telegram.
    ALTER TABLE report_schedules ADD COLUMN channel ENUM('email','telegram') NOT NULL DEFAULT 'email';
  migrate-v16.sql: |
    -- migrate-v16.sql — org+domain default alarm rule / telemetry param set
    -- (for EXISTING databases). schema.sql carries this for fresh installs; the
    -- runner tolerates ER_TABLE_EXISTS_ERROR so re-runs are safe.
    USE iothub;
    
    -- Set at provision time (before any device exists) and used to seed a node's
    -- alarm_rules the moment it is approved (zero-touch) or manually provisioned.
    CREATE TABLE IF NOT EXISTS org_domain_rules (
      org_id        VARCHAR(64) NOT NULL,
      domain        VARCHAR(32) NOT NULL,
      rule_json     JSON NOT NULL,
      debounce_json JSON,
      updated_by    VARCHAR(120),
      updated_at    DATETIME(3) DEFAULT CURRENT_TIMESTAMP(3) ON UPDATE CURRENT_TIMESTAMP(3),
      PRIMARY KEY (org_id, domain)
    );
  migrate-v17.sql: |
    -- migrate-v17.sql — global platform settings (superadmin-managed SMTP/sender)
    -- (for EXISTING databases). schema.sql carries this for fresh installs; the
    -- runner tolerates ER_TABLE_EXISTS_ERROR so re-runs are safe. The backend also
    -- self-heals this table on first write, so migration ordering is not critical.
    USE iothub;
    
    -- Key-value; the SMTP password (smtp.pass) is stored AES-GCM encrypted by the app.
    CREATE TABLE IF NOT EXISTS platform_settings (
      skey       VARCHAR(64) PRIMARY KEY,
      sval       TEXT,
      updated_at DATETIME(3) DEFAULT CURRENT_TIMESTAMP(3) ON UPDATE CURRENT_TIMESTAMP(3)
    );
  migrate-v18.sql: |
    -- Migration v18 — Catch-up missing schema changes
    -- These were added to schema.sql/bloodbox.sql but missing from prior migrations.
    USE iothub;
    
    -- 1. Add phone column to users (was missing from all previous migrations)
    ALTER TABLE users ADD COLUMN phone VARCHAR(40);
    
    -- 2. Create blood_box_journey_events (was in bloodbox.sql but not in any migrate-vX)
    CREATE TABLE IF NOT EXISTS blood_box_journey_events (
      id VARCHAR(64) PRIMARY KEY,
      transit_id VARCHAR(64) NOT NULL,
      floor_id VARCHAR(64),
      event_type VARCHAR(64),
      label VARCHAR(120),
      `signal` VARCHAR(32),
      lat FLOAT,
      lng FLOAT,
      pos_x_m FLOAT,
      pos_y_m FLOAT,
      temp_c FLOAT,
      battery_pct FLOAT,
      created_at DATETIME(3) DEFAULT CURRENT_TIMESTAMP(3)
    );
  migrate-v19.sql: |
    -- migrate-v19.sql — split "link lost" from "device offline"
    --
    -- The presence sweep used one threshold, so LINK_LOST and DEVICE_OFFLINE were
    -- written in the same pass and carried the same timestamp — the connectivity
    -- timeline showed both at e.g. 23:10 and never told the operator that the link
    -- had already been silent for half a minute before the device was declared
    -- offline.
    --
    -- Detecting the earlier stage needs the time of the last stored READING, which
    -- is not the same as last_seen: last_seen also moves on heartbeat/status frames
    -- (every 30s), so a device whose sensors stopped while MQTT stayed up would
    -- flap in and out of a short last_seen window. The ingest worker now stamps
    -- last_reading_at only when it actually persists readings, and the sweep raises
    -- LINK_LOST from that column.
    USE iothub;
    
    ALTER TABLE device_presence ADD COLUMN last_reading_at DATETIME(3) NULL AFTER last_seen;
    
    -- The sweep scans "online devices whose readings went quiet", every tick.
    ALTER TABLE device_presence ADD INDEX idx_presence_reading (online, last_reading_at);
  migrate-v2.sql: |
    -- Migration v2 — run ONCE on an existing DB created before:
    --   • alarm auto-clear / offline events  (alarm_events.cleared_at, kind 'offline')
    --   • device downlink                    (nodes.mqtt_prefix)
    -- Fresh installs already get these from schema.sql. MySQL lacks ADD COLUMN
    -- IF NOT EXISTS, so run each line once (errors on re-run are harmless).
    USE iothub;
    
    ALTER TABLE alarm_events MODIFY COLUMN kind ENUM('threshold','rate','offline') NOT NULL;
    ALTER TABLE alarm_events ADD COLUMN cleared_at DATETIME(3) NULL;
    ALTER TABLE alarm_events ADD INDEX (cleared_at);
    ALTER TABLE nodes ADD COLUMN mqtt_prefix VARCHAR(255);
  migrate-v20.sql: |
    -- migrate-v20.sql — one physical asset published across several MQTT topics
    --
    -- An ETERNITY transformer can be wired as two feeds: the power meter publishes
    -- the electrical set (VoltAB, CurrentA, ActivepowerTotal, THD_*, kWh, …) on one
    -- topic, and the box sensor publishes the environmental/DGA set (Oiltemp, H2,
    -- OilMoisture, Tbox, RHbox, Tamb, RHamb) on another. Each topic carries its own
    -- nodeId, so zero-touch onboarding registered them as two unrelated devices:
    -- the fleet listed one transformer twice, and — worse — the alarm rules that
    -- matter most for a transformer (oil temperature, dissolved hydrogen, moisture)
    -- sat on a node that had no electrical context and could never be reached from
    -- the transformer the operator actually opens.
    --
    -- merge_into names the node this feed belongs to. The ingest worker stores the
    -- readings under that node instead of the publishing one, so both topics land
    -- on a single device for readings, alarms, trends and reports; the secondary
    -- row is kept (it records which topic the data arrived on, and clearing the
    -- column splits the feeds apart again) but is hidden from the fleet.
    --
    -- NULL = an ordinary standalone device, which is every existing row.
    USE iothub;
    
    ALTER TABLE nodes ADD COLUMN merge_into VARCHAR(64) NULL AFTER status;
    
    -- The fleet query filters on "not a secondary feed" on every listing, and the
    -- worker resolves a publishing node to its primary on every telemetry frame.
    ALTER TABLE nodes ADD INDEX idx_nodes_merge_into (merge_into);
  migrate-v21.sql: |
    -- migrate-v21.sql — sites as real data, so floor plans can hang off them
    --
    -- nodes.site_id has always existed, but there was nothing to point it at: the
    -- site list lived in the frontend's seed file, so every organization saw the
    -- same four hardcoded sites and a customer's real ones could not be entered at
    -- all. Floor plans had the same problem one level down — the floors were a
    -- hardcoded "Building A · Floor 1/2/B1" const shared by every tenant.
    --
    -- A site is the physical place a customer operates (a substation, a plant, a
    -- hospital wing). Floor plans are reached THROUGH it, and its lat/lng is the
    -- fallback pin for devices that have no GPS of their own.
    USE iothub;
    
    CREATE TABLE IF NOT EXISTS sites (
      id         VARCHAR(64) PRIMARY KEY,
      org_id     VARCHAR(64) NOT NULL,
      name       VARCHAR(160) NOT NULL,
      address    VARCHAR(255),
      -- Anchor for the site itself. A floor plan georeference (see floorplans
      -- below) is what turns a pin into a device coordinate; this is the coarser
      -- "where is this place" used by the map when a device has neither.
      lat        DECIMAL(10,7),
      lng        DECIMAL(10,7),
      created_at DATETIME(3) DEFAULT CURRENT_TIMESTAMP(3),
      INDEX idx_sites_org (org_id)
    );
    
    -- Georeference for a floor plan image: the real-world coordinates of its
    -- north-west and south-east corners. Without this a pin is only an x/y percent
    -- of an image and cannot become a lat/lng — which is precisely what an ETERNITY
    -- transformer needs, since the same asset has to appear on the GPS map. With
    -- the two corners, x/y% ↔ lat/lng is a linear interpolation in both directions,
    -- so dropping a pin fills the coordinate inputs and typing a coordinate moves
    -- the pin.
    --
    -- Nullable throughout: a plan with no georeference still works for indoor
    -- placement, it just cannot sync coordinates.
    ALTER TABLE floorplans ADD COLUMN site_id VARCHAR(64) NULL AFTER floor_id;
    ALTER TABLE floorplans ADD COLUMN nw_lat DECIMAL(10,7) NULL;
    ALTER TABLE floorplans ADD COLUMN nw_lng DECIMAL(10,7) NULL;
    ALTER TABLE floorplans ADD COLUMN se_lat DECIMAL(10,7) NULL;
    ALTER TABLE floorplans ADD COLUMN se_lng DECIMAL(10,7) NULL;
    ALTER TABLE floorplans ADD INDEX idx_floorplans_site (site_id);
  migrate-v22.sql: |
    -- migrate-v22.sql — users.username as a real, stored login handle
    --
    -- The admin "New User" form has always had a Username field, and the login
    -- screen has always labelled its first input "Username" — but there was no such
    -- column. The form silently dropped the value (only email/name/role/department
    -- were ever sent), the user list showed `email || id` in that column, and login
    -- resolved strictly by email. So an admin typed a username, saved, and got back
    -- an email address: the field looked functional and stored nothing.
    --
    -- It is stored now, and login accepts EITHER identifier. Unique per organization
    -- rather than globally: two different customers may each have an "admin", and a
    -- global constraint would let the first tenant to claim a name take it from
    -- everyone else.
    USE iothub;
    
    ALTER TABLE users ADD COLUMN username VARCHAR(64) NULL AFTER email;
    
    -- NULLs are exempt from a UNIQUE index in MySQL, so existing rows (which have no
    -- username yet) do not collide with each other while they are being filled in.
    ALTER TABLE users ADD UNIQUE KEY uq_users_org_username (org_id, username);
  migrate-v23.sql: |
    -- migrate-v23.sql — dashboard themes granted per department
    --
    -- The "Dashboard View Permission" tab has always rendered: it lists the
    -- organization's departments, shows the themes the superadmin licensed, and
    -- lets an admin toggle them. None of it was stored. Departments were loaded
    -- with a hardcoded themeIds: ['th-overview'], every toggle lived in React state
    -- only, and a reload put it back — so the screen described a policy the system
    -- did not have.
    --
    -- A join table rather than a JSON column on departments: the question actually
    -- asked at render time is "which departments may see this theme", and the
    -- reverse, "which themes may this department see" — both are one indexed lookup
    -- here, and a theme being revoked org-wide is one DELETE.
    USE iothub;
    
    CREATE TABLE IF NOT EXISTS department_themes (
      department_id VARCHAR(64)  NOT NULL,
      theme_id      VARCHAR(64)  NOT NULL,
      -- Denormalised so the org's whole policy can be read (and wiped, on
      -- provisioning changes) without joining departments.
      org_id        VARCHAR(64)  NOT NULL,
      PRIMARY KEY (department_id, theme_id),
      INDEX idx_dept_themes_org (org_id)
    );
  migrate-v24.sql: |
    -- migrate-v24.sql — org logos as bytes, not a data URL in organizations
    --
    -- Uploading a logo returned 500. The Settings page sends the image as a base64
    -- data: URL and brandingPut wrote it straight into organizations.logo_url,
    -- which is TEXT — 65,535 bytes. Base64 inflates by ~4/3, so the page's own
    -- 512 KB limit produces roughly 683 KB and even a modest 100 KB PNG lands near
    -- 137 KB. Under MySQL 8's default STRICT_TRANS_TABLES that is ER_DATA_TOO_LONG
    -- (1406), an error rather than a silent truncation — so effectively every real
    -- logo failed, the row was never written, and a refresh showed the default.
    --
    -- Widening the column would have fixed the write and created a worse problem:
    -- GET /api/orgs does SELECT * and runs on every page load (the sidebar brand
    -- hydrates from it), so each org's full base64 would ship on every navigation.
    -- The bytes live in their own table and are served by their own endpoint —
    -- exactly what floorplans already do — leaving logo_url holding only the short
    -- path to them.
    USE iothub;
    
    CREATE TABLE IF NOT EXISTS org_logos (
      org_id       VARCHAR(64) PRIMARY KEY,
      image_data   LONGBLOB,
      content_type VARCHAR(100),
      updated_at   DATETIME(3) DEFAULT CURRENT_TIMESTAMP(3) ON UPDATE CURRENT_TIMESTAMP(3)
    );
  migrate-v25.sql: |
    -- migrate-v25.sql — a user can belong to more than one department
    --
    -- The admin form has always offered "Assign Departments (organize)" as a
    -- multi-select, and the type behind it is departmentIds: string[]. Storage was
    -- never plural: users.department_id is a single column, and saveUser sent
    -- departmentIds[0]. Picking three departments silently kept the first and
    -- discarded the rest, and every access decision downstream (product_access,
    -- the fleet's department filter, dashboard-theme visibility) then reasoned
    -- about one department the admin may not even have meant.
    --
    -- users.department_id is kept and mirrors the FIRST membership, so existing
    -- queries that read it keep working while callers migrate to the set.
    USE iothub;
    
    CREATE TABLE IF NOT EXISTS user_departments (
      user_id       VARCHAR(64) NOT NULL,
      department_id VARCHAR(64) NOT NULL,
      PRIMARY KEY (user_id, department_id),
      INDEX idx_user_departments_dept (department_id)
    );
    
    -- Backfill from the column so nobody loses the membership they already had.
    INSERT IGNORE INTO user_departments (user_id, department_id)
    SELECT id, department_id FROM users WHERE department_id IS NOT NULL AND department_id <> '';
  migrate-v26.sql: |
    -- migrate-v26.sql — which parameters a product's devices actually display
    --
    -- SENSOR READINGS was never configurable. Every display path read the hardcoded
    -- ALARM_SCHEMA list in the frontend: the node page showed each schema param the
    -- device reported plus any unrecognised key, and the transformer page showed six
    -- fixed slots and nothing else. AlarmParamConfig looks like the place to change
    -- this but only edits warn/critical thresholds.
    --
    -- That was tolerable while a transformer sent six values. A two-topic asset
    -- (electrical meter + box sensor merged onto one node) reports around forty, and
    -- an operator watching for oil temperature should not have to find it among
    -- THD_VoltCA and ApparentpowerB.
    --
    -- Scoped to org+domain, with an optional per-node override — the same shape the
    -- alarm rules already use (org_domain_rules seeds alarm_rules), so an admin
    -- configures a product once rather than device by device.
    --
    -- No rows for a scope means "not configured" and everything is shown. An empty
    -- selection cannot be expressed, deliberately: a device page showing nothing is
    -- never what someone meant, and a fail-closed reading would blank every existing
    -- dashboard the moment this deploys.
    USE iothub;
    
    CREATE TABLE IF NOT EXISTS display_params (
      org_id    VARCHAR(64) NOT NULL,
      domain    VARCHAR(32) NOT NULL,
      -- NULL = the default for every device of this product in the org.
      node_id   VARCHAR(64) NULL,
      param_key VARCHAR(64) NOT NULL,
      -- Display order; ties fall back to the order the device reports them in.
      position  INT NOT NULL DEFAULT 0,
      INDEX idx_display_params_scope (org_id, domain, node_id)
    );
    
    -- A node-level override and an org default can hold the same key, so the unique
    -- key has to include node_id. MySQL treats NULLs as distinct in a UNIQUE index,
    -- which is exactly wrong for "one row per org default" — so the org default is
    -- keyed on a sentinel instead of NULL.
    ALTER TABLE display_params ADD COLUMN node_scope VARCHAR(64)
      AS (IFNULL(node_id, '*')) STORED;
    ALTER TABLE display_params
      ADD UNIQUE KEY uq_display_params (org_id, domain, node_scope, param_key);
  migrate-v27.sql: |
    -- migrate-v27.sql — a photo of the actual device, replacing the generic 3D twin
    --
    -- The node detail page renders Transformer3D: one hand-modelled unit, drawn
    -- identically for every transformer in every organization. ETERNITY's customers
    -- run units from pole-mounted distribution transformers to 2500 kVA oil-immersed
    -- power transformers, so the model on screen matched the asset in the field
    -- almost never — while looking exactly like a faithful digital twin of it. A
    -- picture that is wrong is worse than no picture, because nobody doubts it.
    --
    -- An admin uploads the real photo (or a spec drawing / nameplate shot) and every
    -- role sees the same image: a viewer diagnosing an alarm at 2am needs to
    -- recognise the unit they are being sent to.
    --
    -- Bytes in their own table, exactly like org_logos (migrate-v24) and floorplans:
    -- nodes is read by the fleet list on every page load, and a LONGBLOB column on it
    -- would ship megabytes with each SELECT.
    --
    -- Lives in the ORG database. `nodes` does, and a photo of a device that is not in
    -- the same database as the device is a row nothing can join to.
    USE iothub;
    
    CREATE TABLE IF NOT EXISTS node_images (
      node_id      VARCHAR(64) PRIMARY KEY,
      image_data   LONGBLOB,
      content_type VARCHAR(100),
      -- Shown under the photo: "2500 kVA ONAN, nameplate 2019" says more than the
      -- filename does, and the person who needs it is standing in front of the unit.
      caption      VARCHAR(255),
      updated_by   VARCHAR(120),
      updated_at   DATETIME(3) DEFAULT CURRENT_TIMESTAMP(3) ON UPDATE CURRENT_TIMESTAMP(3)
    );
  migrate-v28.sql: |
    -- migrate-v28.sql — department-scoped parameter display, and theme grants that
    -- are actually stored
    --
    -- Two halves of the same complaint: the admin screens describe policies the
    -- database cannot hold.
    --
    -- 1) display_params (v26) is keyed org+domain+node. An admin can say "a
    --    transformer shows these six values" but not "Maintenance sees oil and gas,
    --    Operations sees load and voltage" — and on a forty-parameter merged asset
    --    that is the distinction that makes the page readable for either team.
    --    department_id NULL keeps its existing meaning: everyone in the org.
    --
    -- 2) The set of dashboard themes an organization may use lived in a frontend
    --    const (orgThemes.ts) covering org-1/2/3 and nothing else. Every other
    --    organization fell back to ['th-overview'], so its admin could grant exactly
    --    one theme no matter what the superadmin intended, and the superadmin's own
    --    "save" mutated a module-level object that a page reload discarded. The
    --    Dashboard View Permission tab has been reading an entitlement nobody could
    --    write.
    USE iothub;
    
    -- --- 1) department scope for displayed parameters ---------------------------
    ALTER TABLE display_params ADD COLUMN department_id VARCHAR(64) NULL;
    
    -- Same trick as node_scope in v26, for the same reason: MySQL treats NULLs as
    -- distinct in a UNIQUE index, which is exactly wrong for "one row per org-wide
    -- default". Both scopes need a sentinel before they can share a key.
    ALTER TABLE display_params ADD COLUMN dept_scope VARCHAR(64)
      AS (IFNULL(department_id, '*')) STORED;
    
    -- The old key had no department column, so an org-wide row and a per-department
    -- row for the same parameter would collide and the INSERT IGNORE would silently
    -- drop the second one.
    ALTER TABLE display_params DROP INDEX uq_display_params;
    ALTER TABLE display_params
      ADD UNIQUE KEY uq_display_params (org_id, domain, node_scope, dept_scope, param_key);
    ALTER TABLE display_params
      ADD INDEX idx_display_params_dept (org_id, domain, dept_scope);
    
    -- --- 2) which themes an organization is entitled to --------------------------
    -- Superadmin writes it, the org's admin can only allocate from it. Rows rather
    -- than a JSON column: "is this org entitled to this theme" is the question asked
    -- on every render of the permission tab, and revoking one is a single DELETE.
    CREATE TABLE IF NOT EXISTS org_theme_grants (
      org_id     VARCHAR(64) NOT NULL,
      theme_id   VARCHAR(64) NOT NULL,
      granted_at DATETIME(3) DEFAULT CURRENT_TIMESTAMP(3),
      PRIMARY KEY (org_id, theme_id)
    );
    
    -- Seed the three demo orgs with what orgThemes.ts hardcoded, so switching the
    -- screen from the frontend const to the table is not a silent downgrade for the
    -- orgs that already had grants. INSERT IGNORE: an org that has since been given
    -- real grants keeps them.
    INSERT IGNORE INTO org_theme_grants (org_id, theme_id) VALUES
      ('org-1','th-overview'),('org-1','th-map'),('org-1','th-fix'),('org-1','th-free'),('org-1','th-refrig'),
      ('org-2','th-overview'),('org-2','th-map'),('org-2','th-fix'),('org-2','th-free'),('org-2','th-twin'),
      ('org-3','th-overview'),('org-3','th-fix');
  migrate-v29.sql: |
    -- migrate-v29.sql — which of the customer's sites a department may see
    --
    -- Sites became real rows in v21 and devices hang off them, but nothing scoped a
    -- USER to one. An ETERNITY customer running a dozen plants had every one of its
    -- viewers seeing every transformer at every plant: the device list, the sensor
    -- map, the floor plans and the alarm feed are all driven by the same fleet
    -- query, and it filtered by organization and department but never by place.
    --
    -- The department is the unit, not the user. Product access, dashboard themes and
    -- displayed parameters are all granted per department already, and "the Rayong
    -- maintenance team" is the thing an admin actually thinks in. A user in several
    -- departments gets the union of their sites — being added to a second team must
    -- never take access away, the same rule the rest of this schema follows.
    --
    -- NO ROWS FOR A DEPARTMENT MEANS NO RESTRICTION. Fail-open is deliberate and is
    -- the only safe default here: every department that exists today has no rows, so
    -- a fail-closed reading would empty the device list, the map, the floor plans and
    -- the alarm page for every non-admin user on the platform the moment this
    -- deploys. An admin opts a department into site scoping by assigning it one.
    USE iothub;
    
    CREATE TABLE IF NOT EXISTS department_sites (
      department_id VARCHAR(64) NOT NULL,
      site_id       VARCHAR(64) NOT NULL,
      -- Denormalised so an org's whole policy can be read, and wiped when a site is
      -- deleted, without joining departments.
      org_id        VARCHAR(64) NOT NULL,
      PRIMARY KEY (department_id, site_id),
      INDEX idx_department_sites_org (org_id),
      INDEX idx_department_sites_site (site_id)
    );
  migrate-v3.sql: |
    -- Migration v3 — robustness: device logs, dead-letter, readings rollup.
    -- Fresh installs get these from schema.sql. Run once on an existing DB.
    USE iothub;
    
    CREATE TABLE IF NOT EXISTS device_logs (
      id        BIGINT AUTO_INCREMENT PRIMARY KEY,
      node_id   VARCHAR(64) NOT NULL,
      kind      ENUM('diag','ota') NOT NULL DEFAULT 'diag',
      level     VARCHAR(32),
      payload   TEXT,
      ts        DATETIME(3) DEFAULT CURRENT_TIMESTAMP(3),
      INDEX (node_id, ts)
    );
    
    CREATE TABLE IF NOT EXISTS dead_letter (
      id         BIGINT AUTO_INCREMENT PRIMARY KEY,
      source     VARCHAR(120),
      error      VARCHAR(500),
      payload    TEXT,
      created_at DATETIME(3) DEFAULT CURRENT_TIMESTAMP(3)
    );
    
    CREATE TABLE IF NOT EXISTS readings_rollup (
      node_id   VARCHAR(64) NOT NULL,
      param_key VARCHAR(40) NOT NULL,
      bucket    DATETIME(3) NOT NULL,
      n         INT,
      v_avg     DECIMAL(12,4),
      v_min     DECIMAL(12,4),
      v_max     DECIMAL(12,4),
      PRIMARY KEY (node_id, param_key, bucket)
    );
  migrate-v30.sql: |
    -- migrate-v30.sql — an audit trail for the actions taken during maintenance
    --
    -- The superadmin screens show a "Recent Changes" feed built from a hardcoded
    -- array in mockData.ts: the same four rows, with invented timestamps, on every
    -- deployment. It is the one thing on those pages that must never be fiction —
    -- during an incident it is the record of who suspended whom, who moved a
    -- license, and when. Suspending a customer's organization is a 403 for every
    -- one of their users; that has to leave a trace with a name on it.
    --
    -- Deliberately generic (actor / action / target), not one column per event
    -- type: the point is that adding a new administrative action must not require a
    -- migration, or it will simply go unrecorded.
    --
    -- Control database only. Auditing is a platform-level concern and the actors are
    -- superadmins, who have no tenant database of their own.
    USE iothub;
    
    CREATE TABLE IF NOT EXISTS admin_audit (
      id         BIGINT AUTO_INCREMENT PRIMARY KEY,
      -- Who. Denormalised on purpose: a deleted user must not erase the record of
      -- what they did, so this never joins to users.
      actor_id   VARCHAR(64),
      actor_name VARCHAR(160),
      -- What, as a stable machine-readable verb ('org.suspend', 'license.grant').
      action     VARCHAR(64) NOT NULL,
      -- Which organization the action was ABOUT (not the actor's own org).
      org_id     VARCHAR(64),
      -- Free-text subject line for the UI: an org name, a platform id, a theme set.
      target     VARCHAR(255),
      -- Optional JSON for the before/after of the change.
      detail     TEXT,
      at         DATETIME(3) DEFAULT CURRENT_TIMESTAMP(3),
      -- The feed is always "most recent first", usually filtered to one org.
      INDEX idx_admin_audit_at (at),
      INDEX idx_admin_audit_org (org_id, at)
    );
  migrate-v31.sql: |
    -- migrate-v31.sql — real transformer nameplate data, replacing fabricated Asset Info
    --
    -- The 'Individual Device (FIX)' Asset Info panel (FixDashboard.tsx, th-fix,
    -- used on every /admin/nodes/detail and /customer/devices/detail page)
    -- hardcodes 'TR-6787' / '2500 kVA' / '22kV/0.4kV' for every transformer on the
    -- platform, unconditionally. The better-shaped 'Transformer Digital Twin' panel
    -- (TransformerDetailView, th-twin) reads transformer.model/.kva/.voltage/
    -- .manufacturer/.installDate/.serialNumber, but for a real customer device (no
    -- seed-array match) those fall back to the same '—'/0 placeholders, because
    -- `nodes` never grew nameplate columns (schema.sql) and nothing else ever wrote
    -- them. A device auto-registered from its first MQTT frame carries zero spec
    -- data, forever.
    --
    -- Same shape of problem as node_images (migrate-v27), same fix shape: an admin
    -- enters what is actually on the unit's nameplate; until they do, the UI says
    -- so instead of lying. Deliberately NOT a full IEC 60076-1 transcription —
    -- vector group, impedance %, tap-changer detail, mass, insulating-liquid type,
    -- frequency and phase count are design-engineering data nobody reads while
    -- triaging an oil-temp alarm, and are already captured losslessly by the
    -- admin-uploaded device photo (node_images) for the rare specialist who needs
    -- them. This table holds only the fields the two existing panels already try
    -- to render, plus cooling_type — the one IEC field not shown anywhere today
    -- that changes how ops reads the oil-temp trend card right beside it (an OFAF
    -- unit's normal baseline differs from an ONAN unit's).
    --
    -- Lives in the ORG database, exactly like node_images: nodes does, and a
    -- nameplate for a device that is not in the same database as the device is a
    -- row nothing can join to. No org_id column — the node already belongs to
    -- exactly one org (nodes.org_id); every read/write resolves its pool via
    -- orgOfNode/ownOrg the same way the photo endpoints do.
    --
    -- Every column nullable except the key: an admin who knows the rating today
    -- but not the serial number must be able to save that much and come back
    -- later. Forcing all-or-nothing entry is how you get zero real rows.
    USE iothub;
    
    CREATE TABLE IF NOT EXISTS node_nameplates (
      node_id         VARCHAR(64) PRIMARY KEY,
      manufacturer    VARCHAR(120),
      model           VARCHAR(120),
      serial_number   VARCHAR(120),
      rated_kva       DECIMAL(10,2),
      voltage_class   VARCHAR(64),
      cooling_type    VARCHAR(32),
      year_installed  SMALLINT,
      updated_by      VARCHAR(120),
      updated_at      DATETIME(3) DEFAULT CURRENT_TIMESTAMP(3) ON UPDATE CURRENT_TIMESTAMP(3)
    );
    
    -- Seed the three demo orgs' transformers with the model/kVA/voltage/serial
    -- already hardcoded in fleetData.ts — moving existing sample data into the
    -- real table, not inventing new content. Deliberately NOT carrying forward
    -- mockData.ts's hash-fabricated manufacturer/installDate: leaving those NULL
    -- on demo units keeps the 'not entered yet' state visibly exercised in the
    -- one environment everyone looks at first, instead of swapping one invented
    -- value for another.
    INSERT IGNORE INTO node_nameplates (node_id, model, serial_number, rated_kva, voltage_class) VALUES
      ('tr-001','TR-6787','SN100231',2500,'22kV/0.4kV'),
      ('tr-002','TR-5512','SN100232',1500,'11kV/0.4kV'),
      ('tr-003','TR-6787','SN100240',2000,'22kV/0.4kV'),
      ('tr-004','TR-9001','SN100241',3000,'33kV/11kV'),
      ('tr-005','TR-5512','SN100242',1500,'11kV/0.4kV'),
      ('tr-101','TR-9001','SN200110',3000,'33kV/11kV'),
      ('tr-102','TR-6787','SN200111',2500,'22kV/0.4kV'),
      ('tr-103','TR-5512','SN200112',1500,'11kV/0.4kV'),
      ('tr-301','TR-9001','SN300110',3000,'115kV/22kV'),
      ('tr-302','TR-6787','SN300111',2500,'33kV/11kV'),
      ('tr-303','TR-5512','SN300112',2000,'22kV/0.4kV');
  migrate-v32.sql: |
    -- migrate-v32.sql — transformer model catalog, per-org.
    --
    -- Every transformer nameplate today is typed in from scratch, per unit
    -- (NameplateEditor, migrate-v31). For a factory-fed fleet where the same
    -- handful of model codes repeat across dozens of units (ETERNITY IS a
    -- transformer manufacturing platform), that means retyping the identical
    -- manufacturer/kVA/voltage/cooling combination on every single approval —
    -- and migrate-v31's own demo seed proves how that goes wrong even done once,
    -- by one person: TR-6787 shipped at three different kVA/voltage combinations
    -- across 11 rows, because there was nowhere to define "TR-6787" once.
    --
    -- This table lives in the ORG database — same placement as node_nameplates,
    -- event_problems, org_domain_rules — because a catalog readable across tenant
    -- databases is exactly the kind of cross-org data leak TENANT_DB_MODE exists
    -- to prevent. There is no shared "ETERNITY master catalog": every org keeps
    -- its own copy of even a model code every org happens to use, the same way
    -- every org keeps its own copy of event_problems even where two orgs define
    -- an identical root-cause label. org_id is NOT NULL and every query filters
    -- by it — required (not just belt-and-suspenders) because org-1/org-2/org-3
    -- share the single control-DB physical database (resolvePool() only
    -- separates a physical database per org once TENANT_DB_MODE routes an org to
    -- its own iothub_<org>); without the column, those three orgs' catalogs would
    -- collide in one table.
    --
    -- node_nameplates.model_id is nullable and additive: every existing row keeps
    -- working exactly as it does today. Where an admin picks a model, the
    -- existing manufacturer/model/rated_kva/voltage_class/cooling_type columns on
    -- that row change MEANING from "the value" to "the override" — NULL inherits
    -- the model's value, a value means this specific unit differs from the
    -- standard. That is a deliberate design choice, not a shortcut: a factory
    -- model has real variants (a site that ordered a non-standard secondary
    -- voltage, a different tap), and a rigid "catalog value always wins" rule
    -- would just push admins back to never using the catalog at all.
    USE iothub;
    
    CREATE TABLE IF NOT EXISTS transformer_models (
      id             VARCHAR(64) PRIMARY KEY,
      org_id         VARCHAR(64) NOT NULL,
      model_code     VARCHAR(120) NOT NULL,
      manufacturer   VARCHAR(120),
      rated_kva      DECIMAL(10,2),
      voltage_class  VARCHAR(64),
      cooling_type   VARCHAR(32),
      -- Retired models stay (units already pointing at them must keep resolving)
      -- but drop out of the picker offered on new approvals.
      active         TINYINT(1) NOT NULL DEFAULT 1,
      created_by     VARCHAR(120),
      created_at     DATETIME(3) DEFAULT CURRENT_TIMESTAMP(3),
      updated_at     DATETIME(3) DEFAULT CURRENT_TIMESTAMP(3) ON UPDATE CURRENT_TIMESTAMP(3),
      INDEX (org_id), INDEX (active)
    );
    
    ALTER TABLE node_nameplates ADD COLUMN model_id VARCHAR(64) NULL AFTER node_id;
    ALTER TABLE node_nameplates ADD INDEX idx_nameplates_model (model_id);
    
    -- Seed: the three model codes migrate-v31 already introduced (TR-6787,
    -- TR-5512, TR-9001), as real per-org catalog rows, then repoint each demo
    -- org's nameplates at them. A unit whose migrate-v31 values already matched
    -- the standard spec now inherits (its literal columns clear to NULL); the
    -- three units that disagreed with the rest — tr-003, tr-301, tr-302, tr-303 —
    -- keep their real values as an explicit per-unit override instead of being
    -- "fixed" to match. They were never data-entry noise; they are exactly the
    -- case this table exists for.
    INSERT INTO transformer_models (id, org_id, model_code, rated_kva, voltage_class) VALUES
      ('tm-org1-6787','org-1','TR-6787',2500,'22kV/0.4kV'),
      ('tm-org1-5512','org-1','TR-5512',1500,'11kV/0.4kV'),
      ('tm-org1-9001','org-1','TR-9001',3000,'33kV/11kV'),
      ('tm-org2-6787','org-2','TR-6787',2500,'22kV/0.4kV'),
      ('tm-org2-5512','org-2','TR-5512',1500,'11kV/0.4kV'),
      ('tm-org2-9001','org-2','TR-9001',3000,'33kV/11kV'),
      ('tm-org3-6787','org-3','TR-6787',2500,'22kV/0.4kV'),
      ('tm-org3-5512','org-3','TR-5512',1500,'11kV/0.4kV'),
      ('tm-org3-9001','org-3','TR-9001',3000,'33kV/11kV')
    ON DUPLICATE KEY UPDATE model_code=VALUES(model_code);
    
    UPDATE node_nameplates SET model_id='tm-org1-6787', rated_kva=NULL, voltage_class=NULL WHERE node_id='tr-001';
    UPDATE node_nameplates SET model_id='tm-org1-5512', rated_kva=NULL, voltage_class=NULL WHERE node_id='tr-002';
    UPDATE node_nameplates SET model_id='tm-org1-6787'                                     WHERE node_id='tr-003'; -- kVA override: 2000 vs standard 2500
    UPDATE node_nameplates SET model_id='tm-org1-9001', rated_kva=NULL, voltage_class=NULL WHERE node_id='tr-004';
    UPDATE node_nameplates SET model_id='tm-org1-5512', rated_kva=NULL, voltage_class=NULL WHERE node_id='tr-005';
    UPDATE node_nameplates SET model_id='tm-org2-9001', rated_kva=NULL, voltage_class=NULL WHERE node_id='tr-101';
    UPDATE node_nameplates SET model_id='tm-org2-6787', rated_kva=NULL, voltage_class=NULL WHERE node_id='tr-102';
    UPDATE node_nameplates SET model_id='tm-org2-5512', rated_kva=NULL, voltage_class=NULL WHERE node_id='tr-103';
    UPDATE node_nameplates SET model_id='tm-org3-9001'                                     WHERE node_id='tr-301'; -- voltage override: 115kV/22kV vs standard 33kV/11kV
    UPDATE node_nameplates SET model_id='tm-org3-6787'                                     WHERE node_id='tr-302'; -- voltage override: 33kV/11kV vs standard 22kV/0.4kV
    UPDATE node_nameplates SET model_id='tm-org3-5512'                                     WHERE node_id='tr-303'; -- kVA+voltage override
  migrate-v33.sql: |
    -- migrate-v33.sql — per-org "show the generic 3D model" toggle.
    --
    -- The device detail pages (FixDashboard's twin slot, TransformerDetailView's
    -- 3D canvas) show the admin-uploaded real photo (node_images, migrate-v27)
    -- when one exists, and otherwise fall back to a generic 3D render — labelled
    -- "Generic model — not this unit" so it is never mistaken for the real unit.
    -- Some orgs would rather see nothing 3D at all while a device has no photo
    -- yet, not even the honestly-labelled placeholder. This is that switch,
    -- superadmin-only, one row per org.
    --
    -- organizations lives in the CONTROL database only (routing/auth/superadmin
    -- management), never per-tenant — same as status, logo_url, lat/lng already
    -- on this table. Defaults to 1 (today's behavior, unchanged) so every
    -- existing org keeps showing the 3D fallback until a superadmin turns it off.
    USE iothub;
    
    ALTER TABLE organizations ADD COLUMN show_3d_fallback TINYINT(1) NOT NULL DEFAULT 1;
  migrate-v34.sql: |
    -- migrate-v34.sql — admin-editable display names for MQTT parameters.
    --
    -- A device names its own parameters, and the wire key is whatever its firmware
    -- was written to send. ALARM_SCHEMA maps the handful this platform knows
    -- ('oilTemp' -> "Oil Temperature"); everything else — and a merged two-topic
    -- transformer reports around forty — renders as the raw key: RHamb, Tbox,
    -- OilMoisture, THD_VoltCA. Those are meaningful to whoever flashed the
    -- firmware and to nobody standing in front of the unit at 2am.
    --
    -- An admin can now rename any of them for display. The wire key is untouched
    -- and stays the join key everywhere (readings, alarm_events, display_params,
    -- the rule engine) — this table only decides what a human sees.
    --
    -- Scope: org + domain, with an optional per-node override, exactly like
    -- display_params (v26). Deliberately NOT department-scoped, unlike
    -- display_params (v28): WHICH parameters a team cares about genuinely differs
    -- between Maintenance and Operations, but what a sensor is CALLED does not —
    -- it describes the sensor, not the audience. Adding a fourth scope dimension
    -- would multiply exactly the scope-confusion this feature is meant to reduce.
    --
    -- An absent row means "no custom name", which falls back to the ALARM_SCHEMA
    -- label and then to the raw key — the same fail-open shape as display_params,
    -- so a device never renders a blank parameter name.
    USE iothub;
    
    CREATE TABLE IF NOT EXISTS param_labels (
      org_id     VARCHAR(64) NOT NULL,
      domain     VARCHAR(32) NOT NULL,
      -- NULL = the default name for every device of this product in the org.
      node_id    VARCHAR(64) NULL,
      param_key  VARCHAR(64) NOT NULL,
      label      VARCHAR(120) NOT NULL,
      updated_by VARCHAR(120),
      updated_at DATETIME(3) DEFAULT CURRENT_TIMESTAMP(3) ON UPDATE CURRENT_TIMESTAMP(3),
      -- MySQL treats NULLs as distinct in a UNIQUE index, which is exactly wrong
