# ============================================================
# SQL shipped to the mysql-auto-migrate Job.
# GENERATED by infra/scripts/sync-sql-configmap.sh — do not hand-edit.
# Regenerate after changing anything under backend/sql/.
#
# sync-wave -5 so this exists before the Sync-hook Job (wave 0) mounts it.
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-migrations
  namespace: iiot-uat
  labels:
    app: mysql-migrate
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
data:
  bloodbox.sql: |
    -- BloodBOX domain (ERD #4). Run after schema.sql.
    USE iothub;
    
    CREATE TABLE IF NOT EXISTS building_floors (
      id            VARCHAR(64) PRIMARY KEY,
      org_id        VARCHAR(64) NOT NULL,
      site_id       VARCHAR(64),
      building_code VARCHAR(20),
      floor_number  SMALLINT NOT NULL,
      name          VARCHAR(80),
      floorplan_url TEXT,
      width_m       DECIMAL(8,2),
      height_m      DECIMAL(8,2),
      UNIQUE KEY uq_floor (site_id, building_code, floor_number),
      INDEX (org_id)
    );
    
    CREATE TABLE IF NOT EXISTS blood_boxes (
      id          VARCHAR(64) PRIMARY KEY,
      org_id      VARCHAR(64) NOT NULL,
      site_id     VARCHAR(64),
      box_code    VARCHAR(40) UNIQUE,
      name        VARCHAR(80),
      set_low_c   DECIMAL(5,2),
      set_high_c  DECIMAL(5,2),
      capacity_units INT,
      floor_id    VARCHAR(64),
      pos_x_m     DECIMAL(8,2),
      pos_y_m     DECIMAL(8,2),
      status      ENUM('idle','in_transit','stored') DEFAULT 'idle',
      INDEX (org_id)
    );
    
    CREATE TABLE IF NOT EXISTS blood_box_locations (
      id          BIGINT AUTO_INCREMENT PRIMARY KEY,
      org_id      VARCHAR(64) NOT NULL,
      box_id      VARCHAR(64) NOT NULL,
      floor_id    VARCHAR(64),
      pos_x_m     DECIMAL(8,2),
      pos_y_m     DECIMAL(8,2),
      room_label  VARCHAR(80),
      moved_at    DATETIME(3) DEFAULT CURRENT_TIMESTAMP(3),
      moved_by    VARCHAR(120),
      is_current  TINYINT(1) DEFAULT 1,
      INDEX (box_id, is_current)
    );
    
    CREATE TABLE IF NOT EXISTS ble_beacons (
      id          VARCHAR(64) PRIMARY KEY,
      org_id      VARCHAR(64) NOT NULL,
      floor_id    VARCHAR(64) NOT NULL,
      uuid        CHAR(36) NOT NULL,
      major       SMALLINT,
      minor       SMALLINT,
      pos_x_m     DECIMAL(8,2),
      pos_y_m     DECIMAL(8,2),
      tx_power_dbm SMALLINT,
      battery_pct TINYINT,
      status      ENUM('active','inactive','low_battery') DEFAULT 'active',
      UNIQUE KEY uq_beacon (uuid, major, minor),
      INDEX (org_id), INDEX (floor_id)
    );
    
    CREATE TABLE IF NOT EXISTS blood_box_transits (
      id            VARCHAR(64) PRIMARY KEY,
      org_id        VARCHAR(64) NOT NULL,
      box_id        VARCHAR(64),
      box_code      VARCHAR(40),
      from_label    VARCHAR(120),
      to_label      VARCHAR(120),
      courier       VARCHAR(120),
      courier_phone VARCHAR(40),
      planned_eta_min INT,
      current_eta_min INT,
      departed_at   DATETIME(3),
      arrived_at    DATETIME(3),
      temp_min_c    DECIMAL(5,2),
      temp_max_c    DECIMAL(5,2),
      current_temp_c DECIMAL(5,2),
      status        ENUM('in_transit','arrived','delayed') DEFAULT 'in_transit',
      INDEX (org_id)
    );
    
    CREATE TABLE IF NOT EXISTS blood_box_journey_events (
      id          VARCHAR(64) PRIMARY KEY,
      transit_id  VARCHAR(64) NOT NULL,
      floor_id    VARCHAR(64),
      event_type  ENUM('gps_checkin','building_entered','security_pass','lift_entered','lift_exited','storage_arrived') NOT NULL,
      label       VARCHAR(160),
      `signal`      ENUM('GPS','BLE','BAROMETER','MANUAL') NOT NULL,
      lat         DECIMAL(10,7),
      lng         DECIMAL(10,7),
      pos_x_m     DECIMAL(8,2),
      pos_y_m     DECIMAL(8,2),
      temp_c      DECIMAL(5,2),
      battery_pct TINYINT,
      ts          DATETIME(3) DEFAULT CURRENT_TIMESTAMP(3),
      INDEX (transit_id)
    );
  install.sql: |
    -- ONEOPS — fresh-install migration (run order for an EMPTY database).
    -- Run from the sql/ directory:  cd backend/sql && mysql -h HOST -u admin -p < install.sql
    -- (SOURCE resolves paths from the client's working directory.)
    --
    -- schema.sql + bloodbox.sql cover the v2–v8 objects (already absorbed). The
    -- v9/v10 objects (readings.quality, device_presence.*, alarm_rules.debounce_json,
    -- ota_releases, ota_deployments, transport_events, edge_alarm_log,
    -- offline_sync_log, blood_box_transit_telemetry, …) are NOT in schema.sql, so a
    -- fresh install must also source migrate-v9 + migrate-v10 to be complete. These
    -- two run cleanly here because their objects don't yet exist in a fresh DB
    -- (CREATE TABLE IF NOT EXISTS + plain ADD COLUMN on absent columns).
    
    SOURCE schema.sql;        -- 1) core schema (creates db `iothub` + all core tables)
    SOURCE bloodbox.sql;      -- 2) BloodBOX domain tables
    SOURCE migrate-v9.sql;    -- 3) firmware reliability + OTA + offline buffer tables
    SOURCE migrate-v10.sql;   -- 4) firmware v2 telemetry: reading quality + presence health/pos
    SOURCE seed-nodes.sql;    -- 5) (optional) demo fleet: nodes + geo + mqtt_prefix
    SOURCE seed-tenancy.sql;  -- 6) (optional) demo orgs/users/entitlements/event-problems
    
    SELECT 'ONEOPS schema installed' AS status;
  migrate-v10.sql: |
    -- migrate-v10.sql — firmware v2.0 telemetry: reading quality + live health/position
    --
    -- Closes the gaps between what the ESP32 v2 firmware now emits and the schema.
    -- Plain ALTERs (portable MySQL/MariaDB); migrate.ts records each file once and
    -- tolerates duplicate-column / duplicate-key errors on re-run.
    --
    -- NOTE: adding the columns is only half the job — the Node-RED `normalize`/ingest
    -- flow (and the heartbeat handler) must be updated to WRITE these new columns,
    -- otherwise they stay at their defaults. See firmware/esp32 payloads.
    USE iothub;
    
    -- 1) Reading data quality (spec §16) — distinguish a real value from a dead
    --    sensor. Firmware sends quality = good | sim | error  (sim = demo fallback);
    --    'stale' is reserved for cloud-side aging. Without this a "0 C" reading and
    --    a broken probe are indistinguishable.
    ALTER TABLE readings        ADD COLUMN quality ENUM('good','sim','error','stale') NOT NULL DEFAULT 'good' AFTER value;
    ALTER TABLE readings_rollup ADD COLUMN bad_n   INT DEFAULT 0 AFTER n;   -- count of non-good samples in the bucket
    
    -- 2) Live device health + position carried by the heartbeat (presence dashboard).
    --    Heartbeat now sends: uptime, heap, time_src, transport, and for bloodbox
    --    transit (FSM state) + lat/lng (live GPS).
    ALTER TABLE device_presence ADD COLUMN uptime_s  INT           AFTER fw;
    ALTER TABLE device_presence ADD COLUMN heap      INT           AFTER uptime_s;
    ALTER TABLE device_presence ADD COLUMN time_src  VARCHAR(12)   AFTER heap;       -- ntp|lorawan|rtc|uptime
    ALTER TABLE device_presence ADD COLUMN transport VARCHAR(8)    AFTER time_src;   -- wifi|4g|lora|none
    ALTER TABLE device_presence ADD COLUMN transit   VARCHAR(16)   AFTER transport;  -- bloodbox: idle|in_transit|arrived|stored
    ALTER TABLE device_presence ADD COLUMN lat       DECIMAL(10,7) AFTER transit;    -- bloodbox live GPS
    ALTER TABLE device_presence ADD COLUMN lng       DECIMAL(10,7) AFTER lat;
    
    -- 3) Index diag-log codes for fast fault queries (HW_SD_FAIL, LINK_OFFLINE, …).
    --    diag/log payload already lands in device_logs.payload; pull the code out so
    --    it is queryable/indexable.
    ALTER TABLE device_logs ADD COLUMN code VARCHAR(40) AFTER level;
    ALTER TABLE device_logs ADD INDEX idx_logs_code (code, ts);
    
    -- 4) Transport enums accept both '4g' and 'lte' — firmware/UI may report either,
    --    so heartbeat/failover inserts never truncate.
    ALTER TABLE transport_events            MODIFY from_transport ENUM('wifi','4g','lte','lora','none') NOT NULL;
    ALTER TABLE transport_events            MODIFY to_transport   ENUM('wifi','4g','lte','lora','none') NOT NULL;
    ALTER TABLE blood_box_transit_telemetry MODIFY transport      ENUM('wifi','4g','lte','lora') DEFAULT 'wifi';
    
    -- 5) Mark whether an alarm row came from the firmware edge fast-path or the
    --    cloud engine, and add the transit_state to the high-freq transit telemetry.
    ALTER TABLE edge_alarm_log             ADD COLUMN source        ENUM('edge','cloud') NOT NULL DEFAULT 'edge' AFTER severity;
    ALTER TABLE blood_box_transit_telemetry ADD COLUMN transit_state VARCHAR(16) AFTER transport;  -- idle|in_transit|arrived|stored
  migrate-v11.sql: |
    -- migrate-v11.sql — forgot-password + employee directory + org geo fallback
    -- (for EXISTING databases; schema.sql already contains these for fresh installs).
    -- Plain ALTERs (portable MySQL 8.x); migrate.ts records each file once and
    -- tolerates duplicate-column errors, so this stays idempotent.
    USE iothub;
    
    -- 1) Password reset tokens (forgot-password flow). token holds a signed JWT, so
    --    it needs room beyond 128 chars → VARCHAR(255).
    CREATE TABLE IF NOT EXISTS password_resets (
      token      VARCHAR(255) PRIMARY KEY,
      user_id    VARCHAR(64) NOT NULL,
      expires_at DATETIME(3) NOT NULL,
      used       TINYINT(1) DEFAULT 0,
      created_at DATETIME(3) DEFAULT CURRENT_TIMESTAMP(3),
      INDEX (user_id)
    );
    -- Widen the token column if the table pre-existed with VARCHAR(128).
    ALTER TABLE password_resets MODIFY token VARCHAR(255);
    
    -- 2) Employee directory (CSV allowlist → auto-assign a matched registrant as
    --    a viewer on their org/department at signup time).
    CREATE TABLE IF NOT EXISTS org_directory (
      id            VARCHAR(64) PRIMARY KEY,
      org_id        VARCHAR(64) NOT NULL,
      name          VARCHAR(120),
      email         VARCHAR(160),
      phone         VARCHAR(40),
      department_id VARCHAR(64),
      created_at    DATETIME(3) DEFAULT CURRENT_TIMESTAMP(3),
      INDEX (org_id), INDEX (email), INDEX (phone), INDEX (name)
    );
    
    -- 3) Org factory geo fallback — ETERNITY transformer sensors have no GPS, so the
    --    admin pins the factory location once and all its nodes plot there.
    ALTER TABLE organizations ADD COLUMN lat DECIMAL(10,7);
    ALTER TABLE organizations ADD COLUMN lng DECIMAL(10,7);
  migrate-v12.sql: |
    -- migrate-v12.sql — zero-touch device onboarding (auto-register pending nodes)
    -- for EXISTING databases. schema.sql carries these for fresh installs; the ALTERs
    -- backfill an existing `nodes` table. migrate.ts tolerates duplicate-column errors.
    USE iothub;
    
    -- Onboarding lifecycle. Existing rows default to 'active' (already provisioned).
    -- A device that publishes telemetry with an unknown id is auto-created as
    -- 'pending' (org derived from its MQTT topic) and waits for admin approval.
    ALTER TABLE nodes ADD COLUMN status ENUM('pending','active','rejected') NOT NULL DEFAULT 'active';
    ALTER TABLE nodes ADD COLUMN first_seen DATETIME(3) DEFAULT CURRENT_TIMESTAMP(3);
    ALTER TABLE nodes ADD INDEX idx_nodes_status (status);
  migrate-v13.sql: |
    -- migrate-v13.sql — dedicated floor-plan image storage (for EXISTING databases).
    -- schema.sql carries this for fresh installs; migrate.ts records the file once.
    USE iothub;
    
    -- Floor-plan layout images: bytes (LONGBLOB) + a served path (image_url), keyed by
    -- org + floor. Previously the whole floorplan blob (incl. images) was crammed into
    -- user_prefs.prefs (TEXT, 64 KB) as an ephemeral blob: URL — which never persisted.
    CREATE TABLE IF NOT EXISTS floorplans (
      org_id       VARCHAR(64) NOT NULL,
      floor_id     VARCHAR(64) NOT NULL,
      image_url    VARCHAR(512),
      image_data   LONGBLOB,
      content_type VARCHAR(100),
      updated_at   DATETIME(3) DEFAULT CURRENT_TIMESTAMP(3) ON UPDATE CURRENT_TIMESTAMP(3),
      PRIMARY KEY (org_id, floor_id)
    );
  migrate-v14.sql: |
    -- migrate-v14.sql — zero-touch onboarding hardening (for EXISTING databases).
    -- schema.sql carries these for fresh installs; migrate.ts records the file once.
    -- The runner tolerates ER_DUP_FIELDNAME / ER_DUP_ENTRY so re-runs are safe.
    USE iothub;
    
    -- Store the latest telemetry sample for a device so the pending-approval screen
    -- can show an admin the actual readings before they approve the device.
    ALTER TABLE device_presence ADD COLUMN last_sample JSON;
    
    -- Claimable pool for devices whose MQTT topic org does not match a real org.
    -- The worker auto-registers such orphans here; only a superadmin sees and
    -- reassigns them. Suspended so it can never behave like a real tenant.
    INSERT IGNORE INTO organizations (id, name, status) VALUES ('__unassigned__', 'Unassigned / Pending Claim', 'suspended');
  migrate-v15.sql: |
    -- migrate-v15.sql — maintenance-report downloads + report delivery channels
    -- (for EXISTING databases). schema.sql carries these for fresh installs; the
    -- runner tolerates ER_DUP_FIELDNAME so re-runs are safe.
    USE iothub;
    
    -- Store a document's MIME type so downloads open correctly (PDF, image, …).
    ALTER TABLE documents ADD COLUMN content_type VARCHAR(100);
    
    -- Scheduled reports can deliver by email or Telegram; recipients holds the
    -- email(s) for email, or the Telegram chat id for telegram.
    ALTER TABLE report_schedules ADD COLUMN channel ENUM('email','telegram') NOT NULL DEFAULT 'email';
  migrate-v16.sql: |
    -- migrate-v16.sql — org+domain default alarm rule / telemetry param set
    -- (for EXISTING databases). schema.sql carries this for fresh installs; the
    -- runner tolerates ER_TABLE_EXISTS_ERROR so re-runs are safe.
    USE iothub;
    
    -- Set at provision time (before any device exists) and used to seed a node's
    -- alarm_rules the moment it is approved (zero-touch) or manually provisioned.
    CREATE TABLE IF NOT EXISTS org_domain_rules (
      org_id        VARCHAR(64) NOT NULL,
      domain        VARCHAR(32) NOT NULL,
      rule_json     JSON NOT NULL,
      debounce_json JSON,
      updated_by    VARCHAR(120),
      updated_at    DATETIME(3) DEFAULT CURRENT_TIMESTAMP(3) ON UPDATE CURRENT_TIMESTAMP(3),
      PRIMARY KEY (org_id, domain)
    );
  migrate-v17.sql: |
    -- migrate-v17.sql — global platform settings (superadmin-managed SMTP/sender)
    -- (for EXISTING databases). schema.sql carries this for fresh installs; the
    -- runner tolerates ER_TABLE_EXISTS_ERROR so re-runs are safe. The backend also
    -- self-heals this table on first write, so migration ordering is not critical.
    USE iothub;
    
    -- Key-value; the SMTP password (smtp.pass) is stored AES-GCM encrypted by the app.
    CREATE TABLE IF NOT EXISTS platform_settings (
      skey       VARCHAR(64) PRIMARY KEY,
      sval       TEXT,
      updated_at DATETIME(3) DEFAULT CURRENT_TIMESTAMP(3) ON UPDATE CURRENT_TIMESTAMP(3)
    );
  migrate-v18.sql: |
    -- Migration v18 — Catch-up missing schema changes
    -- These were added to schema.sql/bloodbox.sql but missing from prior migrations.
    USE iothub;
    
    -- 1. Add phone column to users (was missing from all previous migrations)
    ALTER TABLE users ADD COLUMN phone VARCHAR(40);
    
    -- 2. Create blood_box_journey_events (was in bloodbox.sql but not in any migrate-vX)
    CREATE TABLE IF NOT EXISTS blood_box_journey_events (
      id VARCHAR(64) PRIMARY KEY,
      transit_id VARCHAR(64) NOT NULL,
      floor_id VARCHAR(64),
      event_type VARCHAR(64),
      label VARCHAR(120),
      `signal` VARCHAR(32),
      lat FLOAT,
      lng FLOAT,
      pos_x_m FLOAT,
      pos_y_m FLOAT,
      temp_c FLOAT,
      battery_pct FLOAT,
      created_at DATETIME(3) DEFAULT CURRENT_TIMESTAMP(3)
    );
  migrate-v19.sql: |
    -- migrate-v19.sql — split "link lost" from "device offline"
    --
    -- The presence sweep used one threshold, so LINK_LOST and DEVICE_OFFLINE were
    -- written in the same pass and carried the same timestamp — the connectivity
    -- timeline showed both at e.g. 23:10 and never told the operator that the link
    -- had already been silent for half a minute before the device was declared
    -- offline.
    --
    -- Detecting the earlier stage needs the time of the last stored READING, which
    -- is not the same as last_seen: last_seen also moves on heartbeat/status frames
    -- (every 30s), so a device whose sensors stopped while MQTT stayed up would
    -- flap in and out of a short last_seen window. The ingest worker now stamps
    -- last_reading_at only when it actually persists readings, and the sweep raises
    -- LINK_LOST from that column.
    USE iothub;
    
    ALTER TABLE device_presence ADD COLUMN last_reading_at DATETIME(3) NULL AFTER last_seen;
    
    -- The sweep scans "online devices whose readings went quiet", every tick.
    ALTER TABLE device_presence ADD INDEX idx_presence_reading (online, last_reading_at);
  migrate-v2.sql: |
    -- Migration v2 — run ONCE on an existing DB created before:
    --   • alarm auto-clear / offline events  (alarm_events.cleared_at, kind 'offline')
    --   • device downlink                    (nodes.mqtt_prefix)
    -- Fresh installs already get these from schema.sql. MySQL lacks ADD COLUMN
    -- IF NOT EXISTS, so run each line once (errors on re-run are harmless).
    USE iothub;
    
    ALTER TABLE alarm_events MODIFY COLUMN kind ENUM('threshold','rate','offline') NOT NULL;
    ALTER TABLE alarm_events ADD COLUMN cleared_at DATETIME(3) NULL;
    ALTER TABLE alarm_events ADD INDEX (cleared_at);
    ALTER TABLE nodes ADD COLUMN mqtt_prefix VARCHAR(255);
  migrate-v20.sql: |
    -- migrate-v20.sql — one physical asset published across several MQTT topics
    --
    -- An ETERNITY transformer can be wired as two feeds: the power meter publishes
    -- the electrical set (VoltAB, CurrentA, ActivepowerTotal, THD_*, kWh, …) on one
    -- topic, and the box sensor publishes the environmental/DGA set (Oiltemp, H2,
    -- OilMoisture, Tbox, RHbox, Tamb, RHamb) on another. Each topic carries its own
    -- nodeId, so zero-touch onboarding registered them as two unrelated devices:
    -- the fleet listed one transformer twice, and — worse — the alarm rules that
    -- matter most for a transformer (oil temperature, dissolved hydrogen, moisture)
    -- sat on a node that had no electrical context and could never be reached from
    -- the transformer the operator actually opens.
    --
    -- merge_into names the node this feed belongs to. The ingest worker stores the
    -- readings under that node instead of the publishing one, so both topics land
    -- on a single device for readings, alarms, trends and reports; the secondary
    -- row is kept (it records which topic the data arrived on, and clearing the
    -- column splits the feeds apart again) but is hidden from the fleet.
    --
    -- NULL = an ordinary standalone device, which is every existing row.
    USE iothub;
    
    ALTER TABLE nodes ADD COLUMN merge_into VARCHAR(64) NULL AFTER status;
    
    -- The fleet query filters on "not a secondary feed" on every listing, and the
    -- worker resolves a publishing node to its primary on every telemetry frame.
    ALTER TABLE nodes ADD INDEX idx_nodes_merge_into (merge_into);
  migrate-v21.sql: |
    -- migrate-v21.sql — sites as real data, so floor plans can hang off them
    --
    -- nodes.site_id has always existed, but there was nothing to point it at: the
    -- site list lived in the frontend's seed file, so every organization saw the
    -- same four hardcoded sites and a customer's real ones could not be entered at
    -- all. Floor plans had the same problem one level down — the floors were a
    -- hardcoded "Building A · Floor 1/2/B1" const shared by every tenant.
    --
    -- A site is the physical place a customer operates (a substation, a plant, a
    -- hospital wing). Floor plans are reached THROUGH it, and its lat/lng is the
    -- fallback pin for devices that have no GPS of their own.
    USE iothub;
    
    CREATE TABLE IF NOT EXISTS sites (
      id         VARCHAR(64) PRIMARY KEY,
      org_id     VARCHAR(64) NOT NULL,
      name       VARCHAR(160) NOT NULL,
      address    VARCHAR(255),
      -- Anchor for the site itself. A floor plan georeference (see floorplans
      -- below) is what turns a pin into a device coordinate; this is the coarser
      -- "where is this place" used by the map when a device has neither.
      lat        DECIMAL(10,7),
      lng        DECIMAL(10,7),
      created_at DATETIME(3) DEFAULT CURRENT_TIMESTAMP(3),
      INDEX idx_sites_org (org_id)
    );
    
    -- Georeference for a floor plan image: the real-world coordinates of its
    -- north-west and south-east corners. Without this a pin is only an x/y percent
    -- of an image and cannot become a lat/lng — which is precisely what an ETERNITY
    -- transformer needs, since the same asset has to appear on the GPS map. With
    -- the two corners, x/y% ↔ lat/lng is a linear interpolation in both directions,
    -- so dropping a pin fills the coordinate inputs and typing a coordinate moves
    -- the pin.
    --
    -- Nullable throughout: a plan with no georeference still works for indoor
    -- placement, it just cannot sync coordinates.
    ALTER TABLE floorplans ADD COLUMN site_id VARCHAR(64) NULL AFTER floor_id;
    ALTER TABLE floorplans ADD COLUMN nw_lat DECIMAL(10,7) NULL;
    ALTER TABLE floorplans ADD COLUMN nw_lng DECIMAL(10,7) NULL;
    ALTER TABLE floorplans ADD COLUMN se_lat DECIMAL(10,7) NULL;
    ALTER TABLE floorplans ADD COLUMN se_lng DECIMAL(10,7) NULL;
    ALTER TABLE floorplans ADD INDEX idx_floorplans_site (site_id);
  migrate-v22.sql: |
    -- migrate-v22.sql — users.username as a real, stored login handle
    --
    -- The admin "New User" form has always had a Username field, and the login
    -- screen has always labelled its first input "Username" — but there was no such
    -- column. The form silently dropped the value (only email/name/role/department
    -- were ever sent), the user list showed `email || id` in that column, and login
    -- resolved strictly by email. So an admin typed a username, saved, and got back
    -- an email address: the field looked functional and stored nothing.
    --
    -- It is stored now, and login accepts EITHER identifier. Unique per organization
    -- rather than globally: two different customers may each have an "admin", and a
    -- global constraint would let the first tenant to claim a name take it from
    -- everyone else.
    USE iothub;
    
    ALTER TABLE users ADD COLUMN username VARCHAR(64) NULL AFTER email;
    
    -- NULLs are exempt from a UNIQUE index in MySQL, so existing rows (which have no
    -- username yet) do not collide with each other while they are being filled in.
    ALTER TABLE users ADD UNIQUE KEY uq_users_org_username (org_id, username);
  migrate-v23.sql: |
    -- migrate-v23.sql — dashboard themes granted per department
    --
    -- The "Dashboard View Permission" tab has always rendered: it lists the
    -- organization's departments, shows the themes the superadmin licensed, and
    -- lets an admin toggle them. None of it was stored. Departments were loaded
    -- with a hardcoded themeIds: ['th-overview'], every toggle lived in React state
    -- only, and a reload put it back — so the screen described a policy the system
    -- did not have.
    --
    -- A join table rather than a JSON column on departments: the question actually
    -- asked at render time is "which departments may see this theme", and the
    -- reverse, "which themes may this department see" — both are one indexed lookup
    -- here, and a theme being revoked org-wide is one DELETE.
    USE iothub;
    
    CREATE TABLE IF NOT EXISTS department_themes (
      department_id VARCHAR(64)  NOT NULL,
      theme_id      VARCHAR(64)  NOT NULL,
      -- Denormalised so the org's whole policy can be read (and wiped, on
      -- provisioning changes) without joining departments.
      org_id        VARCHAR(64)  NOT NULL,
      PRIMARY KEY (department_id, theme_id),
      INDEX idx_dept_themes_org (org_id)
    );
  migrate-v24.sql: |
    -- migrate-v24.sql — org logos as bytes, not a data URL in organizations
    --
    -- Uploading a logo returned 500. The Settings page sends the image as a base64
    -- data: URL and brandingPut wrote it straight into organizations.logo_url,
    -- which is TEXT — 65,535 bytes. Base64 inflates by ~4/3, so the page's own
    -- 512 KB limit produces roughly 683 KB and even a modest 100 KB PNG lands near
    -- 137 KB. Under MySQL 8's default STRICT_TRANS_TABLES that is ER_DATA_TOO_LONG
    -- (1406), an error rather than a silent truncation — so effectively every real
    -- logo failed, the row was never written, and a refresh showed the default.
    --
    -- Widening the column would have fixed the write and created a worse problem:
    -- GET /api/orgs does SELECT * and runs on every page load (the sidebar brand
    -- hydrates from it), so each org's full base64 would ship on every navigation.
    -- The bytes live in their own table and are served by their own endpoint —
    -- exactly what floorplans already do — leaving logo_url holding only the short
    -- path to them.
    USE iothub;
    
    CREATE TABLE IF NOT EXISTS org_logos (
      org_id       VARCHAR(64) PRIMARY KEY,
      image_data   LONGBLOB,
      content_type VARCHAR(100),
      updated_at   DATETIME(3) DEFAULT CURRENT_TIMESTAMP(3) ON UPDATE CURRENT_TIMESTAMP(3)
    );
  migrate-v25.sql: |
    -- migrate-v25.sql — a user can belong to more than one department
    --
    -- The admin form has always offered "Assign Departments (organize)" as a
    -- multi-select, and the type behind it is departmentIds: string[]. Storage was
    -- never plural: users.department_id is a single column, and saveUser sent
    -- departmentIds[0]. Picking three departments silently kept the first and
    -- discarded the rest, and every access decision downstream (product_access,
    -- the fleet's department filter, dashboard-theme visibility) then reasoned
    -- about one department the admin may not even have meant.
    --
    -- users.department_id is kept and mirrors the FIRST membership, so existing
    -- queries that read it keep working while callers migrate to the set.
    USE iothub;
    
    CREATE TABLE IF NOT EXISTS user_departments (
      user_id       VARCHAR(64) NOT NULL,
      department_id VARCHAR(64) NOT NULL,
      PRIMARY KEY (user_id, department_id),
      INDEX idx_user_departments_dept (department_id)
    );
    
    -- Backfill from the column so nobody loses the membership they already had.
    INSERT IGNORE INTO user_departments (user_id, department_id)
    SELECT id, department_id FROM users WHERE department_id IS NOT NULL AND department_id <> '';
