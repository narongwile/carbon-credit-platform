    -- migrate-v50.sql — Surface firmware-raised (edge) alarms to operators
    --
    -- Firmware evaluates some conditions itself and publishes them on
    -- P/alarm/{sid} with {edge:true, severity, sid, value} — the Alarm List's
    -- "External Fault/Event" (animals, lightning, a grid incident) is exactly this
    -- shape: an event the device reports, not a threshold the cloud computes from
    -- a reading.
    --
    -- Those alarms were persisted to edge_alarm_log and went no further. Nothing
    -- reads that table: no API endpoint selects from it, no page renders it, and
    -- the flow node that writes it has no downstream wire. So a fault the device
    -- detected and reported never reached the alarm list, never notified anyone
    -- and never escalated.
    --
    -- Edge alarms now also land in alarm_events, where the alarm UI, the notifier
    -- and the escalation scan already look. `source` keeps the provenance that
    -- alarm_events could not previously express — the frontend's AlarmEvent type
    -- has carried a 'edge' | 'cloud' field all along with no column behind it.
    USE iothub;
    
    ALTER TABLE alarm_events
      ADD COLUMN source ENUM('edge','cloud') NOT NULL DEFAULT 'cloud' AFTER kind;
    
    -- Existing rows were all cloud-evaluated; the DEFAULT already covers them, and
    -- naming it explicitly keeps a re-run of this migration honest.
    UPDATE alarm_events SET source = 'cloud' WHERE source IS NULL;
    
    CREATE INDEX idx_alarm_events_source ON alarm_events (source);
  migrate-v51.sql: |
    -- migrate-v51.sql — Detect two physical devices publishing under one node id
    --
    -- MQTT gives a subscriber no way to tell WHICH client published a frame: the
    -- PUBLISH packet carries no client identity, so worker/main.go cannot see a
    -- clientid at all (paho's Message interface is Topic/Payload/Qos/Retained —
    -- nothing else). Identity comes only from the payload's own nodeId, which two
    -- boards flashed from the same firmware image will happily both claim.
    --
    -- The broker enforces clientid uniqueness at the connection layer, so two such
    -- boards kick each other in a reconnect loop — but the application never learns
    -- that happened, and their readings interleave into ONE node's history:
    -- charts, alarms and the health index then describe two different transformers
    -- averaged together, with nothing in the logs to say so.
    --
    -- `uptime` is the signal that survives all of this. It arrives on every
    -- heartbeat, counts seconds since THAT board booted, and for a single device
    -- can only ever climb. Two devices alternating under one id make it jump
    -- backwards on roughly every other frame. A device that merely rebooted makes
    -- it jump backwards exactly once, which is why the count (not a single event)
    -- is what gets flagged — see uptimeRegressionThreshold in worker/main.go.
    USE iothub;
    
    ALTER TABLE device_presence
      -- Last uptime reported for this node, in seconds since the device booted.
      -- NULL until the first heartbeat carrying one arrives; firmware that never
      -- sends uptime simply never participates in this check.
      ADD COLUMN last_uptime BIGINT UNSIGNED NULL AFTER fw,
      -- Backwards jumps counted inside the current window. Reset when the window
      -- expires, so an isolated reboot every few weeks never accumulates.
      ADD COLUMN uptime_regressions SMALLINT UNSIGNED NOT NULL DEFAULT 0 AFTER last_uptime,
      ADD COLUMN uptime_window_start DATETIME(3) NULL AFTER uptime_regressions,
      -- Set when the count crosses the threshold; cleared by an admin from the
      -- pending/device screen once the cause is resolved. Deliberately a timestamp
      -- rather than a boolean so "when did this start" survives.
      ADD COLUMN identity_conflict_at DATETIME(3) NULL AFTER uptime_window_start;
    
    -- The admin screens filter on it, and on a large fleet the flagged rows are a
    -- tiny minority — so this reads a handful of rows instead of the whole table.
    CREATE INDEX idx_presence_identity_conflict ON device_presence (identity_conflict_at);
  migrate-v52.sql: |
    -- migrate-v52.sql — restrict a displayed-parameter selection to specific
    -- people, not just a whole department
    --
    -- display_params (v26/v28) already answers "org default" and "this
    -- department's set" via department_id. A department is the right
    -- granularity most of the time, but not always: an admin who wants exactly
    -- one engineer — not their whole maintenance team — to see a diagnostic-only
    -- parameter set had no way to say so short of creating a department of one.
    --
    -- Same trick as department_id/dept_scope (v28) and node_id/node_scope (v26):
    -- a nullable user_id column plus a generated sentinel column for the unique
    -- key, since MySQL treats NULL as distinct-from-itself in a UNIQUE index and
    -- "one row per (node, department, org-wide-person) combination" needs every
    -- optional scope collapsed to a comparable value.
    --
    -- user_id is deliberately NOT a sub-scope of department_id (both nullable,
    -- independent): naming a person is meant to cut across departments, not
    -- narrow one — "this one engineer regardless of which team they're on
    -- today" is the case a department-of-one would otherwise be needed for.
    USE iothub;
    
    ALTER TABLE display_params ADD COLUMN user_id VARCHAR(64) NULL;
    ALTER TABLE display_params ADD COLUMN user_scope VARCHAR(64)
      AS (IFNULL(user_id, '*')) STORED;
    
    ALTER TABLE display_params DROP INDEX uq_display_params;
    ALTER TABLE display_params
      ADD UNIQUE KEY uq_display_params (org_id, domain, node_scope, dept_scope, user_scope, param_key);
    ALTER TABLE display_params
      ADD INDEX idx_display_params_user (org_id, domain, user_scope);
  migrate-v53.sql: |
    -- migrate-v53.sql — personal (per-user, per-node) alarm thresholds
    --
    -- alarm_rules is one row per node — the single shared threshold everyone
    -- (admin and every viewer) sees as that device's WARNING/CRITICAL state.
    -- There was no way for an individual viewer to say "notify ME specifically
    -- when THIS reading crosses a threshold I pick" without changing what
    -- everyone else sees for that node.
    --
    -- Deliberately its own table, not folded into user_prefs.prefs (where
    -- alertChannels/alertTopics already live per-node, per-user): the ingest
    -- worker needs "every personal rule for node X" on every telemetry tick,
    -- which a JSON blob can't answer without scanning and parsing every org
    -- user's whole prefs column. mePutFunc/MyAlertSettings' save() also already
    -- do a whole-blob read-then-replace for alertChannels/alertTopics — a
    -- personal-rule editor sharing that same blob on its own save timing would
    -- race against those toggles. A dedicated row makes both problems moot.
    USE iothub;
    
    CREATE TABLE IF NOT EXISTS user_node_rules (
      user_id     VARCHAR(64) NOT NULL,
      node_id     VARCHAR(64) NOT NULL,
      org_id      VARCHAR(64) NOT NULL,
      domain      VARCHAR(32) NOT NULL,
      rule_json   JSON NOT NULL,
