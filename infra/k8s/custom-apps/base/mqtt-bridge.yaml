# ============================================================
# MQTT-to-Kafka Bridge — Kubernetes Deployment
# Custom Node.js service bridging EMQX → Kafka
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mqtt-bridge
  namespace: app
  labels:
    app: mqtt-bridge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mqtt-bridge
  template:
    metadata:
      labels:
        app: mqtt-bridge
    spec:
      containers:
      - name: mqtt-bridge
        image: registry.ci.svc.cluster.local/carbon-credit/mqtt-bridge:latest
        env:
        - name: MQTT_BROKER_URL
          value: "mqtt://emqx.data.svc.cluster.local:1883"
        - name: KAFKA_BROKERS
          value: "kafka.data.svc.cluster.local:9092"
        - name: KAFKA_CLIENT_ID
          value: "mqtt-bridge"
        - name: KAFKA_TOPIC_PREFIX
          value: "agency"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mqtt-bridge
  namespace: app
spec:
  selector:
    app: mqtt-bridge
  ports:
  - name: http
    protocol: TCP
    port: 3001
    targetPort: 3001
