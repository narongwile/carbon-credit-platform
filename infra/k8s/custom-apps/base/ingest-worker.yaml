# ONEOPS ingest worker — device MQTT → MySQL (readings/pending/alarms) → Redpanda
# → internal/telemetry/live/# for the Node-RED WS dashboard. Without it nothing
# persists and the UI stays empty.
---
# Worker credentials. This Secret was previously referenced but never defined in
# the repo, so envFrom (non-optional) left the pod stuck in CreateContainerConfigError
# — the worker never ran, so no MQTT was ingested and every device showed 0 values.
# MQTT_PASS = the seeded EMQX 'ingest' user password (emqx-extras-uat, superuser);
# DB_DSN    = control DB (root / iothub, same host+creds Node-RED uses in UAT).
apiVersion: v1
kind: Secret
metadata:
  name: ingest-worker-secrets
  namespace: iiot-uat
  labels:
    app: ingest-worker
type: Opaque
stringData:
  MQTT_PASS: "iothub.2026"
  DB_DSN: "root:iothub.2026@tcp(mysql.iiot-uat.svc.cluster.local:3306)/iothub?parseTime=true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest-worker
  namespace: iiot-uat
  labels:
    app: ingest-worker
    app.kubernetes.io/name: ingest-worker
    app.kubernetes.io/component: iot-ingest
spec:
  # Single instance + shared subscription. To scale: raise replicas — the
  # "$share/..." topic load-balances each message to exactly one worker (EMQX).
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ingest-worker
  template:
    metadata:
      labels:
        app: ingest-worker
      annotations:
        # Bump to force a pod roll when the ingest-worker-secrets values change
        # (envFrom does NOT restart pods on Secret updates). Set when DB_DSN moved
        # off the empty 'carbon_credit' DB onto the migrated 'iothub' DB.
        checksum/secrets: "db-iothub-1"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: worker
          image: registry.gitlab.com/narongwile/carbon-credit-platform/ingest-worker:1f5ae62b
          imagePullPolicy: Always
          env:
            - name: TZ
              value: Asia/Bangkok
            # Prod broker = EMQX (supports shared subscriptions).
            - name: MQTT_BROKER
              value: "tcp://emqx:1883"
            - name: MQTT_USER
              value: ingest
            - name: MQTT_SUB_TOPIC
              value: "$share/ingest-worker/telemetry/#"
            - name: TENANT_DB_MODE
              value: "off"
            - name: KAFKA_BROKERS
              value: "redpanda.iiot-uat.svc.cluster.local:9092"
            # Unique client id per pod so replicas never kick each other.
            - name: MQTT_CLIENT_ID
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          envFrom:
            # optional so a missing secret can never wedge the pod in
            # CreateContainerConfigError again (worker falls back to env defaults).
            - secretRef: { name: ingest-worker-secrets, optional: true }
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      terminationGracePeriodSeconds: 20
