# ============================================================
# Kustomize Base — Custom Applications
# Only contains apps WE build and control (not Helm charts)
# ============================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Use new `labels` syntax with includeSelectors:false → labels added to metadata
# only, NOT pod selectors. Prevents "field is immutable" error when upgrading
# existing Deployments where selector includes these labels.
labels:
  - pairs:
      app.kubernetes.io/part-of: carbon-credit-platform
      tier: custom-apps
    includeSelectors: false
    includeTemplates: false

resources:
  # ── Namespaces ──
  - namespace.yaml
  # ── Custom Apps (disabled until CI registry + images are built) ──
  # - backend.yaml           # needs registry.ci.svc.cluster.local image
  # - frontend-app.yaml      # needs registry.ci.svc.cluster.local image
  # - ai-agents.yaml         # needs registry.ci.svc.cluster.local image
  # - mqtt-bridge.yaml       # needs registry.ci.svc.cluster.local image + Kafka
  # ── IoT Services ──
  # - mosquitto.yaml         # replaced by EMQX (data namespace)
  - node-red.yaml
  - ingest-worker.yaml
  # ── Next.js platform UI (separate app; browser -> nodered ingress) ──
  - frontend-next.yaml
  # ── Observability ──
  # - ai-agents-monitor.yaml # disabled: requires ServiceMonitor CRD
  # ── Security ──
  - network-policy.yaml
