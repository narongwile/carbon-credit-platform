tion'};return msg;}\nconst pool=global.get('resolvePool')(orgId);\n(async()=>{\n  const acc = (au.role==='superadmin'||au.role==='admin') ? null : await global.get('accessFor')(au.userId);\n  let sql = \"SELECT e.id,e.node_id,e.org_id,e.department_id,e.param_key,e.param_label,e.severity,e.kind,e.value,e.threshold,e.unit,e.raised_at,e.acknowledged_at,e.acknowledged_by,e.event_problem_id,e.cleared_at,n.domain,n.site_id,n.department_id AS node_department_id,n.name AS node_name FROM alarm_events e JOIN nodes n ON n.id=e.node_id WHERE e.org_id=?\";\n  const args=[orgId];\n  if(openOnly){ sql+=\" AND e.cleared_at IS NULL AND e.acknowledged_at IS NULL\"; }\n  sql += \" ORDER BY e.raised_at DESC\";\n  // Admin/superadmin (unscoped, whole org) gets the same cap fleetListFunc-\n  // style endpoints elsewhere in this file use for an unbounded query. A\n  // scoped (non-admin) caller does NOT get this cap in SQL: it used to apply\n  // here too, before the visibility filter below ever ran — so a busier\n  // department/domain the caller cannot even see could fill the cap on its\n  // own and silently push the caller's own real, open alarms out of the\n  // result entirely. In practice every scoped caller already asks with\n  // open=1 (unacknowledged+uncleared, a naturally bounded set), so this\n  // stays bounded in memory without a SQL-level cap; the JS filter's own\n  // .slice(0,300) below is the caller-visible cap instead.\n  if(!acc) sql += \" LIMIT 300\";\n  const[rows]=await pool.query(sql,args);\n  const grants = acc ? await global.get('nodeDeptMap')(pool, orgId) : {};\n  const vis = acc ? rows.filter(r=>{\n    const lvl=acc.levels[r.domain]||'none'; if(lvl==='none') return false;\n    if(!global.get('deptVisible')(acc, r.node_department_id, grants[r.node_id])) return false;\n    if(!global.get('siteVisible')(acc, r.site_id)) return false;\n    // Per-user device restriction (migrate-v42). Missing here while every\n    // other read path had it, which broke this function's own stated rule\n    // that \"which alarms can I see\" must never disagree with \"which devices\n    // can I see\": a user limited to three devices still saw the whole org's\n    // alarm feed, including device names and fault text for devices they\n    // cannot open.\n    if(!global.get('nodeVisible')(acc, r.node_id)) return false;\n    return true;\n  }).slice(0,300) : rows;\n  msg.headers=__CORS; msg.payload=vis; node.send(msg);\n})().catch(e=>{msg.headers=__CORS;msg.statusCode=500;msg.payload={error:e.message};node.send(msg);}); return null;\n})();","outputs":1,"libs":[{"var":"mysql","module":"mysql2/promise"}],"x":420,"y":1560,"wires":[["orgalarms_resp"]]},{"id":"orgalarms_resp","type":"http response","z":"be","statusCode":"","x":700,"y":1560,"wires":[]},{"id":"transport_in","type":"http in","z":"be","name":"","url":"/api/nodes/:id/transport","method":"get","x":150,"y":1610,"wires":[["transport_fn"]]},{"id":"transport_fn","type":"function","z":"be","name":"GET /api/nodes/:id/transport","func":"\nreturn (async()=>{\nconst __g=global.get('guard');\nconst __ar=__g?await __g((msg.req.headers&&(msg.req.headers.authorization||msg.req.headers.Authorization))||'','node',msg.req):{ok:false,code:503,error:'auth not ready'};\nif(!__ar.ok){msg.headers={'Access-Control-Allow-Origin':env.get('CORS_ORIGIN')||'*'};msg.statusCode=__ar.code;msg.payload={error:__ar.error};return msg;}\nmsg.auth=__ar.auth;\nconst __CORS={'Access-Control-Allow-Origin':env.get('CORS_ORIGIN')||'*','Access-Control-Allow-Headers':'content-type, x-user-id, authorization','Access-Control-Allow-Methods':'GET,PUT,POST,DELETE,OPTIONS','X-Content-Type-Options':'nosniff','X-Frame-Options':'DENY'};\nconst pool=global.get('resolvePool')(msg.auth&&msg.auth.orgId); const id=msg.req.params.id;\n(async()=>{\n  const out=[];\n  try{ const [t]=await pool.query(\"SELECT id,from_transport,to_transport,reason,rssi,ts FROM transport_events WHERE node_id=? ORDER BY ts DESC LIMIT 25\",[id]);\n    for(const r of t) out.push({ id:'tr-'+r.id, ts:r.ts, type: r.to_transport==='none' ? 'LINK_LOST' : (r.from_transport==='none' ? 'LINK_RESTORE' : 'FALLBACK_'+String(r.to_transport||'').toUpperCase()),\n      desc: 'Link '+r.from_transport+' → '+r.to_transport+(r.reason?' ('+r.reason+')':'')+(r.rssi!=null?' · RSSI '+r.rssi:''), isOfflineSync:false });\n  }catch(e){ node.warn('transport_events: '+e.message); }\n  // Connectivity alarms (raised by the offline sweep) belong on this timeline,\n  // not in the threshold alarm log — \"Device Offline\" is a link event.\n  try{ const [o]=await pool.query(\"SELECT id,severity,raised_at FROM alarm_events WHERE node_id=? AND kind='offline' ORDER BY raised_at DESC LIMIT 25\",[id]);\n    for(const r of o) out.push({ id:'off-'+r.id, ts:r.raised_at, type:'DEVICE_OFFLINE',\n      desc:'Device stopped reporting — marked offline by the presence sweep', isOfflineSync:false });\n  }catch(e){ node.warn('offline alarm_events: '+e.message); }\n  try{ const [s]=await pool.query(\"SELECT id,records_count,oldest_ts,newest_ts,sync_at FROM offline_sync_log WHERE node_id=? ORDER BY sync_at DESC LIMIT 25\",[id]);\n    for(const r of s) out.push({ id:'os-'+r.id, ts:r.sync_at, type:'OFFLINE_SYNC',\n      desc:'Flushed '+r.records_count+' offline record'+(r.records_count===1?'':'s')+' to cloud', isOfflineSync:true });\n  }catch(e){ node.warn('offline_sync_log: '+e.message); }\n  out.sort((a,b)=> new Date(b.ts) - new Date(a.ts));\n  msg.headers=__CORS; msg.payload=out.slice(0,25); node.send(msg);\n})().catch(e=>{msg.headers=__CORS;msg.statusCode=500;msg.payload={error:e.message};node.send(msg);}); return null;\n})();","outputs":1,"libs":[{"var":"mysql","module":"mysql2/promise"}],"x":420,"y":1610,"wires":[["transport_resp"]]},{"id":"transport_resp","type":"http response","z":"be","statusCode":"","x":700,"y":1610,"wires":[]},{"id":"ack_in","type":"http in","z":"be","name":"","url":"/api/events/:id/ack","method":"post","x":150,"y":1660,"wires":[["ack_fn"]]},{"id":"ack_fn