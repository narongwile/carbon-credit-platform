# ============================================================
# Node-RED — production-grade single-replica (Recreate strategy)
#   • EMQX via cluster DNS: emqx.data.svc.cluster.local:1883
#     (NEVER use localhost — localhost in pod = pod itself, not EMQX)
#   • Exposed:
#       - https://nodered.${DOMAIN}        (Traefik + Let's Encrypt)
#       - http://NODE_IP:1880               (externalIPs Service)
#   • WebSocket-friendly probes & settings (kills "Lost connection..." storms)
#   • Palette install enabled: writable /data, npm egress via NetworkPolicy
# ============================================================
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: node-red-data
  namespace: carbon-credit
  labels:
    app: node-red
  annotations:
    # Never let ArgoCD prune/replace this data volume. A prune left it stuck
    # Terminating (pvc-protection finalizer) so the new node-red pod could not
    # schedule ("persistentvolumeclaim node-red-data is being deleted"). PVC specs
    # are largely immutable — protecting it stops the delete→recreate churn.
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi          # Palette modules + flow history
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-red
  namespace: carbon-credit
  labels:
    app: node-red
    app.kubernetes.io/name: node-red
    app.kubernetes.io/component: iot-flow-editor
spec:
  replicas: 1
  strategy:
    type: Recreate            # PVC RWO — single writer only
  selector:
    matchLabels:
      app: node-red
  template:
    metadata:
      labels:
        app: node-red
      annotations:
        # sha256 of flows.nodered-backend.json — changes on every flow update, so
        # the pod template changes → ArgoCD rolls the pod → load-flow re-copies the
        # new flow. Maintained by infra/scripts/sync-nodered-flow.sh (do not hand-edit).
        checksum/flow: "d9a2aaeeeee2852c"
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
        # GitOps flow: copy the committed flow (node-red-flow ConfigMap) into the
        # PVC before Node-RED starts, so a deploy always runs the tracked flow.
        # Overwrites on every (re)deploy — the generator is the source of truth.
        - name: load-flow
          image: busybox:latest
          command: ["sh", "-c", "cp /flow-src/flows.json /data/flows.json && echo 'loaded flows.json from ConfigMap'"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: node-red-data
              mountPath: /data
            - name: flow-src
              mountPath: /flow-src
        - name: fix-permissions
          image: busybox:latest
          command: ["sh", "-c", "chown -R 1000:1000 /data"]
          securityContext:
            runAsUser: 0 # ใช้ root เพื่อปลดล็อกสิทธิ์
          volumeMounts:
            - name: node-red-data
              mountPath: /data
      containers:
        - name: node-red
          image: nodered/node-red:4.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 1880
              name: http
              protocol: TCP
          env:
            - name: TZ
              value: Asia/Bangkok
            - name: NODE_OPTIONS
              value: "--max-old-space-size=1536"
            # ── EMQX (cluster DNS) ──
            - name: MQTT_BROKER_URL
              value: "mqtt://emqx.data.svc.cluster.local:1883"
            - name: MQTT_BROKER_HOST
              value: emqx.data.svc.cluster.local
            - name: MQTT_BROKER_PORT
              value: "1883"
            - name: MQTT_USERNAME
              value: nodered
            - name: MQTT_PASSWORD
              value: "iothub.2026"
            # ── Database ──
            - name: DB_HOST
              value: "mysql.data.svc.cluster.local"
            - name: DB_USER
              value: "root"
            # Flow reads env.DB_PASSWORD (generator L58), NOT DB_PASS — the name
            # must match or the secret is ignored and the flow silently falls back
            # to the hardcoded 'iothub.2026' default.
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: mysql-root-password
                  optional: true
            - name: DB_NAME
              value: "iothub"
            # Lock API CORS to the production frontend origin (flows read env.CORS_ORIGIN)
            - name: CORS_ORIGIN
              value: "https://iiotplatform.thermexpertise.com"
            # Origin used to build the "Open device" deep link in alarm cards
            # (LINE Flex / Telegram button / Google Chat card). Set explicitly so
            # the links do not silently break if the CORS policy is ever widened
            # to '*' — notify falls back to CORS_ORIGIN when this is unset.
            - name: APP_BASE_URL
              value: "https://iiotplatform.thermexpertise.com"
            # DB-per-tenant: ON. Data-plane queries (readings, alarms, events,
            # documents, ...) route to iothub_<org> instead of the shared control
            # DB. MUST match the worker's TENANT_DB_MODE in ingest-worker.yaml —
            # the two disagreeing means readings write to one database while the
            # API reads from another. Enabled 2026-07-27 after migrate-service was
            # confirmed healthy and every existing org (org-1 + the provisioning-
            # wizard test orgs) was backfilled via POST /migrate/all-orgs.
            #
            # A NEW org from here on is provisioned automatically: orgsPostFunc
            # calls MIGRATE_URL on creation, so its iothub_<org> database exists
            # before the org can log in. Re-run the all-orgs backfill only if an
            # org row is ever inserted by hand instead of through /api/orgs.
            - name: TENANT_DB_MODE
              value: "on"
            - name: MIGRATE_URL
              value: "http://migrate-service.iiot-uat.svc.cluster.local:8090"
            # Dashboard admin auth (from seeded Secret)
            - name: NODE_RED_USERNAME
              valueFrom:
                secretKeyRef:
                  name: node-red-auth
                  key: username
                  optional: true
            - name: NODE_RED_PASSWORD_BCRYPT
              valueFrom:
                secretKeyRef:
                  name: node-red-auth
                  key: password-bcrypt
                  optional: true
            # Storage / runtime
            - name: NODE_RED_USERDIR
              value: /data
            - name: FLOWS
              value: flows.json
            - name: NPM_CONFIG_REGISTRY
              value: "https://registry.npmjs.org/"
            - name: NPM_CONFIG_CACHE
              value: "/data/.npm"
            - name: NODE_RED_ENABLE_PROJECTS
              value: "true"
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          # Probes — generous timing keeps editor WebSocket alive
          startupProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: node-red-data
              mountPath: /data
            - name: node-red-settings
              mountPath: /data/settings.js
              subPath: settings.js
      volumes:
        - name: node-red-data
          persistentVolumeClaim:
            claimName: node-red-data
        - name: flow-src
          configMap:
            name: node-red-flow
        - name: node-red-settings
          configMap:
            name: node-red-settings
            items:
              - key: settings.js
                path: settings.js
---
# Runtime settings — adminAuth + WebSocket tuning + palette install
apiVersion: v1
kind: ConfigMap
metadata:
  name: node-red-settings
  namespace: carbon-credit
  labels:
    app: node-red
data:
  settings.js: |
    module.exports = {
      uiPort: process.env.PORT || 1880,
      uiHost: '0.0.0.0',

      flowFile: process.env.FLOWS || 'flows.json',
      flowFilePretty: true,
      userDir: process.env.NODE_RED_USERDIR || '/data',

      // Admin authentication
      adminAuth: {
        type: 'credentials',
        users: [{
          username: process.env.NODE_RED_USERNAME || 'admin',
          password: process.env.NODE_RED_PASSWORD_BCRYPT
                   || '$2b$08$ZpFlbR2/4UwEK4Vw4eWZleANvAUcuExt95YwXk3SCFsv9c.LFPYqK',
          permissions: '*'
        }],
        sessionExpiryTime: 86400
      },

      // HTTP CORS — allow external dashboards to consume Node-RED HTTP endpoints
      httpNodeCors: {
        origin:  '*',
        methods: 'GET,PUT,POST,DELETE'
      },

      // WebSocket / Editor live-link tuning — kills "Lost connection" reconnect storms
      apiMaxLength:               '50mb',
      socketReconnectTime:        5000,
      socketTimeout:              60000,
      webSocketNodeVerifyClient:  false,

      // Runtime flags
      runtimeState: { enabled: true, ui: true },
      diagnostics:  { enabled: true, ui: true },

      logging: {
        console: {
          level:   'info',
          metrics: false,
          audit:   false
        }
      },

      editorTheme: {
        projects: { enabled: false },
        palette: {
          editable: true,
          catalogues: [
            'https://catalogue.nodered.org/catalogue.json'
          ]
        },
        page: {
          title: 'Thermexpertise IoT Platform'
        },
        header: {
          title: 'Thermexpertise — Node-RED'
        }
      },

      functionGlobalContext: {
        mqttBroker:   process.env.MQTT_BROKER_URL,
        mqttUser:     process.env.MQTT_USERNAME,
        mqttPassword: process.env.MQTT_PASSWORD
      },

      functionExternalModules: true,

      // Global context holds non-serializable runtime objects (mysql pools,
      // nodemailer transport, and the guard/resolvePool/encryptSecret/mailConfig
      // helper functions). The localfilesystem store JSON.stringifies context on
      // flush, which throws on those (circular refs / functions) → error spam and
      // failed persistence. These objects are all recreated by the init node on
      // startup, so memory-only is correct and silent.
      contextStorage: {
        default: {
          module: "memory"
        }
      }
    };
---
# Internal Service — used by cluster DNS / Ingress / other pods
apiVersion: v1
kind: Service
metadata:
  name: node-red
  namespace: carbon-credit
  labels:
    app: node-red
spec:
  type: ClusterIP            # was NodePort:1880 — invalid (K3s NodePort range 30000-32767)
  selector:
    app: node-red
  ports:
    - name: http
      port: 1880
      targetPort: http
      protocol: TCP
---
# External Service — direct IP access at http://NODE_IP:1880
# kube-proxy installs iptables rule for externalIPs → pod
apiVersion: v1
kind: Service
metadata:
  name: node-red-external
  namespace: carbon-credit
  labels:
    app: node-red
    app.kubernetes.io/component: external-listener
spec:
  type: ClusterIP
  externalIPs:
    - 14.207.141.71          # CHANGE if node IP changes
  selector:
    app: node-red
  ports:
    - name: http
      port: 1880
      targetPort: http
      protocol: TCP
---
# Ingress — domain access via Traefik + Let's Encrypt
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: node-red
  namespace: carbon-credit
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: nodered.thermexpertise.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: node-red
                port:
                  number: 1880
  tls:
    - hosts:
        - nodered.thermexpertise.com
      secretName: nodered-tls
