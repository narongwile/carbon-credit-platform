# ==========================================
# Node-RED: private admin service with persistence
# Public exposure should happen only through a secured Traefik route.
# ==========================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: node-red-data
  namespace: carbon-credit
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-red
  namespace: carbon-credit
  labels:
    app: node-red
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: node-red
  template:
    metadata:
      labels:
        app: node-red
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: node-red
          image: nodered/node-red:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 1880
              name: http
          env:
            - name: TZ
              value: Asia/Bangkok
            # ── EMQX MQTT Broker (replaces Mosquitto) ──
            - name: MQTT_BROKER_URL
              value: "mqtt://emqx.data.svc.cluster.local:1883"
            - name: MQTT_BROKER_HOST
              value: emqx.data.svc.cluster.local
            - name: MQTT_BROKER_PORT
              value: "1883"
            # adminAuth credentials, consumed by /data/settings.js below
            - name: NODE_RED_USERNAME
              valueFrom:
                secretKeyRef:
                  name: node-red-auth
                  key: username
            - name: NODE_RED_PASSWORD_BCRYPT
              valueFrom:
                secretKeyRef:
                  name: node-red-auth
                  key: password-bcrypt
            # Tell Node-RED to load our settings.js from /etc/node-red-config
            - name: NODE_RED_USERDIR
              value: /data
            - name: FLOWS
              value: flows.json
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - name: node-red-data
              mountPath: /data
            - name: node-red-settings
              mountPath: /data/settings.js
              subPath: settings.js
      volumes:
        - name: node-red-data
          persistentVolumeClaim:
            claimName: node-red-data
        - name: node-red-settings
          configMap:
            name: node-red-settings
            items:
              - key: settings.js
                path: settings.js
---
# Node-RED runtime settings — picks up admin user/bcrypt from env vars,
# which are wired to the pre-seeded `node-red-auth` Secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: node-red-settings
  namespace: carbon-credit
data:
  settings.js: |
    module.exports = {
      uiPort: process.env.PORT || 1880,
      flowFile: 'flows.json',
      flowFilePretty: true,
      adminAuth: {
        type: 'credentials',
        users: [{
          username: process.env.NODE_RED_USERNAME || 'admin',
          password: process.env.NODE_RED_PASSWORD_BCRYPT,
          permissions: '*'
        }]
      },
      httpNodeAuth: {
        user: process.env.NODE_RED_USERNAME || 'admin',
        pass: process.env.NODE_RED_PASSWORD_BCRYPT
      },
      logging: {
        console: { level: 'info', metrics: false, audit: false }
      },
      editorTheme: {
        projects: { enabled: false },
        page:     { title: 'Carbon Credit — Node-RED' }
      },
      functionGlobalContext: {}
    };
---
apiVersion: v1
kind: Service
metadata:
  name: node-red
  namespace: carbon-credit
spec:
  type: NodePort
  ports:
    - name: http
      port: 1880
      targetPort: http
      nodePort: 1880       # http://VPS_IP:1880  (K3s NodePort range starts at 1024)
  selector:
    app: node-red
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: node-red
  namespace: carbon-credit
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: nodered.thermexpertise.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: node-red
                port:
                  number: 1880
  tls:
    - hosts:
        - nodered.thermexpertise.com
      secretName: nodered-tls
