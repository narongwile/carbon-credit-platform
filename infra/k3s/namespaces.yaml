# ============================================================
# Carbon Credit IoT Platform — K3s Namespace Definitions
# Deploy: kubectl apply -f namespaces.yaml
# ============================================================
---
apiVersion: v1
kind: Namespace
metadata:
  name: infra
  labels:
    app.kubernetes.io/part-of: carbon-credit-platform
    tier: infrastructure
---
apiVersion: v1
kind: Namespace
metadata:
  name: data
  labels:
    app.kubernetes.io/part-of: carbon-credit-platform
    tier: data-processing
---
apiVersion: v1
kind: Namespace
metadata:
  name: ai
  labels:
    app.kubernetes.io/part-of: carbon-credit-platform
    tier: ai-processing
---
apiVersion: v1
kind: Namespace
metadata:
  name: auth
  labels:
    app.kubernetes.io/part-of: carbon-credit-platform
    tier: authentication
---
apiVersion: v1
kind: Namespace
metadata:
  name: app
  labels:
    app.kubernetes.io/part-of: carbon-credit-platform
    tier: application
---
apiVersion: v1
kind: Namespace
metadata:
  name: analytics
  labels:
    app.kubernetes.io/part-of: carbon-credit-platform
    tier: analytics
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    app.kubernetes.io/part-of: carbon-credit-platform
    tier: monitoring
---
apiVersion: v1
kind: Namespace
metadata:
  name: ci
  labels:
    app.kubernetes.io/part-of: carbon-credit-platform
    tier: ci-cd

# ============================================================
# Resource Quotas per Namespace
# ============================================================
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: infra-quota
  namespace: infra
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    pods: "50"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: data-quota
  namespace: data
spec:
  hard:
    requests.cpu: "12"
    requests.memory: 24Gi
    limits.cpu: "24"
    limits.memory: 48Gi
    pods: "40"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ai-quota
  namespace: ai
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    pods: "20"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: app-quota
  namespace: app
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    pods: "30"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: analytics-quota
  namespace: analytics
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    pods: "15"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: monitoring-quota
  namespace: monitoring
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    pods: "20"

# ============================================================
# LimitRange defaults — auto-fill missing requests/limits
# ============================================================
# Why: ResourceQuotas above force EVERY container (init, sidecar, main) to
# declare requests + limits. Many community Helm charts forget to set these
# on auxiliary containers (e.g., wait-for-X init, sidecar watchers), causing
# pod admission to fail with "must specify limits.cpu for: ...".
#
# A LimitRange named `defaults` injects requests/limits at admission time for
# any container that omits them. Charts that already declare resources keep
# their own values (LimitRange only fills in missing fields).
#
# `max` puts a per-container ceiling so no single container can swallow the
# entire namespace quota.
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: infra
spec:
  limits:
    - type: Container
      defaultRequest: { cpu: 50m,  memory: 64Mi }
      default:        { cpu: 500m, memory: 512Mi }
      max:            { cpu: "4",  memory: 8Gi }
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: data
spec:
  limits:
    - type: Container
      defaultRequest: { cpu: 50m,  memory: 64Mi }
      default:        { cpu: 500m, memory: 512Mi }
      max:            { cpu: "8",  memory: 16Gi }
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: ai
spec:
  limits:
    - type: Container
      defaultRequest: { cpu: 50m,  memory: 64Mi }
      default:        { cpu: 500m, memory: 512Mi }
      max:            { cpu: "4",  memory: 8Gi }
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: app
spec:
  limits:
    - type: Container
      defaultRequest: { cpu: 50m,  memory: 64Mi }
      default:        { cpu: 500m, memory: 512Mi }
      max:            { cpu: "2",  memory: 4Gi }
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: analytics
spec:
  limits:
    - type: Container
      defaultRequest: { cpu: 50m,  memory: 64Mi }
      default:        { cpu: 500m, memory: 512Mi }
      max:            { cpu: "2",  memory: 4Gi }
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: monitoring
spec:
  limits:
    - type: Container
      defaultRequest: { cpu: 50m,  memory: 64Mi }
      default:        { cpu: 500m, memory: 512Mi }
      max:            { cpu: "2",  memory: 4Gi }

# ============================================================
# Network Policies — Multi-Agency Tenant Isolation
# ============================================================
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-cross-namespace
  namespace: app
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              tier: application
        - namespaceSelector:
            matchLabels:
              tier: authentication
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              tier: infrastructure
        - namespaceSelector:
            matchLabels:
              tier: data-processing
        - namespaceSelector:
            matchLabels:
              tier: ai-processing
        - namespaceSelector:
            matchLabels:
              tier: authentication
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ai-namespace-policy
  namespace: ai
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              tier: application
        - namespaceSelector:
            matchLabels:
              tier: data-processing
