# Apache Superset — BI Dashboard for Carbon Credit Platform
# Single-node VPS: 1 web + 1 worker, modest memory requests.

image:
  repository: apache/superset
  tag: latest-dev
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8088

ingress:
  enabled: true
  ingressClassName: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
  hosts:
    - host: dashboard.carbon-credit.go.th
      paths:
        - path: /
          pathType: ImplementationSpecific

configOverrides:
  secret: |
    import os
    SECRET_KEY = os.getenv('SUPERSET_SECRET_KEY')
    SQLALCHEMY_DATABASE_URI = f"postgresql://superset:{os.getenv('PG_PASSWORD')}@postgres-superset.infra.svc.cluster.local:5432/superset"
    from flask_appbuilder.security.manager import AUTH_OID
    AUTH_TYPE = AUTH_OID
    OIDC_CLIENT_ID = 'superset-client'
    OIDC_CLIENT_SECRET = os.getenv('KEYCLOAK_CLIENT_SECRET')
    OIDC_OPENID_CONNECT_URL = 'https://auth.carbon-credit.go.th/realms/master'

resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    cpu: "1"
    memory: 1536Mi

_initWaitPostgres: &initWaitPostgres
  name: wait-for-postgres
  image: "{{ .Values.initImage.repository }}:{{ .Values.initImage.tag }}"
  imagePullPolicy: "{{ .Values.initImage.pullPolicy }}"
  envFrom:
    - secretRef:
        name: "{{ tpl .Values.envFromSecret . }}"
  command:
    - /bin/sh
    - -c
    - dockerize -wait "tcp://$DB_HOST:$DB_PORT" -timeout 120s
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

_initWaitPostgresRedis: &initWaitPostgresRedis
  name: wait-for-postgres-redis
  image: "{{ .Values.initImage.repository }}:{{ .Values.initImage.tag }}"
  imagePullPolicy: "{{ .Values.initImage.pullPolicy }}"
  envFrom:
    - secretRef:
        name: "{{ tpl .Values.envFromSecret . }}"
  command:
    - /bin/sh
    - -c
    - dockerize -wait "tcp://$DB_HOST:$DB_PORT" -wait "tcp://$REDIS_HOST:$REDIS_PORT" -timeout 120s
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

supersetNode:
  replicaCount: 1
  command: ["/app/docker/docker-bootstrap.sh", "app-gunicorn"]
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      cpu: "1"
      memory: 1536Mi
  initContainers:
    - *initWaitPostgres

supersetWorker:
  replicaCount: 1
  command: ["/app/docker/docker-bootstrap.sh", "worker"]
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      cpu: "1"
      memory: 1536Mi
  initContainers:
    - *initWaitPostgresRedis

init:
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      cpu: "1"
      memory: 1536Mi
  initContainers:
    - *initWaitPostgres

postgresql:
  enabled: true
  auth:
    username: superset
    database: superset
  primary:
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

redis:
  enabled: true
  master:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
