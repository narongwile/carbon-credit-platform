# Metabase — Self-service Reporting Tool
# Architecture diagram: "Reporting" output

replicaCount: 1

image:
  repository: metabase/metabase
  tag: latest
  pullPolicy: IfNotPresent

env:
  MB_DB_TYPE: postgres
  MB_DB_DBNAME: metabase
  MB_DB_PORT: 5432
  MB_DB_USER: metabase
  MB_DB_HOST: postgres-metabase.infra.svc.cluster.local
  # MB_DB_PASS is injected via Secret
  MB_SITE_URL: https://report.carbon-credit.go.th

ingress:
  enabled: true
  ingressClassName: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
  # pmint93/metabase chart expects flat hostname strings, NOT {host:/paths:} objects.
  hostname: report.carbon-credit.go.th
  path: /
  tls:
    - secretName: metabase-tls
      hosts:
        - report.carbon-credit.go.th

resources:
  limits:
    cpu: 1000m
    memory: 1536Mi
  requests:
    cpu: 100m
    memory: 512Mi
