# ============================================================
# Monitoring Stack — kube-prometheus-stack + Loki
# Chart: prometheus-community/kube-prometheus-stack
# Deploy: helm install monitoring prometheus-community/kube-prometheus-stack \
#           -n monitoring -f monitoring-stack-values.yaml
# ============================================================

prometheus:
  prometheusSpec:
    retention: 30d
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 2Gi
    # Service monitors for all platform services
    serviceMonitorSelectorNilUsesHelmValues: false
    additionalScrapeConfigs:
      - job_name: emqx
        static_configs:
          - targets: ["emqx.infra.svc.cluster.local:30183"]
      - job_name: kafka
        static_configs:
          - targets: ["kafka-metrics.infra.svc.cluster.local:9308"]
      - job_name: minio
        static_configs:
          - targets: ["minio.infra.svc.cluster.local:9000"]
        metrics_path: /minio/v2/metrics/cluster
      - job_name: spark
        static_configs:
          - targets: ["spark-master.data.svc.cluster.local:8080"]
      - job_name: backend-api
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ["app"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: backend-api
            action: keep
      - job_name: mysql
        static_configs:
          - targets: ["mysql.carbon-credit.svc.cluster.local:9104"]

grafana:
  enabled: true
  adminUser: admin
  adminPassword: "${GRAFANA_ADMIN_PASSWORD}"
  persistence:
    enabled: true
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # Automatically provision dashboards
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: 'default'
          orgId: 1
          folder: ''
          type: 'file'
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default
  dashboards:
    default:
      mysql-overview:
        gnetId: 7362
        revision: 5
        datasource: Prometheus
      mongodb-overview:
        gnetId: 16450
        revision: 1
        datasource: Prometheus
  # Datasources
  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki.monitoring.svc.cluster.local:3100
      access: proxy
    - name: PostgreSQL-Carbon
      type: postgres
      url: postgresql.infra.svc.cluster.local:5432
      database: carbon_credit
      user: grafana_reader
      secureJsonData:
        password: "${GRAFANA_PG_PASSWORD}"
    - name: Prometheus
      type: prometheus
      url: http://prometheus-server.monitoring.svc.cluster.local:9090
      access: proxy
      isDefault: true

alertmanager:
  enabled: true
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ['alertname', 'agency']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 12h
      receiver: default
      routes:
        - match:
            severity: critical
          receiver: critical-alerts
        - match:
            severity: warning
          receiver: warning-alerts
    receivers:
      - name: default
        webhook_configs:
          - url: "http://ntfy.app.svc.cluster.local/carbon-alerts"
      - name: critical-alerts
        webhook_configs:
          - url: "http://ntfy.app.svc.cluster.local/carbon-critical"
        email_configs:
          - to: "admin@carbon-credit.go.th"
            from: "alerts@carbon-credit.go.th"
            smarthost: "postfix.infra.svc.cluster.local:25"
            require_tls: false
      - name: warning-alerts
        webhook_configs:
          - url: "http://ntfy.app.svc.cluster.local/carbon-warnings"

