# ============================================================
# MinIO — S3-compatible Object Storage
# Chart: bitnami/minio v14.6.0  (NOT minio/minio — different schema!)
#
# bitnami/minio prefixes image.registry + image.repository:
#   docker.io + quay.io/minio/minio → WRONG (docker.io/quay.io/...)
# Use bitnami defaults or set registry=quay.io + repository=minio/minio
#
# Single-node VPS: standalone mode, 1 replica.
# ============================================================

mode: standalone

# Use chart-default bitnami/minio image (don't override to quay.io —
# bitnami chart prepends image.registry, causing double-path error)

auth:
  rootUser: minio-admin
  rootPassword: "${MINIO_ROOT_PASSWORD}"

persistence:
  enabled: true
  size: 50Gi
  storageClassName: local-path

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

service:
  type: ClusterIP
  ports:
    api: 9000
    console: 9001

# Server-Side Encryption (SSE-S3)
extraEnvVars:
  - name: MINIO_KMS_SECRET_KEY
    value: "carbon-credit-key:${MINIO_ENCRYPTION_KEY}"

# ============================================================
# Bucket Provisioning — Medallion Architecture
# ============================================================
provisioning:
  enabled: true
  buckets:
    - name: raw
      policy: none
      versioning: false
    - name: bronze
      policy: none
      versioning: true
    - name: silver
      policy: none
      versioning: true
    - name: gold
      policy: none
      versioning: true
    - name: models
      policy: none
      versioning: true
    - name: backups
      policy: none
      versioning: false
    - name: warehouse
      policy: none
      versioning: true
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  # IAM Policies — Per-Agency Isolation
  policies:
    - name: agency-read-own
      statements:
        - effect: Allow
          resources:
            - "arn:aws:s3:::raw/${aws:username}/*"
            - "arn:aws:s3:::bronze/${aws:username}/*"
            - "arn:aws:s3:::silver/${aws:username}/*"
            - "arn:aws:s3:::gold/${aws:username}/*"
          actions:
            - "s3:GetObject"
            - "s3:ListBucket"
    - name: data-pipeline-full
      statements:
        - effect: Allow
          resources:
            - "arn:aws:s3:::*"
          actions:
            - "s3:*"
    - name: spark-readwrite
      statements:
        - effect: Allow
          resources:
            - "arn:aws:s3:::raw/*"
            - "arn:aws:s3:::bronze/*"
            - "arn:aws:s3:::silver/*"
            - "arn:aws:s3:::gold/*"
            - "arn:aws:s3:::warehouse/*"
          actions:
            - "s3:GetObject"
            - "s3:PutObject"
            - "s3:DeleteObject"
            - "s3:ListBucket"
