# ============================================================
# Traefik v3 — Helm chart values (replaces K3s bundled Traefik)
# Chart:  https://traefik.github.io/charts  chart=traefik
# Namespace: kube-system
#
# Design:
#   • hostPort 80/443 → bind directly on node interface (single-node)
#   • IngressClass `traefik` — matches existing Ingress objects in cluster
#   • Both Ingress + IngressRoute (CRD) providers enabled
#   • Dashboard at port 9000 (internal only — port-forward to access)
#   • cert-manager handles TLS via HTTP-01 challenge on port 80
# ============================================================

# Use upstream Traefik v3 image
image:
  registry: docker.io
  repository: traefik
  tag: "v3.2.3"
  pullPolicy: IfNotPresent

# Single replica on single-node (hostPort binds to one node anyway)
deployment:
  replicas: 1
  kind: Deployment

# ── Ports ───────────────────────────────────────────────────────────
# hostPort = bind on host NIC directly (not via Service NodePort)
ports:
  web:
    port: 8000
    expose:
      default: true
    exposedPort: 80
    hostPort: 80            # bind host:80
    protocol: TCP
    redirectTo:
      port: websecure       # auto-redirect HTTP → HTTPS
      priority: 10
  websecure:
    port: 8443
    expose:
      default: true
    exposedPort: 443
    hostPort: 443           # bind host:443
    protocol: TCP
    tls:
      enabled: true
    http3:
      enabled: false        # disable QUIC/HTTP3 — not needed for now
  metrics:
    port: 9100
    expose:
      default: false
    exposedPort: 9100
    protocol: TCP
  traefik:
    port: 9000              # dashboard + API (internal only)
    expose:
      default: false
    exposedPort: 9000
    protocol: TCP

# ── Service (ClusterIP since hostPort handles external traffic) ────
service:
  enabled: true
  type: ClusterIP
  annotations: {}

# ── IngressClass ───────────────────────────────────────────────────
# Match name used by existing Ingress objects ("traefik")
ingressClass:
  enabled: true
  isDefaultClass: true
  name: traefik

# ── Providers ──────────────────────────────────────────────────────
providers:
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: true
    allowExternalNameServices: true
    allowEmptyServices: true
  kubernetesIngress:
    enabled: true
    allowExternalNameServices: true
    allowEmptyServices: true
    publishedService:
      enabled: true

# ── Dashboard & API ────────────────────────────────────────────────
api:
  dashboard: true
  insecure: true            # /dashboard accessible on entrypoint `traefik:9000`
                            # Internal only — not exposed externally

# ── Global options ─────────────────────────────────────────────────
globalArguments:
  - "--global.checknewversion=false"
  - "--global.sendanonymoususage=false"

additionalArguments:
  - "--log.level=INFO"
  - "--accesslog=true"
  - "--accesslog.format=json"
  - "--accesslog.fields.headers.defaultmode=keep"
  - "--serverstransport.insecureskipverify=false"

# ── Resources ──────────────────────────────────────────────────────
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# ── Security ───────────────────────────────────────────────────────
securityContext:
  capabilities:
    drop: [ALL]
    add: [NET_BIND_SERVICE]    # required for binding hostPort 80/443
  readOnlyRootFilesystem: true
  runAsGroup: 65532
  runAsNonRoot: true
  runAsUser: 65532

podSecurityContext:
  fsGroup: 65532

# ── Persistence (for ACME local store if used) ─────────────────────
persistence:
  enabled: false             # cert-manager handles TLS, not Traefik

# ── Node selector — single-node pin ────────────────────────────────
nodeSelector:
  kubernetes.io/os: linux

# ── Update strategy ────────────────────────────────────────────────
updateStrategy:
  type: Recreate             # hostPort = single pod, must release before new

# ── Metrics for future Prometheus integration ──────────────────────
metrics:
  prometheus:
    entryPoint: metrics
    addEntryPointsLabels: true
    addServicesLabels: true
    addRoutersLabels: true

# ── Health checks ──────────────────────────────────────────────────
ping:
  enabled: true
  entryPoint: traefik
livenessProbe:
  httpGet:
    path: /ping
    port: 9000
  initialDelaySeconds: 10
  periodSeconds: 10
readinessProbe:
  httpGet:
    path: /ping
    port: 9000
  initialDelaySeconds: 5
  periodSeconds: 5
