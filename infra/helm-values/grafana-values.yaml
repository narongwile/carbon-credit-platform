# ============================================================
# Grafana — official chart values
# Chart: https://grafana.github.io/helm-charts  chart=grafana
# Pre-existing secret: grafana-admin (admin-user, admin-password)
# Public URL: https://grafana.${DOMAIN}
# ============================================================
replicas: 1

image:
  tag: "11.4.0"

admin:
  existingSecret: grafana-admin
  userKey: admin-user
  passwordKey: admin-password

service:
  type: NodePort
  port: 80
  targetPort: 3000
  nodePort: 3000           # http://VPS_IP:3000  (requires K3s NodePort range 1024+)
  portName: http

persistence:
  enabled: true
  type: pvc
  storageClassName: local-path
  size: 10Gi
  accessModes: [ReadWriteOnce]

ingress:
  enabled: true
  ingressClassName: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
  hosts:
    - grafana.thermexpertise.com
  tls:
    - secretName: grafana-tls
      hosts:
        - grafana.thermexpertise.com

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

securityContext:
  runAsNonRoot: true
  runAsUser: 472
  fsGroup: 472

# ── Resources for init/sidecar containers ──────────────────
# The `monitoring` namespace has a ResourceQuota that requires every
# container (init + sidecar) to declare requests + limits. Without these
# the pod is rejected at admission with "failed quota: monitoring-quota".

# Init: chowns the PVC so grafana (uid 472) can write to it.
# We already set fsGroup=472 above; chart still runs this for safety.
initChownData:
  enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

# Init: pre-downloads any dashboards listed under `dashboards:` (gnetId).
downloadDashboards:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# Long-running sidecars: watch ConfigMaps cluster-wide and reload Grafana
# when one with the appropriate label appears. Shared resource block for
# both `sidecar.dashboards` and `sidecar.datasources`.
sidecar:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  dashboards:
    enabled: true
    label: grafana_dashboard
    searchNamespace: ALL
  datasources:
    enabled: true
    label: grafana_datasource
    searchNamespace: ALL

# Pre-wire MySQL + Prometheus datasources (Grafana auto-provisions)
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: MySQL
        type: mysql
        url: mysql.data.svc.cluster.local:3306
        database: carbon_credit
        user: app
        secureJsonData:
          password: $__file{/etc/secrets/mysql/mysql-password}
        jsonData:
          maxOpenConns: 25
          maxIdleConns: 25
          connMaxLifetime: 14400
      - name: Prometheus
        type: prometheus
        url: http://prometheus-server.monitoring.svc.cluster.local
        access: proxy
        isDefault: true

# Mount the pre-seeded MySQL secret so the datasource above can read it
extraSecretMounts:
  - name: mysql-credentials
    secretName: mysql-credentials
    defaultMode: 0440
    mountPath: /etc/secrets/mysql
    readOnly: true

# Default dashboards: pull from grafana.com IDs (k8s + node + mysql)
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default
dashboards:
  default:
    node-exporter:
      gnetId: 1860
      revision: 37
      datasource: Prometheus
    mysql-overview:
      gnetId: 7362
      revision: 5
      datasource: MySQL

# (sidecar block consolidated above — resources + dashboards + datasources)
