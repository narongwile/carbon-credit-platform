# ============================================================
# EMQX MQTT Broker — Helm Values (simplified for v5.4.1)
# Chart: emqx/emqx
# Namespace: data
# ============================================================

replicaCount: 1

image:
  repository: emqx/emqx
  tag: "5.5.1"

persistence:
  enabled: true
  size: 5Gi
  storageClassName: local-path

service:
  type: NodePort

emqxConfig:
  EMQX_LOG__CONSOLE_HANDLER__LEVEL: warning

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

# EMQX 5.x needs time to start on constrained nodes
emqxAclConfig: ""
startupProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 30
readinessProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 6
livenessProbe:
  enabled: true
  initialDelaySeconds: 60
  periodSeconds: 30
  failureThreshold: 5

# ── Companion resources ──
extraDeploy:
  # ACL ConfigMap
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: emqx-acl
      namespace: data
    data:
      acl.conf: |
        %% admin: full access
        {allow, {username, "admin"}, all, ["#"]}.
        %% device: scoped to own topics
        {allow, {username, "device"}, publish, [
            "devices/${clientid}/#",
            "sensors/${clientid}/#",
            "telemetry/${clientid}/#"
        ]}.
        {allow, {username, "device"}, subscribe, [
            "cmd/${clientid}/#",
            "config/${clientid}/#",
            "broadcast/#"
        ]}.
        %% default deny
        {deny, all}.

  # Dashboard Ingress
  - apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: emqx-dashboard
      namespace: data
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.tls: "true"
    spec:
      ingressClassName: traefik
      rules:
        - host: emqx.thermexpertise.com
          http:
            paths:
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: emqx
                    port:
                      number: 18083
      tls:
        - hosts: [emqx.thermexpertise.com]
          secretName: emqx-dashboard-tls
