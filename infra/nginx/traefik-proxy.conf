# ============================================================
# Nginx reverse-proxy → Traefik (K3s NodePort 32443 / 32080)
#
# Drop this file into /etc/nginx/sites-enabled/ on the VPS,
# then:  sudo nginx -t && sudo systemctl reload nginx
#
# This makes nginx forward HTTPS traffic for all platform
# subdomains to Traefik, which handles TLS via cert-manager.
# ============================================================

# ── Upstream: Traefik NodePort ──────────────────────────────
upstream traefik_https {
    server 127.0.0.1:32443;
}
upstream traefik_http {
    server 127.0.0.1:32080;
}

# ── HTTP → HTTPS redirect (all subdomains) ──────────────────
server {
    listen 80;
    server_name
        thermexpertise.com
        www.thermexpertise.com
        argocd.thermexpertise.com
        grafana.thermexpertise.com
        keycloak.thermexpertise.com
        wp.thermexpertise.com
        pma.thermexpertise.com
        nodered.thermexpertise.com
        emqx.thermexpertise.com;

    # Let ACME HTTP-01 challenges through to Traefik (cert-manager solver)
    location /.well-known/acme-challenge/ {
        proxy_pass http://traefik_http;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS pass-through to Traefik ───────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name
        thermexpertise.com
        www.thermexpertise.com
        argocd.thermexpertise.com
        grafana.thermexpertise.com
        keycloak.thermexpertise.com
        wp.thermexpertise.com
        pma.thermexpertise.com
        nodered.thermexpertise.com
        emqx.thermexpertise.com;

    # Use a self-signed or aaPanel cert for the nginx→browser leg.
    # Traefik handles the real Let's Encrypt cert for the backend.
    # If aaPanel already has a wildcard cert, use that:
    ssl_certificate     /etc/nginx/ssl/thermexpertise.com.pem;
    ssl_certificate_key /etc/nginx/ssl/thermexpertise.com.key;

    # If no cert exists yet, generate a temporary self-signed one:
    #   openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
    #     -keyout /etc/nginx/ssl/thermexpertise.com.key \
    #     -out /etc/nginx/ssl/thermexpertise.com.pem \
    #     -subj "/CN=*.thermexpertise.com"

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass https://traefik_https;
        proxy_ssl_verify off;             # Traefik uses its own cert
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;

        # WebSocket support (needed for Node-RED, EMQX WS, Grafana live)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }
}
