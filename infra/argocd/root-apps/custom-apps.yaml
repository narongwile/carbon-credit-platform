# ============================================================
# ArgoCD Application — Custom Apps (Kustomize)
# Deploys our custom-built services via Kustomize overlays
# ============================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: custom-apps-uat
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: carbon-credit-platform
    tier: root
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://gitlab.com/narongwile/carbon-credit-platform.git
    targetRevision: feature/deploy-ingest-worker
    path: infra/k8s/custom-apps/overlays/uat
  destination:
    server: https://kubernetes.default.svc
    namespace: app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: custom-apps-prod
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: carbon-credit-platform
    tier: root
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://gitlab.com/narongwile/carbon-credit-platform.git
    targetRevision: main
    path: infra/k8s/custom-apps/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: app
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
