# ============================================================
# ArgoCD App-of-Apps — Platform Stack (Helm)
# Auto-discovers all Helm-based ArgoCD Applications
# ============================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-stack
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: carbon-credit-platform
    tier: root
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://gitlab.com/narongwile/carbon-credit-platform.git
    targetRevision: main
    path: infra/argocd/platform-stack
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
