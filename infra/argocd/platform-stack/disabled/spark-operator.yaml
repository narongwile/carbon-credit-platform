# ============================================================
# ArgoCD Application — Spark Operator
# Helm Chart: spark-on-k8s-operator
# Namespace: data
# ============================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spark-operator
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: carbon-credit-platform
    tier: platform-stack
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    # Repo moved: googlecloudplatform → kubeflow (2024)
    - repoURL: https://kubeflow.github.io/spark-operator
      chart: spark-operator
      targetRevision: 2.1.0
      helm:
        valueFiles:
          - $values/infra/helm-values/spark-operator-values.yaml
    - repoURL: https://gitlab.com/narongwile/carbon-credit-platform.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
