# ============================================================
# ArgoCD Application — EMQX MQTT Broker
# Helm Chart: emqx/emqx
# Namespace: data
# ============================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: emqx
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: carbon-credit-platform
    tier: platform-stack
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://repos.emqx.io/charts
      chart: emqx
      targetRevision: 5.4.1
      helm:
        releaseName: emqx
        valueFiles:
          - $values/infra/helm-values/emqx-values.yaml
    - repoURL: https://gitlab.com/narongwile/carbon-credit-platform.git
      targetRevision: main
      ref: values
  # Same two controller-owned diffs the mysql and redpanda apps hit — the EMQX
  # chart ships both a StatefulSet and a PodDisruptionBudget:
  #   • the API server defaults apiVersion/kind onto each volumeClaimTemplates
  #     entry and serialises creationTimestamp: null, which the chart output does
  #     not contain (and a running StatefulSet's VCTs are immutable anyway);
  #   • a PDB's status tracks live pods, so it can never match a manifest.
  # With selfHeal on, neither is cosmetic: ArgoCD re-applies on every reconcile
  # and the app never settles, which hides real drift.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jqPathExpressions:
        - .spec.volumeClaimTemplates[]?.apiVersion
        - .spec.volumeClaimTemplates[]?.kind
        - .spec.volumeClaimTemplates[]?.metadata.creationTimestamp
    - group: policy
      kind: PodDisruptionBudget
      jsonPointers:
        - /status
  destination:
    server: https://kubernetes.default.svc
    namespace: data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
