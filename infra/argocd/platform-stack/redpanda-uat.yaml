apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redpanda-uat
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: carbon-credit-platform
    tier: platform-stack
spec:
  project: iiot
  source:
    repoURL: https://charts.redpanda.com
    chart: redpanda
    targetRevision: 5.8.11
    helm:
      releaseName: redpanda
      values: |
        # Minimal Redpanda deployment for UAT testing
        statefulset:
          replicas: 1
        resources:
          cpu:
            cores: 1
          memory:
            container:
              min: 512Mi
              max: 1Gi
        storage:
          persistentVolume:
            enabled: true
            size: 5Gi
            storageClass: local-path
        auth:
          sasl:
            enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-services
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
