apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redpanda-uat
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: carbon-credit-platform
    tier: platform-stack
spec:
  project: iiot
  source:
    repoURL: https://charts.redpanda.com
    chart: redpanda
    targetRevision: 5.8.11
    helm:
      releaseName: redpanda
      values: |
        # Minimal Redpanda deployment for UAT testing
        statefulset:
          replicas: 1
          # The chart's readinessProbe (`rpk cluster health`, an exec probe
          # that forks a process and hits the admin API) has no
          # timeoutSeconds field of its own in this chart version — it isn't
          # exposed under values.yaml at all, so it falls back to
          # Kubernetes' bare default of 1s regardless of what's set here.
          # On this VPS (seen at 82% CPU / 87% RAM) that 1s window is
          # genuinely too tight some of the time: the broker itself started
          # and stayed healthy (confirmed in the redpanda container's own
          # log — "Successfully started Redpanda!", still fine 10 minutes
          # later) while the probe still flapped NotReady. failureThreshold/
          # periodSeconds ARE real values.yaml fields, so this widens the
          # tolerance window (10 x 10s = 100s of consecutive slow/failed
          # checks) instead of flipping the pod NotReady on one bad tick —
          # without making a genuinely dead broker take forever to detect.
          readinessProbe:
            failureThreshold: 10
            periodSeconds: 10
        resources:
          cpu:
            cores: 1
          memory:
            container:
              min: 2Gi
              max: 2Gi
        storage:
          persistentVolume:
            enabled: true
            size: 5Gi
            storageClass: local-path
        auth:
          sasl:
            enabled: false
        tls:
          enabled: false
  # status on a PodDisruptionBudget is written by the disruption controller
  # (currentHealthy / disruptionsAllowed / expectedPods track live pods), so it
  # changes whenever a pod does and can never match a rendered manifest. Diffing
  # it kept the app OutOfSync permanently and, with selfHeal on, had ArgoCD
  # re-applying a subresource it does not own.
  ignoreDifferences:
    - group: policy
      kind: PodDisruptionBudget
      jsonPointers:
        - /status
  destination:
    server: https://kubernetes.default.svc
    namespace: iiot-uat
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
