apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redpanda-uat
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: carbon-credit-platform
    tier: platform-stack
spec:
  project: iiot
  source:
    repoURL: https://charts.redpanda.com
    chart: redpanda
    targetRevision: 5.8.11
    helm:
      releaseName: redpanda
      values: |
        # Minimal Redpanda deployment for UAT testing
        statefulset:
          replicas: 1
        resources:
          cpu:
            cores: 1
          memory:
            container:
              min: 2Gi
              max: 2Gi
        storage:
          persistentVolume:
            enabled: true
            size: 5Gi
            storageClass: local-path
        auth:
          sasl:
            enabled: false
        tls:
          enabled: false
  # status on a PodDisruptionBudget is written by the disruption controller
  # (currentHealthy / disruptionsAllowed / expectedPods track live pods), so it
  # changes whenever a pod does and can never match a rendered manifest. Diffing
  # it kept the app OutOfSync permanently and, with selfHeal on, had ArgoCD
  # re-applying a subresource it does not own.
  ignoreDifferences:
    - group: policy
      kind: PodDisruptionBudget
      jsonPointers:
        - /status
  destination:
    server: https://kubernetes.default.svc
    namespace: iiot-uat
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
