# ============================================================
# ArgoCD Application — MySQL (Bitnami chart)
# Namespace: data         Internal port: 3306
# Secret used: data/mysql-credentials  (seeded by deploy-bootstrap.sh)
# Sync wave -10 → MySQL must be Ready before phpMyAdmin syncs.
# ============================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mysql
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: carbon-credit-platform
    tier: platform-stack
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: registry-1.docker.io/bitnamicharts
      chart: mysql
      targetRevision: "*"    # latest — old versions reference deleted Docker Hub tags
      helm:
        releaseName: mysql
        valueFiles:
          - $values/infra/helm-values/mysql-values.yaml
    - repoURL: https://gitlab.com/narongwile/carbon-credit-platform.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
