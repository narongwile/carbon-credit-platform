# ============================================================
# Thermexpertise single-node gateway template
# Replace the placeholder hostnames and secret names before applying.
# Public web apps go through HTTPS. Admin surfaces stay behind auth and
# source-IP allowlists. Raw database access stays private.
# ============================================================
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: app
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    stsPreload: true
    forceSTSHeader: true
    contentTypeNosniff: true
    frameDeny: true
    browserXssFilter: true
    referrerPolicy: strict-origin-when-cross-origin

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: admin-ip-allowlist
  namespace: carbon-credit
spec:
  ipAllowList:
    sourceRange:
      - 0.0.0.0/0

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: admin-ip-allowlist
  namespace: monitoring
spec:
  ipAllowList:
    sourceRange:
      - 0.0.0.0/0

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: admin-ip-allowlist
  namespace: data
spec:
  ipAllowList:
    sourceRange:
      - 0.0.0.0/0

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: admin-ip-allowlist
  namespace: app
spec:
  ipAllowList:
    sourceRange:
      - 0.0.0.0/0

---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-thermexpertise
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ops@thermexpertise.com
    privateKeySecretRef:
      name: letsencrypt-thermexpertise-account-key
    solvers:
      - http01:
          ingress:
            class: traefik

# ==========================================
# Namespace: app (Frontend & Backend)
# ==========================================
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: thermexpertise-tls-app
  namespace: app
spec:
  secretName: thermexpertise-tls-app
  issuerRef:
    name: letsencrypt-thermexpertise
    kind: ClusterIssuer
  dnsNames:
    - thermexpertise.com
    - www.thermexpertise.com
    - api.thermexpertise.com

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: frontend-web
  namespace: app
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`thermexpertise.com`) || Host(`www.thermexpertise.com`)
      kind: Rule
      middlewares:
        - name: security-headers
      services:
        - name: frontend-web
          port: 80
  tls:
    secretName: thermexpertise-tls-app

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: backend-api
  namespace: app
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`api.thermexpertise.com`)
      kind: Rule
      middlewares:
        - name: security-headers
      services:
        - name: backend-api
          port: 3000
  tls:
    secretName: thermexpertise-tls-app

# ==========================================
# Namespace: monitoring (Grafana)
# ==========================================
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: thermexpertise-tls-monitoring
  namespace: monitoring
spec:
  secretName: thermexpertise-tls-monitoring
  issuerRef:
    name: letsencrypt-thermexpertise
    kind: ClusterIssuer
  dnsNames:
    - grafana.thermexpertise.com

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-admin
  namespace: monitoring
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-thermexpertise
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    # We can add the middleware back later if needed, leaving it off for testing
spec:
  tls:
    - hosts:
        - grafana.thermexpertise.com
      secretName: thermexpertise-tls-monitoring
  rules:
    - host: grafana.thermexpertise.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: monitoring-stack-grafana
                port:
                  number: 80

# ==========================================
# Namespace: carbon-credit (Node-RED, phpMyAdmin)
# ==========================================
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: thermexpertise-tls-carbon
  namespace: carbon-credit
spec:
  secretName: thermexpertise-tls-carbon
  issuerRef:
    name: letsencrypt-thermexpertise
    kind: ClusterIssuer
  dnsNames:
    - nodered.thermexpertise.com
    - phpmyadmin.thermexpertise.com

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: node-red-admin
  namespace: carbon-credit
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`nodered.thermexpertise.com`)
      kind: Rule
      middlewares:
        - name: admin-ip-allowlist
      services:
        - name: node-red
          port: 1880
  tls:
    secretName: thermexpertise-tls-carbon

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: phpmyadmin-admin
  namespace: carbon-credit
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`phpmyadmin.thermexpertise.com`)
      kind: Rule
      middlewares:
        - name: admin-ip-allowlist
      services:
        - name: phpmyadmin
          port: 80
  tls:
    secretName: thermexpertise-tls-carbon

# ==========================================
# Namespace: data (EMQX)
# ==========================================
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: thermexpertise-tls-data
  namespace: data
spec:
  secretName: thermexpertise-tls-data
  issuerRef:
    name: letsencrypt-thermexpertise
    kind: ClusterIssuer
  dnsNames:
    - emqx.thermexpertise.com

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: emqx-admin
  namespace: data
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`emqx.thermexpertise.com`)
      kind: Rule
      middlewares:
        - name: admin-ip-allowlist
      services:
        - name: emqx
          port: 18083
  tls:
    secretName: thermexpertise-tls-data

# ==========================================
# HTTP (port 80) by node primary IPv4 — {{NODE_PRIMARY_IP}} is substituted by deploy-all.sh
# LetsEncrypt HTTP-01 is unaffected (solver uses its own Ingress rules / paths).
# ==========================================
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-api-prefix
  namespace: app
spec:
  stripPrefix:
    prefixes:
      - /api

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: backend-api-http-node-ip
  namespace: app
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      priority: 20
      match: Host(`{{NODE_PRIMARY_IP}}`) && PathPrefix(`/api`)
      middlewares:
        - name: strip-api-prefix
      services:
        - name: backend-api
          port: 3000

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: frontend-web-http-node-ip
  namespace: app
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      priority: 10
      match: Host(`{{NODE_PRIMARY_IP}}`)
      services:
        - name: frontend-web
          port: 80
