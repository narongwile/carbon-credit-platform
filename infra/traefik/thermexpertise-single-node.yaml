# ==========================================
# HTTP by public IPv4 (Host header = x.x.x.x) — no sed/deploy substitution required.
# ==========================================
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-api-prefix
  namespace: app
spec:
  stripPrefix:
    prefixes:
      - /api

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: backend-api-http-node-ip
  namespace: app
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      priority: 20
      match: HostRegexp(`^[0-9]{1,3}(\.[0-9]{1,3}){3}$`) && PathPrefix(`/api`) && !PathPrefix(`/.well-known/acme-challenge`)
      middlewares:
        - name: strip-api-prefix
      services:
        - name: backend-api
          port: 3000

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: frontend-web-http-node-ip
  namespace: app
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      priority: 10
      match: HostRegexp(`^[0-9]{1,3}(\.[0-9]{1,3}){3}$`) && !PathPrefix(`/.well-known/acme-challenge`)
      services:
        - name: frontend-web
          port: 80
