metadata:
  name: thermexpertise-tls-monitoring
  namespace: monitoring
spec:
  secretName: thermexpertise-tls-monitoring
  issuerRef:
    name: letsencrypt-thermexpertise
    kind: ClusterIssuer
  dnsNames:
    - grafana.thermexpertise.com

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`grafana.thermexpertise.com`)
      kind: Rule
      services:
        - name: monitoring-stack-grafana
          port: 80
  tls:
    secretName: thermexpertise-tls-monitoring

---
apiVersion: traefik.io/v1alpha1
