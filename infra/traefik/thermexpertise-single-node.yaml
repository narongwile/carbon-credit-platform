# ============================================================
# Thermexpertise single-node gateway template
# Replace the placeholder hostnames and secret names before applying.
# Public web apps go through HTTPS. Admin surfaces stay behind auth and
# source-IP allowlists. Raw database access stays private.
# ============================================================
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: app
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    stsPreload: true
    forceSTSHeader: true
    contentTypeNosniff: true
    frameDeny: true
    browserXssFilter: true
    referrerPolicy: strict-origin-when-cross-origin

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: admin-ip-allowlist
  namespace: carbon-credit
spec:
  ipAllowList:
    sourceRange:
      - 0.0.0.0/0

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: admin-ip-allowlist
  namespace: monitoring
spec:
  ipAllowList:
    sourceRange:
      - 0.0.0.0/0

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: admin-ip-allowlist
  namespace: data
spec:
  ipAllowList:
    sourceRange:
      - 0.0.0.0/0

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: admin-ip-allowlist
  namespace: app
spec:
  ipAllowList:
    sourceRange:
      - 0.0.0.0/0

---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-thermexpertise
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ops@thermexpertise.com
    privateKeySecretRef:
      name: letsencrypt-thermexpertise-account-key
    solvers:
      - http01:
          ingress:
            class: traefik
            ingressTemplate:
              metadata:
                annotations:
                  traefik.ingress.kubernetes.io/router.entrypoints: web

# ==========================================
# Namespace: app (Frontend & Backend)
# ==========================================
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: thermexpertise-tls-app
  namespace: app
spec:
  secretName: thermexpertise-tls-app
  issuerRef:
    name: letsencrypt-thermexpertise
    kind: ClusterIssuer
  dnsNames:
    - thermexpertise.com
    - www.thermexpertise.com
    - api.thermexpertise.com

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: frontend-web
  namespace: app
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`thermexpertise.com`) || Host(`www.thermexpertise.com`)
      kind: Rule
      middlewares:
        - name: security-headers
      services:
        - name: frontend-web
          port: 80
  tls:
    secretName: thermexpertise-tls-app

# HTTP :80 — same Hosts as HTTPS (Traefik default 404 on web if no routers here).
# Exclude ACME HTTP-01 so cert-manager solver paths are not sent to app backends.
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: frontend-web-http
  namespace: app
spec:
  entryPoints:
    - web
  routes:
    - match: (Host(`thermexpertise.com`) || Host(`www.thermexpertise.com`)) && !PathPrefix(`/.well-known/acme-challenge`)
      kind: Rule
      services:
        - name: frontend-web
          port: 80

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: backend-api
  namespace: app
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`api.thermexpertise.com`)
      kind: Rule
      middlewares:
        - name: security-headers
      services:
        - name: backend-api
          port: 3000
  tls:
    secretName: thermexpertise-tls-app

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: backend-api-http
  namespace: app
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`api.thermexpertise.com`) && !PathPrefix(`/.well-known/acme-challenge`)
      kind: Rule
      services:
        - name: backend-api
          port: 3000

# ==========================================
# Namespace: monitoring (Grafana)
# ==========================================
---
apiVersion: cert-manager.io/v1
