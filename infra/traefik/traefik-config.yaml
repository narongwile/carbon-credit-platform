# ============================================================
# Traefik IngressRoute — TLS Configuration
# Deploy: kubectl apply -f traefik-config.yaml
# ============================================================
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: app
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    stsPreload: true
    forceSTSHeader: true
    contentTypeNosniff: true
    frameDeny: true
    browserXssFilter: true
    customResponseHeaders:
      X-Content-Type-Options: nosniff
      X-Frame-Options: DENY
      X-XSS-Protection: "1; mode=block"
      Referrer-Policy: strict-origin-when-cross-origin

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit
  namespace: app
spec:
  rateLimit:
    average: 100
    burst: 200
    period: 1m

# ============================================================
# TLS Certificate (Let's Encrypt)
# ============================================================
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@carbon-credit.go.th
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
      - http01:
          ingress:
            class: traefik

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: carbon-credit-tls
  namespace: app
spec:
  secretName: carbon-credit-tls-secret
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - "app.${DOMAIN}"
    - "api.${DOMAIN}"
    - "auth.${DOMAIN}"
    - "bi.${DOMAIN}"
    - "grafana.${DOMAIN}"
    - "monitor.${DOMAIN}"
    - "git.${DOMAIN}"
    - "ci.${DOMAIN}"
    - "airflow.${DOMAIN}"
    - "reports.${DOMAIN}"

# ============================================================
# IngressRoute — Backend API
# ============================================================
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: backend-api
  namespace: app
spec:
  entryPoints:
    - websecure
  routes:
    - match: "Host(`api.${DOMAIN}`)"
      kind: Rule
      services:
        - name: backend-api
          port: 3000
      middlewares:
        - name: security-headers
        - name: rate-limit
  tls:
    secretName: carbon-credit-tls-secret

# ============================================================
# IngressRoute — Frontend Web
