name: Deploy Frontend to GitHub Pages (Branch Method)

on:
  push:
    branches: ["main"]
    # ทริกเกอร์เฉพาะเมื่อมีการแก้ไขไฟล์ในโฟลเดอร์ frontend
    paths:
      - 'frontend/**'
  workflow_dispatch:

# ให้สิทธิ์ GitHub Actions ในการเขียน (Write) ข้อมูลลงใน Branch ของ Repo นี้
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build project
        working-directory: ./frontend
        run: npm run build

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist
