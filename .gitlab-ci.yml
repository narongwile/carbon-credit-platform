image: node:20

stages:
  - sync
  - test
  - build
  - deploy

# ── GitHub → GitLab source sync ────────────────────────────────────────────────
# The app source lives in GitHub (src/); the deployable copy is GitLab
# frontend-next/src/. A GitHub push does NOT reach GitLab, so this job pulls the
# latest GitHub frontend and commits it into frontend-next/, whose push then
# triggers build_frontend_next → write-back → ArgoCD roll.
#
# TRIGGER: a GitLab *Pipeline Schedule* (CI/CD > Schedules) on
# feature/deploy-ingest-worker — a CI job cannot fire itself and GitHub pushes are
# invisible to GitLab, so polling on a schedule is what makes this survive. Also
# runnable manually via "Run pipeline". Requires CI/CD variables:
#   GITHUB_TOKEN     — read-only PAT (repo/contents:read) for the private GitHub repo
#   WRITEBACK_TOKEN  — GitLab PAT (write_repository), already used by the deploy jobs
# The sync commit carries NO [skip ci] on purpose: its push IS the build trigger.
sync_frontend_from_github:
  stage: sync
  image:
    name: alpine/git:latest
    entrypoint: [""]
  variables:
    GIT_STRATEGY: none          # we clone both repos ourselves with tokens
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
  before_script:
    - test -n "$GITHUB_TOKEN"    || { echo "GITHUB_TOKEN not set — cannot read GitHub";  exit 1; }
    - test -n "$WRITEBACK_TOKEN" || { echo "WRITEBACK_TOKEN not set — cannot push GitLab"; exit 1; }
  script:
    - git clone --depth 1 --branch claude/unified-platform-ui-design-04HMA "https://x-access-token:${GITHUB_TOKEN}@github.com/narongwile/carbon-credit-platform.git" gh
    - git clone --depth 1 --branch feature/deploy-ingest-worker "https://writeback:${WRITEBACK_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" gl
    # Sync ONLY the app source subtree. frontend-next's deployment files
    # (Dockerfile, nginx.conf, next.config.js, package.json) are deployment-specific
    # and intentionally left untouched — bump those by hand when deps/config change.
    - rm -rf gl/frontend-next/src
    - cp -r gh/src gl/frontend-next/src
    - cd gl
    - git config user.email "ci-bot@thermexpertise.com"
    - git config user.name  "GitLab CI (gh-sync)"
    - git add frontend-next/src
    - if git diff --cached --quiet; then echo "frontend-next/src already in sync with GitHub — nothing to do"; exit 0; fi
    - 'git commit -m "sync(frontend): pull src/ from GitHub claude/unified-platform-ui-design-04HMA"'
    - |
      for i in 1 2 3 4 5; do
        git pull --rebase origin feature/deploy-ingest-worker || true
        if git push origin HEAD:feature/deploy-ingest-worker; then break; fi
        sleep 2
      done

# ── Vite app (parked) → GitLab Pages, unchanged ──
pages:
  stage: deploy
  script:
    - npm ci
    - npm run build
    # GitLab Pages requires the exported artifacts folder to be exactly named "public"
    - rm -rf public
    - mv dist public
    # Fix 404 routing for SPA (React Router) on GitLab Pages
    - cp public/index.html public/404.html
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ── Automated Quality & Verification Gates ──────────────────────────────────
test_proofs_and_integrity:
  stage: test
  image: node:20-alpine
  script:
    - node backend/node-red/generate-nodered-backend.mjs
    - node e2e/proofs/test-emailguard.mjs
    - node e2e/proofs/test-riskmap.mjs
    - node e2e/proofs/test-report-honesty.mjs
    - node e2e/proofs/test-rate-of-rise.mjs
    - node e2e/proofs/verify-pearson.mjs
    - node e2e/proofs/test-real-device-fieldnames.mjs
    - node e2e/proofs/test-alarm-param-discovery.mjs
    - node e2e/proofs/test-edge-alarm-surfaces.mjs
    # A parameter is named for what it measures, not for one of its alarm bands.
    - node e2e/proofs/test-schema-label-bands.mjs
    # tempHigh/tempLow mean physically different things on carbonNode (fridge)
    # vs bloodBox (blood cold-chain) — a bare-key insight lookup must not let
    # one domain's wording leak onto the other's alarm.
    - node e2e/proofs/test-alarm-insight-domain-scoping.mjs
    # Security controls: the EMQX ACL patterns must match every real fleet
    # topic and deny impersonation / cross-tenant reads.
    - node e2e/proofs/test-mqtt-acl.mjs
    # Fails if an auto-armed alarm ever again names a key the fleet does not
    # publish, or if a published parameter becomes unreachable by any rule.
    - node e2e/proofs/audit-catalog-vs-device.mjs
    # SensorDetailsModal's ISA-101 range bar must grow toward danger for a
    # 'low'-direction param (lower is worse) the same as a 'high'-direction
    # one — it was doing the opposite, showing a critical reading emptier
    # than a healthy one.
    - node e2e/proofs/test-range-bar-direction.mjs
    # The alarm editor's no-data fallback row set must name CATALOG keys
    # ('oilTemp'), not the telemetry payload names realtime.ts maps them to
    # ('oilTemperature'). It named the payload ones, so both temperature
    # alarms silently dropped out of the editor on any device with no
    # display-params and no telemetry yet.
    - node e2e/proofs/test-default-transformer-keys.mjs
    # Alarm DELIVERY. Both of these existed in the repo but were never wired
    # into CI, and both caught real regressions only once someone ran them by
    # hand: notify-routing had 4 failing assertions (a dropped CORS_ORIGIN
    # fallback plus its own stale expected-link), and the org-channel loop had
    # its Telegram `await fetch(...)` deleted outright — org-level Telegram
    # alarms silently stopped sending, with no error anywhere. Delivery is the
    # last mile of an alarm system; a silent failure here means an operator
    # never hears about a fault.
    - node backend/node-red/notify-routing.test.mjs
    - node backend/node-red/notify-org-channels.test.mjs
    # Node-RED handler bodies are template STRINGS — eslint and tsc never see
    # them, so they are the only code here with no static analysis at all. This
    # parses every one and fails on unused variables, which is the fingerprint
    # left behind when the statement that consumed them gets deleted (exactly
    # how the org-level Telegram send was lost: `tok`/`chat` computed, the
    # `await fetch` gone). Verified to fail on that specific regression.
    - node backend/node-red/handler-deadcode.test.mjs
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# The alarm engine that actually runs against live MQTT is Go, and its
# behaviour has to keep agreeing with the Node-RED one proved above — these
# are the same scenarios translated, so a drift between the two engines fails
# here rather than in the field.
test_worker_proofs:
  stage: test
  image: golang:1.22-alpine
  script:
    # worker/ carries its own go.mod, so vet has to run from inside it —
    # `go vet ./worker/...` from the repo root fails with "directory prefix
    # worker does not contain main module".
    - (cd worker && go vet ./...)
    # The proofs are standalone stdlib-only mains and run from the root.
    - go run e2e/proofs/go-rate-of-rise-proof.go
    - go run e2e/proofs/go-alarm-state-proof.go
    # Personal (per-user) alarm thresholds: independent dwell/hysteresis state
    # per (user, node, param), never leaking into or clobbered by the shared
    # org-wide state the admin/everyone sees.
    - go run e2e/proofs/go-personal-alarm-state-proof.go
    - go run e2e/proofs/go-fieldnames-proof.go
    # Payload-vs-topic identity, and duplicate-device detection via uptime.
    - go run e2e/proofs/go-identity-proof.go
    # The MAC-suffix relaxation of that identity check must not become a way for
    # one device to publish as another. The EMQX ACL pins publishes to
    # ${clientid}, so the TOPIC id is broker-authorised and the payload id is
    # not; the org is resolved from whichever id survives, so a bad rewrite here
    # is a cross-tenant write. Verified to fail on the unguarded version.
    - go run e2e/proofs/go-mac-identity-proof.go
    # Device clock sanity: a bad timestamp must not silently vanish a reading
    # into 1970 (retention then deletes it) nor permanently kill rate-of-rise.
    - go run e2e/proofs/go-clock-proof.go
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

test_frontend_lint:
  stage: test
  image: node:20-alpine
  script:
    - cd frontend-next
    - npm ci
    - npm run lint
    # A type error never reaches `next lint` — it surfaces only at build or
    # here, and the build job runs in a later stage behind a Docker-in-Docker
    # service, so this is the cheapest place to catch it.
    - npx tsc --noEmit
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        - frontend-next/**/*
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ── Next.js production frontend (frontend-next/) → GitLab Container Registry ──
# Builds the static-export image and pushes it to this project's GitLab registry
# ($CI_REGISTRY_IMAGE/frontend-next). Runs on GitLab.com SHARED runners (no tags),
# which auto-authenticate to the registry via the predefined CI_REGISTRY_* vars.
build_frontend_next:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    IMAGE: $CI_REGISTRY_IMAGE/frontend-next
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - cd frontend-next
    # Same-origin build: nginx in the pod reverse-proxies /api,/ws to Node-RED.
    - docker build
        --build-arg NEXT_PUBLIC_API_URL="relative"
        --build-arg NEXT_PUBLIC_WS_URL="relative"
        -t "$IMAGE:latest" -t "$IMAGE:$CI_COMMIT_SHORT_SHA" .
    - docker push "$IMAGE:latest"
    - docker push "$IMAGE:$CI_COMMIT_SHORT_SHA"
    # Marker for deploy_images: this component really was built and pushed
    # at this tag, so the write-back may pin it. A component whose build was
    # filtered out leaves no marker and keeps the tag it already had.
    #
    # $CI_PROJECT_DIR, NOT a bare path: `script` has already cd'd into the
    # component directory, so "mkdir .deploy" wrote frontend-next/.deploy/ while
    # artifacts:paths resolves from the project root. The artifact came out
    # EMPTY, deploy_images found no markers, printed "nothing to pin" and exited
    # GREEN — so four commits in a row built images that nothing ever pinned and
    # the cluster stayed on an older frontend.
    - mkdir -p "$CI_PROJECT_DIR/.deploy" && echo "$CI_COMMIT_SHORT_SHA" > "$CI_PROJECT_DIR/.deploy/frontend-next"
  artifacts:
    paths:
      - .deploy/
    expire_in: 1 day
  rules:
    # Scheduled pipelines run sync only — the sync commit (source=push) rebuilds.
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - frontend-next/**/*
    # Allow building from the integration branch too (so the first image exists).
    - if: $CI_COMMIT_BRANCH == "claude/frontend-next-deploy"
    - if: $CI_COMMIT_BRANCH == "feature/deploy-ingest-worker"
      changes:
        - frontend-next/**/*

build_ingest_worker:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    IMAGE: $CI_REGISTRY_IMAGE/ingest-worker
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - cd worker
    - docker build -t "$IMAGE:latest" -t "$IMAGE:$CI_COMMIT_SHORT_SHA" .
    - docker push "$IMAGE:latest"
    - docker push "$IMAGE:$CI_COMMIT_SHORT_SHA"
    # Marker for deploy_images: this component really was built and pushed
    # at this tag, so the write-back may pin it. A component whose build was
    # filtered out leaves no marker and keeps the tag it already had.
    #
    # $CI_PROJECT_DIR, NOT a bare path: `script` has already cd'd into the
    # component directory, so "mkdir .deploy" wrote ingest-worker/.deploy/ while
    # artifacts:paths resolves from the project root. The artifact came out
    # EMPTY, deploy_images found no markers, printed "nothing to pin" and exited
    # GREEN — so four commits in a row built images that nothing ever pinned and
    # the cluster stayed on an older frontend.
    - mkdir -p "$CI_PROJECT_DIR/.deploy" && echo "$CI_COMMIT_SHORT_SHA" > "$CI_PROJECT_DIR/.deploy/ingest-worker"
  artifacts:
    paths:
      - .deploy/
    expire_in: 1 day
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - worker/**/*
    - if: $CI_COMMIT_BRANCH == "feature/deploy-ingest-worker"
      changes:
        - worker/**/*

# DB-per-tenant migration service — node dist/migrate.js --serve. Built from the
# legacy Express backend/ tree because dist/migrate.js and backend/sql/*.sql
# live there; the k8s manifest overrides CMD so the rest of that tree (Express
# routes, MQTT, ws) never runs. See migrate-service.yaml for the HTTP contract
# this answers and why it exists.
build_migrate_service:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    IMAGE: $CI_REGISTRY_IMAGE/migrate-service
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - cd backend
    - docker build -t "$IMAGE:latest" -t "$IMAGE:$CI_COMMIT_SHORT_SHA" .
    - docker push "$IMAGE:latest"
    - docker push "$IMAGE:$CI_COMMIT_SHORT_SHA"
    # Marker for deploy_images: this component really was built and pushed
    # at this tag, so the write-back may pin it. A component whose build was
    # filtered out leaves no marker and keeps the tag it already had.
    #
    # $CI_PROJECT_DIR, NOT a bare path: `script` has already cd'd into the
    # component directory, so "mkdir .deploy" wrote migrate-service/.deploy/ while
    # artifacts:paths resolves from the project root. The artifact came out
    # EMPTY, deploy_images found no markers, printed "nothing to pin" and exited
    # GREEN — so four commits in a row built images that nothing ever pinned and
    # the cluster stayed on an older frontend.
    - mkdir -p "$CI_PROJECT_DIR/.deploy" && echo "$CI_COMMIT_SHORT_SHA" > "$CI_PROJECT_DIR/.deploy/migrate-service"
  artifacts:
    paths:
      - .deploy/
    expire_in: 1 day
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - backend/**/*
    - if: $CI_COMMIT_BRANCH == "feature/deploy-ingest-worker"
      changes:
        - backend/**/*

# ── GitOps write-back: pin the freshly-built image tags into the manifests ────
# ArgoCD reconciles the git MANIFEST against the cluster. A floating `:latest` tag
# never changes the manifest, so a new build is invisible to ArgoCD and never rolls
# out. This job rewrites each Deployment image to the immutable
# `:$CI_COMMIT_SHORT_SHA` tag that build_* just pushed and commits it back to this
# branch — a real git diff that ArgoCD (custom-apps-uat, automated sync) rolls out
# on its own.
#
# ONE job, ONE commit — deliberately. This used to be three jobs, each `needs:`-ing
# only its own build, so each pushed its own commit the moment that build finished.
# The frontend is a docker-in-docker Next.js build and is always the slowest, so
# its write-back landed 60-115 s AFTER the other two on every single pipeline:
#
#   03:12:42  ci(deploy):migrate-service -> efbace69   <-- frontend still at the OLD tag
#   03:12:50  ci(deploy):ingest-worker   -> efbace69   <-- frontend still at the OLD tag
#   03:14:34  ci(deploy):frontend-next   -> efbace69
#
# ArgoCD picked up one of the first two commits and synced it — pinning the
# PREVIOUS frontend image — and a minute later the third commit arrived, leaving
# the app OutOfSync on exactly one field: the frontend image. A second sync could
# not start while the first was still running its mysql-auto-migrate Sync hook,
# which is why the only way out was Terminate + re-sync, every single pipeline.
#
# Waiting for all three builds costs the worker and migrate-service rollouts the
# ~100 s the frontend build takes. That is the price of every commit on this
# branch describing a cluster state that actually exists.
#
# Requires CI/CD variable  WRITEBACK_TOKEN  (Settings > CI/CD > Variables, masked):
#   a Project Access Token with scope `write_repository`, role Developer
#   (Maintainer if the target branch is protected).
# The write-back commit carries [skip ci] so it never re-triggers a pipeline — on
# this branch the build jobs have no `changes:` filter, so without [skip ci] the
# push-back would loop forever.
deploy_images:
  stage: deploy
  image:
    name: alpine/git:latest
    entrypoint: [""]
  variables:
    GIT_STRATEGY: none          # we clone the branch ourselves with the write token
  # optional: on main the build jobs are `changes:`-filtered, so some may not be in
  # the pipeline at all. A job that IS present and FAILS still blocks this one —
  # a half-pinned commit would deploy one new image beside two stale ones.
  needs:
    - job: build_frontend_next
      optional: true
      artifacts: true
    - job: build_ingest_worker
      optional: true
      artifacts: true
    - job: build_migrate_service
      optional: true
      artifacts: true
  before_script:
    - test -n "$WRITEBACK_TOKEN" || { echo "WRITEBACK_TOKEN CI/CD variable not set — cannot push tag back"; exit 1; }
    - git clone --depth 1 --branch "$CI_COMMIT_BRANCH" "https://writeback:${WRITEBACK_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" repo
    - cd repo
    - git config user.email "ci-bot@thermexpertise.com"
    - git config user.name  "GitLab CI (deploy)"
  script:
    # Artifacts land in the job workspace; the clone is the `repo` subdirectory.
    - MARKERS="$CI_PROJECT_DIR/.deploy"
    # FAIL, do not shrug. This job only runs when at least one build job ran, so
    # an empty marker directory means the artifact never arrived — which is a
    # broken pipeline, not "nothing to deploy". Exiting 0 here is precisely how
    # four releases went out with the manifest still pinned to an older image
    # while every pipeline showed green.
    - 'test -d "$MARKERS" || { echo "FATAL - no build markers in $MARKERS; a build job ran but its artifact did not arrive"; exit 1; }'
    - 'test -n "$(ls -A "$MARKERS" 2>/dev/null)" || { echo "FATAL - build marker directory is empty; nothing was pinned"; exit 1; }'
    - CHANGED=""
    - |
      # pin <component> <manifest...> — only for a component this pipeline
      # actually built. Pinning a tag nobody pushed is an ImagePullBackOff.
      pin() {
        comp="$1"; shift
        [ -f "$MARKERS/$comp" ] || { echo "skip $comp — not built in this pipeline"; return 0; }
        tag=$(cat "$MARKERS/$comp")
        for f in "$@"; do
          sed -i "s|\(image: registry.gitlab.com/.*/${comp}:\).*|\1${tag}|" "$f"
          git add "$f"
        done
        CHANGED="${CHANGED} $comp"
        echo "pinned $comp -> $tag"
      }
      pin frontend-next   infra/k8s/custom-apps/base/frontend-next.yaml
      pin ingest-worker   infra/k8s/custom-apps/base/ingest-worker.yaml
      # migrate-service appears TWICE: the long-running provisioning Deployment
      # and the deploy-time migration Job, which runs the same image so the Job
      # and the service can never disagree about the schema. Miss the Job and it
      # migrates with the PREVIOUS release's sql/ — the exact drift the Job is
      # there to prevent.
      pin migrate-service infra/k8s/custom-apps/base/migrate-service.yaml \
                          infra/k8s/custom-apps/overlays/uat/mysql-migrate-job.yaml
    - if git diff --cached --quiet; then echo "every image tag is already at ${CI_COMMIT_SHORT_SHA}"; exit 0; fi
    - git commit -m "ci(deploy):${CHANGED# } -> ${CI_COMMIT_SHORT_SHA} [skip ci]"
    - |
      for i in 1 2 3 4 5; do
        git pull --rebase origin "${CI_COMMIT_BRANCH}" || true
        if git push origin "HEAD:${CI_COMMIT_BRANCH}"; then break; fi
        sleep 2
      done
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - frontend-next/**/*
        - worker/**/*
        - backend/**/*
    - if: $CI_COMMIT_BRANCH == "feature/deploy-ingest-worker"
      changes:
        - frontend-next/**/*
        - worker/**/*
        - backend/**/*
