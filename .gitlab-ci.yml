image: node:20

stages:
  - build
  - deploy

# ── Vite app (parked) → GitLab Pages, unchanged ──
pages:
  stage: deploy
  script:
    - npm ci
    - npm run build
    # GitLab Pages requires the exported artifacts folder to be exactly named "public"
    - rm -rf public
    - mv dist public
    # Fix 404 routing for SPA (React Router) on GitLab Pages
    - cp public/index.html public/404.html
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ── Next.js production frontend (frontend-next/) → in-cluster registry ──
# Builds the static-export image and pushes it to the registry ArgoCD pulls from.
# NOTE: registry.ci.svc.cluster.local is in-cluster DNS — this job must run on a
# runner that can reach it (a self-hosted runner inside the cluster). Edit/remove
# the `tags:` to match your runner setup.
build_frontend_next:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    IMAGE: registry.ci.svc.cluster.local/iiotplatform/frontend-next
  tags:
    - cluster            # self-hosted in-cluster runner (edit/remove to match your setup)
  before_script:
    # If the in-cluster registry needs auth, set CI/CD variables and uncomment:
    # - echo "$REGISTRY_PASSWORD" | docker login registry.ci.svc.cluster.local -u "$REGISTRY_USER" --password-stdin
    - docker info >/dev/null
  script:
    - cd frontend-next
    # Same-origin build: nginx in the pod reverse-proxies /api,/ws to Node-RED.
    - docker build
        --build-arg NEXT_PUBLIC_API_URL=https://iiotplatform.thermexpertise.com
        --build-arg NEXT_PUBLIC_WS_URL=wss://iiotplatform.thermexpertise.com/ws/telemetry
        -t "$IMAGE:latest" -t "$IMAGE:$CI_COMMIT_SHORT_SHA" .
    - docker push "$IMAGE:latest"
    - docker push "$IMAGE:$CI_COMMIT_SHORT_SHA"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - frontend-next/**/*
    # Allow building from the integration branch too (so the first image exists).
    - if: $CI_COMMIT_BRANCH == "claude/frontend-next-deploy"
